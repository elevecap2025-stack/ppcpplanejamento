<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#12161C; --panel:#1B212B; --panel-alt:#151B23; --steel:#3E4C5E; --steel-border:#232B36;
  --text:#E7EBEF; --text-muted:#8C97A6; --row-hover:#1A2029;
  --brand:#0080C6; --brand-dim:#005788; --green:#4CAF6D; --red:#E2574C;
}
html[data-theme="light"]{
  --bg:#F3F5F7; --panel:#FFFFFF; --panel-alt:#EAEFF3; --steel:#D7DEE5; --steel-border:#E3E8ED;
  --text:#20262E; --text-muted:#66707C; --row-hover:#F1F4F7;
  --brand:#0080C6; --brand-dim:#005788; --green:#2F9E5B; --red:#D1493E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{font-family:'Inter',sans-serif;color:var(--text);transition:background .2s,color .2s;}
button,input,select{font-family:'Inter',sans-serif;}

.pcp-shell{display:flex;min-height:100vh;}
.pcp-sidebar{width:236px;flex-shrink:0;background:var(--panel-alt);border-right:1px solid var(--steel-border);padding:20px 12px;display:flex;flex-direction:column;gap:3px;transition:background .2s,border-color .2s;}
.pcp-sidebar-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;border:none;background:transparent;color:var(--text-muted);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;position:relative;transition:background .15s,color .15s;width:100%;}
.pcp-sidebar-btn:hover{background:var(--row-hover);color:var(--text);}
.pcp-sidebar-btn.active{background:var(--row-hover);color:var(--brand);}
.pcp-sidebar-btn.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--brand);border-radius:0 3px 3px 0;}
.pcp-content{flex:1;min-width:0;padding:30px 34px;overflow-x:auto;}

.btn{font-size:13px;font-weight:600;padding:9px 16px;border-radius:7px;border:1px solid var(--steel);background:var(--panel);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap;}
.btn:hover{border-color:var(--brand);background:var(--row-hover);}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#ffffff;}
.btn-primary:hover{background:var(--brand-dim);border-color:var(--brand-dim);}
.btn-danger{background:transparent;border-color:#E2574C55;color:var(--red);}
.btn-danger:hover{background:#E2574C1A;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-muted);}
.btn-ghost:hover{background:var(--row-hover);color:var(--text);}
.icon-btn{background:transparent;border:1px solid var(--steel);color:var(--text-muted);border-radius:6px;padding:6px;cursor:pointer;display:inline-flex;transition:all .15s;}
.icon-btn:hover{color:var(--text);border-color:var(--brand);}
.icon-btn.active{color:var(--brand);border-color:var(--brand);}

.pcp-card{background:var(--panel);border:1px solid var(--steel-border);border-radius:10px;padding:18px;transition:background .2s,border-color .2s;}
.pcp-table{width:100%;border-collapse:collapse;font-size:13px;}
.pcp-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600;padding:11px 12px;border-bottom:1px solid var(--steel-border);white-space:nowrap;}
.pcp-table td{padding:11px 12px;border-bottom:1px solid var(--steel-border);color:var(--text);vertical-align:middle;}
.pcp-table tr:hover td{background:var(--row-hover);}
.pedido-row-draggable{cursor:grab;}
.pedido-row-draggable:active{cursor:grabbing;}
.pedido-row-draggable.dragging{opacity:.35;}
.sortable-th:hover{color:var(--brand);}
.row-atencao td{background:rgba(255,193,7,0.20);-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}
.row-atencao:hover td{background:rgba(255,193,7,0.34) !important;}
.icon-btn.atencao-on{color:#C98A00;border-color:#C98A00;}

.drag-target{transition:box-shadow .15s,border-color .15s;}
.drag-target.drag-over{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset;}

.field-input,.field-select{width:100%;background:var(--bg);border:1px solid var(--steel);color:var(--text);border-radius:6px;padding:9px 10px;font-size:13.5px;}
.field-input:focus,.field-select:focus{outline:none;border-color:var(--brand);}
.field-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:5px;display:block;font-weight:600;}

.modal-overlay{position:fixed;inset:0;background:rgba(8,10,14,0.72);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;}
.modal-card{background:var(--panel);border:1px solid var(--steel);border-radius:10px;width:100%;max-height:88vh;overflow:auto;padding:24px;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-header h3{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;color:var(--text);margin:0;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media (max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.screen-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.screen-title{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:600;margin:0;}
.screen-subtitle{color:var(--text-muted);font-size:12.5px;margin:5px 0 0 29px;}
.stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
.stat-card{flex:1 1 160px;min-width:150px;}
.stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700;}
.stat-value{font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;margin-top:8px;}
.preview-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700;margin-bottom:8px;}
.filter-bar{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:22px;}
.day-toggle{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;padding:7px 12px;border:1px solid var(--steel);border-radius:6px;user-select:none;}
.section-label{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin:0 0 10px;color:var(--text-muted);}

.toast{background:var(--panel);border:1px solid var(--steel);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,0.45);max-width:320px;}
#toast-root{position:fixed;bottom:20px;right:20px;z-index:100;}

.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{width:100%;max-width:380px;text-align:center;}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--steel);border-radius:4px;}

.print-only{display:none;}
@media print{
  @page { size: landscape; margin: 8mm; }
  body *{visibility:hidden;}
  #content, #content *{visibility:visible;}
  #content{position:absolute;left:0;top:0;width:100%;padding:0;}
  .no-print, .no-print-header{display:none !important;}
  .print-only{display:block !important;}
  body{background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}
  .pcp-card{border:1px solid #999;box-shadow:none;background:#fff !important;padding:5px !important;}
  .pcp-table{font-size:9px;}
  .pcp-table th{padding:3px 5px;font-size:7.5px;color:#000;border-color:#999;}
  .pcp-table td{padding:3px 5px;color:#000;border-color:#ddd;line-height:1.25;}
  .row-atencao td{background:#FFDD66 !important;-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important;}
  .atencao-flag-icon{display:inline-flex !important;}
  .stat-value,.screen-title{color:#000 !important;}
  .day-sections-wrap{gap:5px !important;}
  .day-section-header{margin-bottom:3px !important;}
  .day-section-header h3{font-size:11px !important;}
  .day-section-header span{font-size:9px !important;}
  .coil-swatch-box{width:8px !important;height:6px !important;}
  .coil-swatch-label{font-size:7.5px !important;}
  .coil-swatch-wrap{gap:3px !important;}
  .status-pill{padding:1px 5px !important;font-size:7px !important;}
  .status-pill-dot{width:4px !important;height:4px !important;}
}

@media (max-width:860px){
  .pcp-shell{flex-direction:column;}
  .pcp-sidebar{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--steel-border);padding:10px;gap:4px;}
  .pcp-sidebar-btn{flex-shrink:0;}
  .pcp-sidebar-btn.active::before{left:8px;right:8px;top:auto;bottom:-9px;height:3px;width:auto;border-radius:3px 3px 0 0;}
  .pcp-content{padding:18px;}
}
</style>
</head>

const DIAS_SEMANA = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
function pad2(n){ return String(n).padStart(2,"0"); }
function toISO(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function addDays(d,n){ const c=new Date(d); c.setDate(c.getDate()+n); return c; }
function mondayOfCurrentWeek(){ const d=new Date(); const day=(d.getDay()+6)%7; return addDays(d,-day); }
function weekdayFromDateStr(s){ if(!s) return ""; const [y,m,d]=s.split("-").map(Number); return DIAS_SEMANA[new Date(y,m-1,d).getDay()]; }
function fmtDateBR(s){ if(!s) return "—"; const [y,m,d]=s.split("-"); return d+"/"+m+"/"+y; }
function fmtNum(n){ return Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtBRL(n){ return Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function fmtElapsed(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return pad2(h)+":"+pad2(m)+":"+pad2(s);
}
function isoWeekNumber(s){
  const [y,m,d]=s.split("-").map(Number);
  const date=new Date(Date.UTC(y,m-1,d));
  const dayNum=(date.getUTCDay()+6)%7;
  date.setUTCDate(date.getUTCDate()-dayNum+3);
  const firstThursday=new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const diff=date-firstThursday;
  return 1+Math.round(diff/(7*24*3600*1000));
}
function isoFromUTCParts(d){ return d.getUTCFullYear()+"-"+pad2(d.getUTCMonth()+1)+"-"+pad2(d.getUTCDate()); }
function mondayOfIsoWeek(week, year){
  const jan4 = new Date(Date.UTC(year,0,4));
  const jan4Day = (jan4.getUTCDay()+6)%7;
  const mondayWeek1 = new Date(jan4); mondayWeek1.setUTCDate(jan4.getUTCDate()-jan4Day);
  const monday = new Date(mondayWeek1); monday.setUTCDate(mondayWeek1.getUTCDate() + (week-1)*7);
  return monday;
}
function jumpToWeek(stage, week, year){
  week = Number(week); year = Number(year);
  if(!week || !year) return;
  const s = STATE.stageState[stage];
  const monday = mondayOfIsoWeek(week, year);
  s.weekStart = isoFromUTCParts(monday);
  s.dIni = s.weekStart;
  const sat = new Date(monday); sat.setUTCDate(monday.getUTCDate()+5);
  s.dFim = isoFromUTCParts(sat);
  renderScreen();
}
function todayStr(){ return toISO(new Date()); }
function escapeAttr(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escapeHtml(s){ return escapeAttr(s); }
function matchesDateFilters(dateStr, f){
  if(!dateStr) return false;
  const hasAny = f.dia || f.dIni || f.dFim || f.ano || f.mes;
  if(!hasAny) return true;
  if(f.dia) return dateStr===f.dia;
  if(f.dIni && dateStr<f.dIni) return false;
  if(f.dFim && dateStr>f.dFim) return false;
  if(f.ano && dateStr.slice(0,4)!==String(f.ano)) return false;
  if(f.mes && dateStr.slice(5,7)!==String(f.mes).padStart(2,"0")) return false;
  return true;
}

function closeModal(){ document.getElementById("modal-root").innerHTML=""; }
function showToast(type, text){
  const root = document.getElementById("toast-root");
  const color = type==="success" ? COLORS.green : (type==="error" ? COLORS.red : COLORS.brand);
  root.innerHTML = '<div class="toast" style="border-left:4px solid '+color+'">'+escapeHtml(text)+'</div>';

async function submitBaixaManualForm(event){
  event.preventDefault();
  const fd = new FormData(event.target);
  const data = Object.fromEntries(fd.entries());
  const m = STATE.materiais.find(x=>x.id===data.materialId);
  const qtd = Number(data.quantidade||0);
  if(!m || qtd<=0) return false;
  const novoEstoque = Math.round((m.estoque - qtd)*100)/100;
  const { data:row, error:insErr } = await sb.from("baixas_manual").insert({
    material_id:data.materialId, quantidade:qtd, motivo:data.motivo||"", observacao:data.observacao||"", data:data.data||todayStr(),
  }).select().single();
  if(insErr){ sbErrorToast("registrar baixa", insErr); return false; }
  const { error:updErr } = await sb.from("materiais").update({estoque:novoEstoque}).eq("id", data.materialId);
  if(updErr){
    sbErrorToast("atualizar estoque após a baixa", updErr);
    await sb.from("baixas_manual").delete().eq("id", row.id);
    return false;
  }
  m.estoque = novoEstoque;
  STATE.baixasManual.push(mapBaixaManualFromRow(row));
  closeModal();
  renderScreen();
  showToast("success","Baixa de "+fmtNum(qtd)+" "+m.unidade+" registrada para "+m.nome+".");
  return false;
}
function confirmDeleteBaixaManual(id){
  const b = STATE.baixasManual.find(x=>x.id===id);
  const m = b ? STATE.materiais.find(x=>x.id===b.materialId) : null;
  const html =
    '<div class="modal-overlay" onmousedown="if(event.target===this) closeModal()">'+
      '<div class="modal-card" style="max-width:380px">'+
        '<div class="modal-header"><h3>Estornar baixa</h3><button type="button" class="icon-btn" onclick="closeModal()">'+icon("x",16)+'</button></div>'+
        '<p style="color:'+COLORS.textMuted+';font-size:13.5px;line-height:1.5;margin:0">Remover esta baixa de "'+(m?escapeHtml(m.nome):"?")+'"? A quantidade será devolvida ao estoque.</p>'+
        '<div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button type="button" class="btn btn-danger" onclick="doDeleteBaixaManual(\''+id+'\')">Remover</button></div>'+
      '</div>'+
    '</div>';
  document.getElementById("modal-root").innerHTML = html;
}
async function doDeleteBaixaManual(id){
  const b = STATE.baixasManual.find(x=>x.id===id);
  if(b){
    const m = STATE.materiais.find(x=>x.id===b.materialId);
    const novoEstoque = m ? Math.round((m.estoque + b.quantidade)*100)/100 : null;
    const { error:delErr } = await sb.from("baixas_manual").delete().eq("id", id);
    if(delErr){ sbErrorToast("remover baixa", delErr); return; }
    if(m){
      const { error:updErr } = await sb.from("materiais").update({estoque:novoEstoque}).eq("id", m.id);
      if(updErr){ sbErrorToast("estornar estoque", updErr); }
      else m.estoque = novoEstoque;
    }
    STATE.baixasManual = STATE.baixasManual.filter(x=>x.id!==id);
  }
  closeModal();
  renderScreen();
  showToast("info","Baixa removida e estoque estornado.");
}

async function submitTransferenciaForm(event){
  event.preventDefault();
  const fd = new FormData(event.target);
  const data = Object.fromEntries(fd.entries());
  const qtd = Number(data.quantidade||0);
  if(data.materialOrigemId===data.materialDestinoId){ showToast("info","Escolha matérias-primas de origem e destino diferentes."); return false; }
  const origem = STATE.materiais.find(x=>x.id===data.materialOrigemId);
  const destino = STATE.materiais.find(x=>x.id===data.materialDestinoId);
  if(!origem || !destino || qtd<=0) return false;
  const novoOrigem = Math.round((origem.estoque - qtd)*100)/100;
  const novoDestino = Math.round((destino.estoque + qtd)*100)/100;
  const { data:row, error:insErr } = await sb.from("transferencias").insert({
    material_origem_id:origem.id, material_destino_id:destino.id, quantidade:qtd, observacao:data.observacao||"", data:data.data||todayStr(),
  }).select().single();
  if(insErr){ sbErrorToast("registrar transferência", insErr); return false; }
  const [r1, r2] = await Promise.all([
    sb.from("materiais").update({estoque:novoOrigem}).eq("id", origem.id),
    sb.from("materiais").update({estoque:novoDestino}).eq("id", destino.id),
  ]);
  if(r1.error || r2.error){
    sbErrorToast("atualizar estoque da transferência", r1.error||r2.error);
    await sb.from("transferencias").delete().eq("id", row.id);
    return false;
  }
  origem.estoque = novoOrigem;
  destino.estoque = novoDestino;
  STATE.transferencias.push(mapTransferenciaFromRow(row));
  closeModal();
  renderScreen();
  showToast("success","Transferidos "+fmtNum(qtd)+" de "+origem.nome+" para "+destino.nome+".");
  return false;
}
function confirmDeleteTransferencia(id){
  const t = STATE.transferencias.find(x=>x.id===id);
  const origem = t ? STATE.materiais.find(x=>x.id===t.materialOrigemId) : null;
  const destino = t ? STATE.materiais.find(x=>x.id===t.materialDestinoId) : null;
  const html =
    '<div class="modal-overlay" onmousedown="if(event.target===this) closeModal()">'+
      '<div class="modal-card" style="max-width:400px">'+
        '<div class="modal-header"><h3>Estornar transferência</h3><button type="button" class="icon-btn" onclick="closeModal()">'+icon("x",16)+'</button></div>'+
        '<p style="color:'+COLORS.textMuted+';font-size:13.5px;line-height:1.5;margin:0">Desfazer a transferência de "'+(origem?escapeHtml(origem.nome):"?")+'" para "'+(destino?escapeHtml(destino.nome):"?")+'"? O estoque de ambos será revertido.</p>'+
        '<div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button type="button" class="btn btn-danger" onclick="doDeleteTransferencia(\''+id+'\')">Remover</button></div>'+
      '</div>'+
    '</div>';
  document.getElementById("modal-root").innerHTML = html;
}
async function doDeleteTransferencia(id){
  const t = STATE.transferencias.find(x=>x.id===id);
  if(t){
    const origem = STATE.materiais.find(x=>x.id===t.materialOrigemId);
    const destino = STATE.materiais.find(x=>x.id===t.materialDestinoId);
    const { error:delErr } = await sb.from("transferencias").delete().eq("id", id);
    if(delErr){ sbErrorToast("remover transferência", delErr); return; }
    const writes = [];
    if(origem) writes.push(sb.from("materiais").update({estoque:Math.round((origem.estoque + t.quantidade)*100)/100}).eq("id", origem.id));
    if(destino) writes.push(sb.from("materiais").update({estoque:Math.round((destino.estoque - t.quantidade)*100)/100}).eq("id", destino.id));
    const results = await Promise.all(writes);
    results.forEach(r=>{ if(r.error) sbErrorToast("estornar estoque da transferência", r.error); });
    if(origem) origem.estoque = Math.round((origem.estoque + t.quantidade)*100)/100;
    if(destino) destino.estoque = Math.round((destino.estoque - t.quantidade)*100)/100;
    STATE.transferencias = STATE.transferencias.filter(x=>x.id!==id);
  }
  closeModal();
  renderScreen();
  showToast("info","Transferência estornada.");
}

function fieldHtml(f, item){
  const val = item ? (item[f.key] != null ? item[f.key] : "") : (f.default || "");
  const label = '<label class="field-label">'+f.label+(f.required?" *":"")+'</label>';
  let control;
  if(f.type==="select"){
    const opts = f.options();
    control = '<select class="field-select" name="'+f.key+'" '+(f.required?"required":"")+'><option value="">Selecione…</option>'+
      opts.map(o=>'<option value="'+escapeAttr(o.value)+'" '+(String(val)===String(o.value)?"selected":"")+'>'+escapeHtml(o.label)+'</option>').join('')+
      '</select>';
  } else if(f.type==="number"){
    control = '<input class="field-input" type="number" step="0.01" name="'+f.key+'" value="'+escapeAttr(val)+'" '+(f.required?"required":"")+'/>';
  } else {
    const listId = "dl-"+f.key;
    const listAttr = f.datalist ? ' list="'+listId+'"' : '';
    control = '<input class="field-input" type="text" name="'+f.key+'" value="'+escapeAttr(val)+'"'+listAttr+' '+(f.required?"required":"")+'/>';
    if(f.datalist){ control += '<datalist id="'+listId+'">'+f.datalist().map(o=>'<option value="'+escapeAttr(o)+'">').join('')+'</datalist>'; }
  }
  return '<div style="'+(f.full?"grid-column:1 / -1":"")+'">'+label+control+'</div>';
}

  const fieldsHtml = cfg.fields.map(f=>fieldHtml(f,item)).join("");
  const html =
    '<div class="modal-overlay" onmousedown="if(event.target===this) closeModal()">'+
      '<div class="modal-card" style="max-width:560px">'+
        '<div class="modal-header"><h3>'+(mode==="new"?cfg.newLabel:cfg.editLabel)+'</h3><button type="button" class="icon-btn" onclick="closeModal()">'+icon("x",16)+'</button></div>'+
        '<form onsubmit="return submitEntityForm(event,\''+type+'\',\''+mode+'\',\''+(id||"")+'\')">'+
          '<div class="grid-2">'+fieldsHtml+'</div>'+
          '<div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button type="submit" class="btn btn-primary">Salvar</button></div>'+
        '</form>'+
      '</div>'+
    '</div>';

async function submitEntityForm(event, type, mode, id){
  event.preventDefault();
  const cfg = ENTITY_CONFIGS[type];
  const fd = new FormData(event.target);
  const data = Object.fromEntries(fd.entries());
  const submitBtn = event.target.querySelector('button[type="submit"]');
  if(submitBtn) submitBtn.disabled = true;
  const ok = mode==="new" ? await cfg.onAdd(data) : await cfg.onUpdate(id, data);
  if(submitBtn) submitBtn.disabled = false;
  if(ok===false) return false;
  closeModal();
  renderScreen();
  return false;
}

/* ============================== PEDIDOS ============================== */
function computeConsumption(pedido){
  const map = {};
  if(!pedido) return map;
  const m = Number(pedido.metragem||0);
  if(pedido.corSupId) map[pedido.corSupId] = (map[pedido.corSupId]||0) + m;
  if(pedido.corInfId) map[pedido.corInfId] = (map[pedido.corInfId]||0) + m;
  if(pedido.epsId){
    const mat = STATE.materiais.find(mm=>mm.id===pedido.epsId);
    const fator = mat ? Number(mat.fator||1) : 1;
    map[pedido.epsId] = (map[pedido.epsId]||0) + m*fator;
  }
  return map;
}
async function adjustStock(oldPedido, newPedido){
  const oldMap = computeConsumption(oldPedido);
  const newMap = computeConsumption(newPedido);
  const ids = new Set([...Object.keys(oldMap), ...Object.keys(newMap)]);
  const writes = [];
  ids.forEach(id=>{
    const delta = (newMap[id]||0) - (oldMap[id]||0);
    if(!delta) return;
    const mat = STATE.materiais.find(m=>m.id===id);
    if(!mat) return;
    const novoEstoque = Math.round((mat.estoque - delta)*100)/100;
    writes.push(
      sb.from("materiais").update({estoque:novoEstoque}).eq("id", id).then(r=>{
        if(r.error){ sbErrorToast("ajustar estoque de "+mat.nome, r.error); }
        else { mat.estoque = novoEstoque; }
      })
    );
  });
  await Promise.all(writes);
}
async function savePedido(id, data){
  const parsed = Object.assign({}, data, {metragem: Number(data.metragem||0), temPintura: !!data.temPintura, temColagem: !!data.temColagem});
  if(id){
    const old = STATE.pedidos.find(p=>p.id===id);
    const updated = Object.assign({}, old, parsed, {id});
    const stagesChanged = (!!old.temPintura!==updated.temPintura) || (!!old.temColagem!==updated.temColagem);
    let repositioned = false;
    if(stagesChanged && old.etapaAtual!=="entregue"){
      const oldOrder = stageOrderFor(old);
      const newOrder = stageOrderFor(updated);
      let oldIdx = oldOrder.indexOf(old.etapaAtual);
      if(oldIdx===-1) oldIdx = 0;
      const newIdx = Math.min(oldIdx, newOrder.length-1);
      const newStage = newOrder[newIdx];
      if(newStage!==old.etapaAtual){
        updated.etapaAtual = newStage;
        updated.producaoStartedAt = null;
        updated.producaoElapsedMs = 0;
        updated.producaoStatus = "idle";
        repositioned = true;
      }
    }
    const { error } = await sb.from("pedidos").update(pedidoToRow(updated)).eq("id", id);
    if(error){ sbErrorToast("atualizar pedido", error); return false; }
    await adjustStock(old, updated);
    STATE.pedidos = STATE.pedidos.map(p=>p.id===id?updated:p);
    showToast("success", repositioned ? "Pedido atualizado — etapa reposicionada para "+(STAGE_DEFS[updated.etapaAtual]?STAGE_DEFS[updated.etapaAtual].label:updated.etapaAtual)+" conforme o novo fluxo." : "Pedido atualizado e estoque ajustado.");
  } else {
    const base = Object.assign({etapaAtual:"perfilar", motoristaId:"", dataEntregue:"", producaoStatus:"idle", producaoElapsedMs:0, producaoStartedAt:null}, parsed);
    const { data:row, error } = await sb.from("pedidos").insert(pedidoToRow(base)).select().single();
    if(error){ sbErrorToast("lançar pedido", error); return false; }
    const novo = mapPedidoFromRow(row);
    await adjustStock(null, novo);
    STATE.pedidos = [novo, ...STATE.pedidos];
    showToast("success","Pedido lançado e estoque atualizado.");
  }
}
async function deletePedido(id){
  const old = STATE.pedidos.find(p=>p.id===id);
  const { error } = await sb.from("pedidos").delete().eq("id", id);
  if(error){ sbErrorToast("remover pedido", error); return false; }
  await adjustStock(old, null);
  STATE.pedidos = STATE.pedidos.filter(p=>p.id!==id);
  showToast("info","Pedido removido e estoque estornado.");
}

/* ---- production timer ---- */
async function startTimer(id){
  const p = STATE.pedidos.find(x=>x.id===id);
  if(!p || p.producaoStatus==="concluido") return;
  const startedAt = Date.now();
  p.producaoStartedAt = startedAt;
  p.producaoStatus = "rodando";
  renderScreen();
  const { error } = await sb.from("pedidos").update({producao_status:"rodando", producao_started_at:new Date(startedAt).toISOString()}).eq("id", id);
  if(error) sbErrorToast("iniciar produção", error);
}
async function pauseTimer(id){
  const p = STATE.pedidos.find(x=>x.id===id);
  if(!p || p.producaoStatus!=="rodando") return;
  const elapsed = (p.producaoElapsedMs||0) + (Date.now()-(p.producaoStartedAt||Date.now()));
  p.producaoElapsedMs = elapsed;
  p.producaoStartedAt = null;
  p.producaoStatus = "pausado";
  renderScreen();
  const { error } = await sb.from("pedidos").update({producao_status:"pausado", producao_elapsed_ms:elapsed, producao_started_at:null}).eq("id", id);
  if(error) sbErrorToast("pausar produção", error);
}
async function concludeTimer(id){
  const p = STATE.pedidos.find(x=>x.id===id);
  if(!p) return;
  let elapsed = p.producaoElapsedMs||0;
  if(p.producaoStatus==="rodando"){
    elapsed = elapsed + (Date.now()-(p.producaoStartedAt||Date.now()));
  }
  const fromStage = p.etapaAtual || "perfilar";
  const to = nextStageOf(p);
  let patch;
  if(to==="entregue"){
    const entregue = STATE.statusOptions.find(s=>s.nome.toLowerCase().indexOf("entregue")===0);
    patch = { producao_status:"concluido", producao_started_at:null, producao_elapsed_ms:elapsed, etapa_atual:"entregue", data_entregue: todayStr() };
    if(entregue) patch.situacao_id = entregue.id;
  } else {
    patch = { etapa_atual:to, producao_started_at:null, producao_elapsed_ms:0, producao_status:"idle" };
  }
  const { error } = await sb.from("pedidos").update(patch).eq("id", id);
  if(error){ sbErrorToast("concluir etapa", error); return; }
  p.producaoElapsedMs = patch.producao_elapsed_ms;
  p.producaoStartedAt = null;
  p.producaoStatus = patch.producao_status;
  p.etapaAtual = patch.etapa_atual;
  if(to==="entregue"){
    p.dataEntregue = patch.data_entregue;
    if(patch.situacao_id) p.situacaoId = patch.situacao_id;
    showToast("success","Entrega confirmada — pedido movido para Pedidos Entregues.");
  } else {
    const stDef = STAGE_DEFS[to];
    showToast("success", (STAGE_DEFS[fromStage]?STAGE_DEFS[fromStage].short:fromStage)+" concluída — pedido movido para "+(stDef?stDef.label:to)+".");
  }
  renderScreen();
}

  const status = p.producaoStatus || "idle";
  const running = status==="rodando" && p.producaoStartedAt;
  const elapsed = (p.producaoElapsedMs||0) + (running ? (Date.now()-p.producaoStartedAt) : 0);
  const timeColor = status==="concluido" ? COLORS.green : (running ? COLORS.brand : COLORS.textMuted);
  const timeHtml = '<span id="timer-'+p.id+'" style="font-family:\'IBM Plex Mono\',monospace;font-size:11.5px;font-weight:600;color:'+timeColor+'">'+fmtElapsed(elapsed)+'</span>';
  if(status==="concluido"){
    return '<div style="display:flex;align-items:center;gap:6px">'+icon("checkCircle",14,COLORS.green)+timeHtml+'</div>';
  }
  const stageDef = STAGE_DEFS[p.etapaAtual] || STAGE_DEFS.perfilar;
  const concludeTitle = stageDef.concludeLabel;
  let buttons = "";
  if(status==="rodando"){
    buttons = '<button type="button" class="icon-btn" title="Pausar" onclick="pauseTimer(\''+p.id+'\')">'+icon("pause",12)+'</button>'+
      '<button type="button" class="icon-btn" title="'+concludeTitle+'" onclick="concludeTimer(\''+p.id+'\')">'+icon("check",12)+'</button>';

    buttons = '<button type="button" class="icon-btn" title="Retomar" onclick="startTimer(\''+p.id+'\')">'+icon("play",12)+'</button>'+
      '<button type="button" class="icon-btn" title="'+concludeTitle+'" onclick="concludeTimer(\''+p.id+'\')">'+icon("check",12)+'</button>';

    buttons = '<button type="button" class="icon-btn" title="Iniciar produção" onclick="startTimer(\''+p.id+'\')">'+icon("play",12)+'</button>'+
      '<button type="button" class="icon-btn" title="'+concludeTitle+'" onclick="concludeTimer(\''+p.id+'\')">'+icon("check",12)+'</button>';

  return '<div style="display:flex;align-items:center;gap:5px">'+timeHtml+buttons+'</div>';

function submitPedidoForm(event, mode, id){

function setPedidosSort(campo){
  if(STATE.pedidosSort.campo===campo){ STATE.pedidosSort.direcao = STATE.pedidosSort.direcao==="asc"?"desc":"asc"; }
  else { STATE.pedidosSort = {campo, direcao:"asc"}; }
  renderScreen();
}
function sortPedidos(list){
  const accessor = PEDIDO_SORT_ACCESSORS[STATE.pedidosSort.campo] || PEDIDO_SORT_ACCESSORS.dataProg;
  const dir = STATE.pedidosSort.direcao==="asc" ? 1 : -1;
  return [...list].sort((a,b)=>{
    const va=accessor(a), vb=accessor(b);
    if(va<vb) return -1*dir;
    if(va>vb) return 1*dir;
    return 0;
  });
}
function headerRowHtml(visibleCols, showTimer, sortableHeaders){
  const cols = visibleCols || PEDIDO_COLUMNS.map(c=>c.key);
  const ths = cols.map(key=>{
    const colDef = PEDIDO_COLUMNS.find(c=>c.key===key);
    const label = colDef ? colDef.label : key;
    if(sortableHeaders){
      const active = STATE.pedidosSort.campo===key;
      const arrow = active ? (STATE.pedidosSort.direcao==="asc"?" \u25B2":" \u25BC") : "";
      return '<th class="sortable-th" style="cursor:pointer;user-select:none;'+(active?"color:"+COLORS.brand:"")+'" onclick="setPedidosSort(\''+key+'\')" title="Ordenar por '+label+'">'+label+'<span>'+arrow+'</span></th>';
    }
    return '<th>'+label+'</th>';
  }).join("");
  return '<tr>'+ths+(showTimer?'<th class="no-print" style="width:150px">Produção</th>':'')+'<th class="no-print" style="width:84px">Ações</th></tr>';
}
function pedidoTableHtml(pedidos, draggable, editableSituacao, showTimer, sortableHeaders, visibleCols, hideWeekday, editableMotorista){
  if(pedidos.length===0) return emptyStateHtml(draggable ? "Nenhum pedido programado. Arraste um pedido para cá." : undefined);
  const rows = pedidos.map(p=>pedidoRowHtml(p, draggable, editableSituacao, showTimer, visibleCols, hideWeekday, editableMotorista)).join("");
  const headRow = headerRowHtml(visibleCols, showTimer, sortableHeaders);
  return '<table class="pcp-table"><thead>'+headRow+'</thead><tbody>'+rows+'</tbody></table>';
}

function updatePedidosFiltro(key, val){ STATE.pedidosFiltro[key]=val; renderScreen(); }
function clearPedidosFiltro(){ STATE.pedidosFiltro = {cliente:"",op:"",situacaoId:"",material:"",corSupId:"",corInfId:"",cidadeId:"",dIni:"",dFim:""}; renderScreen(); }
function filterPedidosList(list){
  const f = STATE.pedidosFiltro;
  return list.filter(p=>{
    if(f.cliente && !(p.cliente||"").toLowerCase().includes(f.cliente.toLowerCase())) return false;
    if(f.op && !(p.op||"").toLowerCase().includes(f.op.toLowerCase())) return false;
    if(f.situacaoId && p.situacaoId!==f.situacaoId) return false;
    if(f.material && !(p.material||"").toLowerCase().includes(f.material.toLowerCase())) return false;
    if(f.corSupId && p.corSupId!==f.corSupId) return false;
    if(f.corInfId && p.corInfId!==f.corInfId) return false;
    if(f.cidadeId && p.cidadeId!==f.cidadeId) return false;
    if(f.dIni && (!p.dataProg || p.dataProg<f.dIni)) return false;
    if(f.dFim && (!p.dataProg || p.dataProg>f.dFim)) return false;
    return true;
  });
}

async function saveMetas(stage){
  const s = STATE.stageState[stage];
  const novasMetas = [];

  showToast("success","Metas de produção atualizadas.");

function diaCardHtml(label, metros, meta){
  const pct = meta>0 ? Math.min(100, Math.round((metros/meta)*100)) : 0;
  const atingiu = meta>0 && metros>=meta;
  const color = atingiu ? COLORS.green : (pct>=60 ? COLORS.brand : COLORS.red);
  return '<div class="pcp-card stat-card">'+
    '<div class="stat-label">'+label+'</div>'+
    '<div style="font-family:\'Space Grotesk\',sans-serif;font-size:19px;font-weight:700;margin-top:6px;color:'+color+'">'+fmtNum(metros)+' m</div>'+
    '<div style="font-size:10.5px;color:'+COLORS.textMuted+';margin-top:4px">Meta: '+fmtNum(meta)+' m</div>'+
    '<div style="height:5px;background:var(--panel-alt);border-radius:3px;margin-top:8px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+color+'"></div></div>'+
  '</div>';
}
function materialSummaryHtml(pedidosList, includeHeading){
  const porCor = {}, porEps = {};
  pedidosList.forEach(p=>{
    if(p.corSupId) porCor[p.corSupId] = (porCor[p.corSupId]||0) + Number(p.metragem||0);
    if(p.corInfId) porCor[p.corInfId] = (porCor[p.corInfId]||0) + Number(p.metragem||0);
    if(p.epsId){ const m=STATE.materiais.find(x=>x.id===p.epsId); const fator=m?Number(m.fator||1):1; porEps[p.epsId]=(porEps[p.epsId]||0)+Number(p.metragem||0)*fator; }
  });
  const corItems = Object.keys(porCor).map(id=>{ const m=STATE.materiais.find(x=>x.id===id); return {label:m?m.nome:"?", labelHtml:coilSwatchHtml(m?m.nome:"?"), value:porCor[id]}; }).sort((a,b)=>b.value-a.value);
  const epsItems = Object.keys(porEps).map(id=>{ const m=STATE.materiais.find(x=>x.id===id); return {label:m?m.nome:"?", value:porEps[id]}; }).sort((a,b)=>b.value-a.value);
  return (includeHeading!==false ? '<h3 class="section-label">RESUMO DE MATERIAIS (PERÍODO FILTRADO)</h3>' : '')+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:22px">'+
      '<div class="pcp-card"><div class="preview-title">Bobinas por Cor (metragem)</div>'+(corItems.length?barListHtml(corItems):emptyStateHtml("Sem consumo de bobina no período."))+'</div>'+
      '<div class="pcp-card"><div class="preview-title">EPS por Tipo (metragem)</div>'+(epsItems.length?barListHtml(epsItems):emptyStateHtml("Sem consumo de EPS no período."))+'</div>'+
    '</div>';
}
function computeStageAtivos(stage){
  const s = STATE.stageState[stage];
  const dIni = s.dIni, dFim = s.dFim;
  return STATE.pedidos.filter(p=>{
    if((p.etapaAtual||"perfilar")!==stage || !p.dataProg) return false;
    if(p.dataProg<dIni || p.dataProg>dFim) return false;
    if(s.maquinaId && p.equipamentoId!==s.maquinaId) return false;
    if(s.cidadeId && p.cidadeId!==s.cidadeId) return false;
    if(s.corSupId && p.corSupId!==s.corSupId) return false;
    if(s.corInfId && p.corInfId!==s.corInfId) return false;
    if(s.epsId && p.epsId!==s.epsId) return false;
    if(s.material && !(p.material||"").toLowerCase().includes(s.material.toLowerCase())) return false;
    if(stage==="entrega" && s.motoristaId && p.motoristaId!==s.motoristaId) return false;
    return true;
  });
}
function printStageConsumptionReport(stage){
  const s = STATE.stageState[stage];
  const maquina = STATE.equipamentos.find(e=>e.id===s.maquinaId);
  const ativos = computeStageAtivos(stage);
  const weekNum = s.dIni ? isoWeekNumber(s.dIni) : "—", year = s.dIni ? s.dIni.slice(0,4) : "";
  const header =
    '<div style="margin-bottom:14px">'+
      '<div style="font-family:\'Space Grotesk\',sans-serif;font-size:16px;font-weight:700">Relatório de Consumo de Materiais — '+STAGE_DEFS[stage].short+' — ELEVE</div>'+
      '<div style="font-size:10.5px;margin-top:3px">'+(maquina?escapeHtml(maquina.nome):"Todas as máquinas")+' · '+fmtDateBR(s.dIni)+' a '+fmtDateBR(s.dFim)+' · Semana '+weekNum+'/'+year+' · Gerado em '+fmtDateBR(todayStr())+'</div>'+
    '</div>';
  document.getElementById("content").innerHTML = header + materialSummaryHtml(ativos, false);
  window.print();
  renderScreen();
}

/* ============================== PEDIDOS ENTREGUES ============================== */
function updateEntreguesFiltro(key, val){ STATE.entreguesFiltro[key]=val; renderScreen(); }
function clearEntreguesFiltro(){ STATE.entreguesFiltro = {cliente:"",op:"",motoristaId:"",dIni:"",dFim:""}; renderScreen(); }
function renderEntreguesScreen(){
  const f = STATE.entreguesFiltro;
  const entregues = STATE.pedidos.filter(p=>{
    if(p.etapaAtual!=="entregue") return false;
    if(f.cliente && !(p.cliente||"").toLowerCase().includes(f.cliente.toLowerCase())) return false;
    if(f.op && !(p.op||"").toLowerCase().includes(f.op.toLowerCase())) return false;
    if(f.motoristaId && p.motoristaId!==f.motoristaId) return false;
    if(f.dIni && (!p.dataEntregue || p.dataEntregue<f.dIni)) return false;
    if(f.dFim && (!p.dataEntregue || p.dataEntregue>f.dFim)) return false;
    return true;
  }).sort((a,b)=> (b.dataEntregue||"").localeCompare(a.dataEntregue||""));
  const metragemTotal = entregues.reduce((s,p)=>s+Number(p.metragem||0),0);
  const visibleCols = ["dataProg","cliente","op","material","corSup","corInf","eps","metragem","cidade","motorista"];

  document.getElementById("content").innerHTML =
    screenHeaderHtml("checkCircle","Pedidos Entregues","Pedidos que concluíram todo o fluxo de produção e foram entregues")+
    '<div class="stat-row">'+
      statCardHtml("Pedidos Entregues", entregues.length, "checkCircle", COLORS.green)+
      statCardHtml("Metragem Total", fmtNum(metragemTotal)+" m", "package", COLORS.brand)+
    '</div>'+
    '<div class="pcp-card filter-bar">'+
      '<div style="min-width:170px"><label class="field-label">Cliente</label><input class="field-input" value="'+escapeAttr(f.cliente)+'" placeholder="Buscar cliente…" onchange="updateEntreguesFiltro(\'cliente\', this.value)"/></div>'+
      '<div style="width:120px"><label class="field-label">OP</label><input class="field-input" value="'+escapeAttr(f.op)+'" placeholder="Nº pedido" onchange="updateEntreguesFiltro(\'op\', this.value)"/></div>'+
      '<div style="min-width:190px"><label class="field-label">Motorista</label><select class="field-select" onchange="updateEntreguesFiltro(\'motoristaId\', this.value)"><option value="">Todos</option>'+
        STATE.motoristas.map(m=>'<option value="'+m.id+'" '+(f.motoristaId===m.id?"selected":"")+'>'+escapeHtml(m.nome)+'</option>').join("")+'</select></div>'+
      '<div style="min-width:150px"><label class="field-label">Entregue de</label><input class="field-input" type="date" value="'+f.dIni+'" onchange="updateEntreguesFiltro(\'dIni\', this.value)"/></div>'+
      '<div style="min-width:150px"><label class="field-label">Entregue até</label><input class="field-input" type="date" value="'+f.dFim+'" onchange="updateEntreguesFiltro(\'dFim\', this.value)"/></div>'+
      '<button class="btn btn-ghost" onclick="clearEntreguesFiltro()">Limpar filtros</button>'+
    '</div>'+
    '<div class="pcp-card" style="padding:0;overflow:auto">'+pedidoTableHtml(entregues, false, false, false, false, visibleCols, false, false)+'</div>';
}

/* ============================== BAIXA DE MATERIAIS ============================== */
function getBaixaRows(){
  const rows = [];
  STATE.pedidos.forEach(p=>{
    if(!p.dataProg) return;
    if(p.corSupId){ const m=STATE.materiais.find(x=>x.id===p.corSupId); rows.push({pedidoId:p.id, op:p.op, data:p.dataProg, cliente:p.cliente, papel:"Cor Sup.", materialId:p.corSupId, materialNome:m?m.nome:"?", quantidade:Number(p.metragem||0), unidade:m?m.unidade:"m"}); }
    if(p.corInfId){ const m=STATE.materiais.find(x=>x.id===p.corInfId); rows.push({pedidoId:p.id, op:p.op, data:p.dataProg, cliente:p.cliente, papel:"Cor Inf.", materialId:p.corInfId, materialNome:m?m.nome:"?", quantidade:Number(p.metragem||0), unidade:m?m.unidade:"m"}); }
    if(p.epsId){ const m=STATE.materiais.find(x=>x.id===p.epsId); const fator=m?Number(m.fator||1):1; rows.push({pedidoId:p.id, op:p.op, data:p.dataProg, cliente:p.cliente, papel:"EPS", materialId:p.epsId, materialNome:m?m.nome:"?", quantidade:Number(p.metragem||0)*fator, unidade:m?m.unidade:"m"}); }
  });
  return rows;
}
function filterBaixaRows(rows){
  const f = STATE.baixasFiltro;
  return rows.filter(r=>{
    if(f.materialId && r.materialId!==f.materialId) return false;
    return matchesDateFilters(r.data, f);
  });
}
function updateBaixasFilter(key, val){ STATE.baixasFiltro[key]=val; renderScreen(); }
function clearBaixasFiltro(){ STATE.baixasFiltro = {materialId:"",ano:"",mes:"",dia:"",dIni:"",dFim:""}; renderScreen(); }

  const totalQtd = filtered.reduce((s,r)=>s+r.quantidade,0);

      '<td>'+escapeHtml(r.cliente||"—")+'</td>'+
      '<td style="font-family:\'IBM Plex Mono\',monospace">'+escapeHtml(r.op||"—")+'</td>'+
      '<td><span style="font-size:11px;color:'+COLORS.textMuted+'">'+r.papel+'</span></td>'+
      '<td>'+coilSwatchHtml(r.materialNome)+'</td>'+

  const table = filtered.length===0 ? emptyStateHtml("Nenhuma baixa encontrada para os filtros selecionados.") :

  document.getElementById("content").innerHTML =

    '<div class="stat-row">'+
      statCardHtml("Baixas no Filtro", filtered.length, "arrowDownCircle", COLORS.red)+

    '<div class="pcp-card filter-bar">'+

        '</select></div>'+
      '<div style="width:110px"><label class="field-label">Ano</label><select class="field-select" onchange="updateBaixasFilter(\'ano\', this.value)"><option value="">Todos</option>'+

/* ============================== MOVIMENTAÇÃO DE ESTOQUE ============================== */
function monthlyMovementForMaterial(materialId, year){
  const mat = STATE.materiais.find(m=>m.id===materialId);
  const compras = new Array(12).fill(0);
  const producao = new Array(12).fill(0);
  STATE.notas.forEach(n=>{
    if(!n.data || n.data.slice(0,4)!==String(year)) return;
    const mIdx = Number(n.data.slice(5,7))-1;
    n.itens.forEach(it=>{ if(it.materialId===materialId) compras[mIdx]+=it.quantidade; });
  });
  getBaixaRows().forEach(r=>{
    if(r.materialId!==materialId || r.data.slice(0,4)!==String(year)) return;
    const mIdx = Number(r.data.slice(5,7))-1;
    producao[mIdx]+=r.quantidade;
  });
  STATE.baixasManual.forEach(b=>{
    if(b.materialId!==materialId || !b.data || b.data.slice(0,4)!==String(year)) return;
    const mIdx = Number(b.data.slice(5,7))-1;
    producao[mIdx]+=Number(b.quantidade||0);
  });
  STATE.transferencias.forEach(t=>{
    if(!t.data || t.data.slice(0,4)!==String(year)) return;
    const mIdx = Number(t.data.slice(5,7))-1;
    if(t.materialOrigemId===materialId) producao[mIdx]+=Number(t.quantidade||0);
    if(t.materialDestinoId===materialId) compras[mIdx]+=Number(t.quantidade||0);
  });
  const totalCompras = compras.reduce((a,b)=>a+b,0);
  const totalProducao = producao.reduce((a,b)=>a+b,0);
  const estoqueAtual = mat ? mat.estoque : 0;
  const estoqueInicialAno = estoqueAtual - totalCompras + totalProducao;
  const rows = [];
  let saldo = estoqueInicialAno;
  for(let i=0;i<12;i++){
    const inicial = saldo;
    const final = inicial + compras[i] - producao[i];
    rows.push({mes:i, inicial, compras:compras[i], producao:producao[i], final});
    saldo = final;
  }
  return {rows, estoqueInicialAno, totalCompras, totalProducao, estoqueFinalAno:saldo, valorUnitario: mat? Number(mat.valorUnitario||0):0, unidade: mat?mat.unidade:"m"};
}
function monthlyMovementAggregate(materiaisList, year){
  const rows = new Array(12).fill(null).map((_,i)=>({mes:i, inicial:0, compras:0, producao:0, final:0, valor:0}));
  let estoqueInicialAno=0, totalCompras=0, totalProducao=0, estoqueFinalAno=0, valorFinalTotal=0;
  materiaisList.forEach(m=>{
    const r = monthlyMovementForMaterial(m.id, year);
    estoqueInicialAno += r.estoqueInicialAno;
    totalCompras += r.totalCompras;
    totalProducao += r.totalProducao;
    estoqueFinalAno += r.estoqueFinalAno;
    valorFinalTotal += r.estoqueFinalAno*r.valorUnitario;
    r.rows.forEach((row,i)=>{
      rows[i].inicial += row.inicial;
      rows[i].compras += row.compras;
      rows[i].producao += row.producao;
      rows[i].final += row.final;
      rows[i].valor += row.final*r.valorUnitario;
    });
  });
  const unidade = materiaisList.length ? materiaisList[0].unidade : "m";
  return {rows, estoqueInicialAno, totalCompras, totalProducao, estoqueFinalAno, valorFinalTotal, unidade};
}
function monthlyMovementTotal(year){ return monthlyMovementAggregate(STATE.materiais.filter(m=>m.unidade==="m"), year); }
function monthlyMovementByTipo(tipo, year){ return monthlyMovementAggregate(STATE.materiais.filter(m=>m.tipo===tipo), year); }

function renderCalendarioScreen(){
  const year = STATE.calYear, month = STATE.calMonth;
  const maquina = STATE.equipamentos.find(e=>e.id===STATE.calMaquinaId);
  const pedidosVisiveis = STATE.pedidos.filter(p=>{
    if(!p.dataProg) return false;
    if(STATE.calMaquinaId && p.equipamentoId!==STATE.calMaquinaId) return false;
    return STATE.calStatusVisiveis[p.situacaoId] !== false;
  });
  const porData = {};
  pedidosVisiveis.forEach(p=>{ (porData[p.dataProg]=porData[p.dataProg]||[]).push(p); });

  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();

  const cells = [];
  for(let i=0;i<startWeekday;i++){
    const dayNum = prevMonthDays - startWeekday + 1 + i;
    const d = new Date(year, month-1, dayNum);
    cells.push({dateStr: toISO(d), dayNum, currentMonth:false});
  }
  for(let d=1; d<=daysInMonth; d++){
    cells.push({dateStr: toISO(new Date(year,month,d)), dayNum: d, currentMonth:true});
  }
  while(cells.length % 7 !== 0){
    const last = cells[cells.length-1];
    const nd = addDays(new Date(last.dateStr+"T00:00:00"), 1);
    cells.push({dateStr: toISO(nd), dayNum: nd.getDate(), currentMonth:false});
  }

  const weekdayHeaders = DIAS_SEMANA_CURTO.map(d=>'<div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:'+COLORS.textMuted+';font-weight:700;text-align:center;padding:4px">'+d+'</div>').join("");
  const cellsHtml = cells.map(c=>dayCellHtml(c.dateStr, c.dayNum, porData[c.dateStr]||[], c.currentMonth)).join("");
  const monthLabel = MESES[month]+" de "+year;

  const monthPrefix = year+"-"+pad2(month+1);

  }).join("");

  document.getElementById("content").innerHTML =
    screenHeaderHtml("calendar","Calendário de Produção","Visão mensal de todos os pedidos programados — clique num pedido para editar",
      '<div style="display:flex;align-items:center;gap:10px">'+
        '<button class="icon-btn" onclick="shiftMonth(-1)">'+icon("chevronLeft",15)+'</button>'+

      '</div>')+

      statCardHtml("Pedidos no Mês", totalMesPedidos, "dashboard")+

        '</select></div>'+

async function addNota(nota){
  const { data:row, error } = await sb.from("notas").insert({
    data:nota.data, fornecedor:nota.fornecedor||null, numero_nota:nota.numeroNota||null, itens:nota.itens,
  }).select().single();
  if(error){ sbErrorToast("lançar nota de entrada", error); return false; }
  STATE.notas.unshift(mapNotaFromRow(row));
  const writes = [];
  nota.itens.forEach(it=>{
    const m = STATE.materiais.find(x=>x.id===it.materialId);
    if(!m) return;
    const novoEstoque = Math.round((m.estoque+it.quantidade)*100)/100;
    const patch = {estoque:novoEstoque};
    if(it.valorUnitario>0) patch.valor_unitario = it.valorUnitario;
    writes.push(sb.from("materiais").update(patch).eq("id", m.id).then(r=>{
      if(r.error){ sbErrorToast("atualizar estoque de "+m.nome, r.error); }
      else { m.estoque = novoEstoque; if(it.valorUnitario>0) m.valorUnitario = it.valorUnitario; }
    }));
  });
  await Promise.all(writes);
  showToast("success","Nota de entrada lançada, estoque e custo atualizados.");
}
function onNotaItemMaterialChange(select){
  const opt = select.selectedOptions[0];
  const row = select.closest(".nota-item-row");
  if(!opt || !opt.value || !row) return;
  const unidadeInput = row.querySelector(".nota-item-unidade");
  const valorInput = row.querySelector(".nota-item-valor");
  if(unidadeInput && !unidadeInput.value) unidadeInput.value = opt.getAttribute("data-unidade")||"";
  if(valorInput && !valorInput.value) valorInput.value = opt.getAttribute("data-valor")||"";
}
function notaItemRowHtml(){
  return '<div class="nota-item-row pcp-card" style="padding:12px;margin-bottom:0">'+
    '<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">'+
      '<select class="field-select nota-item-material" onchange="onNotaItemMaterialChange(this)" style="flex:1">'+
        '<option value="">Selecione o material…</option>'+
        STATE.materiais.map(m=>'<option value="'+m.id+'" data-unidade="'+escapeAttr(m.unidade)+'" data-valor="'+m.valorUnitario+'">'+escapeHtml(m.nome)+' ('+m.tipo+') — lote mín. '+fmtNum(m.loteMinimo||0)+' '+m.unidade+'</option>').join("")+
      '</select>'+
      '<button type="button" class="icon-btn" onclick="this.closest(\'.nota-item-row\').remove()">'+icon("x",14)+'</button>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'+
      '<div><label class="field-label">Quantidade</label><input class="field-input nota-item-qtd" type="number" step="0.01" placeholder="0"/></div>'+
      '<div><label class="field-label">Unidade</label><input class="field-input nota-item-unidade" type="text" placeholder="m"/></div>'+
      '<div><label class="field-label">Valor Unit. (R$)</label><input class="field-input nota-item-valor" type="number" step="0.01" placeholder="0,00"/></div>'+
    '</div>'+
  '</div>';
}
function addNotaItemRow(){ document.getElementById("nota-itens").insertAdjacentHTML("beforeend", notaItemRowHtml()); }
function openNotaModal(){
  const html =
    '<div class="modal-overlay" onmousedown="if(event.target===this) closeModal()">'+
      '<div class="modal-card" style="max-width:660px">'+
        '<div class="modal-header"><h3>Nova Nota de Entrada</h3><button type="button" class="icon-btn" onclick="closeModal()">'+icon("x",16)+'</button></div>'+
        '<form onsubmit="return submitNotaForm(event)">'+
          '<div class="grid-3">'+
            '<div><label class="field-label">Data</label><input class="field-input" type="date" name="data" value="'+todayStr()+'" required/></div>'+
            '<div><label class="field-label">Fornecedor</label><input class="field-input" name="fornecedor"/></div>'+
            '<div><label class="field-label">Nº da Nota</label><input class="field-input" name="numeroNota"/></div>'+
          '</div>'+
          '<label class="field-label" style="margin-top:14px">Itens recebidos</label>'+
          '<p style="font-size:11px;color:'+COLORS.textMuted+';margin:0 0 8px">O valor unitário informado aqui atualiza o custo de referência do material.</p>'+
          '<div id="nota-itens" style="display:flex;flex-direction:column;gap:10px;margin-bottom:10px">'+notaItemRowHtml()+'</div>'+
          '<button type="button" class="btn btn-ghost" onclick="addNotaItemRow()">'+icon("plus",13)+' Adicionar item</button>'+
          '<div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button type="submit" class="btn btn-primary">Lançar Entrada</button></div>'+
        '</form>'+
      '</div>'+
    '</div>';
  document.getElementById("modal-root").innerHTML = html;
}
async function submitNotaForm(event){
  event.preventDefault();
  const form = event.target;
  const data = form.querySelector('input[name="data"]').value;
  const fornecedor = form.querySelector('input[name="fornecedor"]').value;
  const numeroNota = form.querySelector('input[name="numeroNota"]').value;
  const rows = form.querySelectorAll(".nota-item-row");
  const itens = [];
  rows.forEach(r=>{
    const materialId = r.querySelector(".nota-item-material").value;
    const quantidade = Number(r.querySelector(".nota-item-qtd").value||0);
    const unidade = r.querySelector(".nota-item-unidade").value.trim();
    const valorUnitario = Number(r.querySelector(".nota-item-valor").value||0);
    if(materialId && quantidade>0) itens.push({materialId, quantidade, unidade, valorUnitario});
  });
  if(itens.length===0) return false;
  const ok = await addNota({data, fornecedor, numeroNota, itens});
  if(ok===false) return false;
  closeModal();
  renderScreen();
  return false;
}
function renderNotasScreen(){
  const rows = STATE.notas.map(n=>{
    const itensStr = n.itens.map(it=>{
      const m=STATE.materiais.find(x=>x.id===it.materialId);
      const unidade = it.unidade || (m?m.unidade:"m");
      return (m?escapeHtml(m.nome):"?")+" (+"+fmtNum(it.quantidade)+" "+unidade+(it.valorUnitario?" · "+fmtBRL(it.valorUnitario)+"/"+unidade:"")+")";
    }).join(", ");
    const valorTotalNota = n.itens.reduce((s,it)=>s+(Number(it.quantidade||0)*Number(it.valorUnitario||0)),0);
    return '<tr><td style="font-family:\'IBM Plex Mono\',monospace">'+fmtDateBR(n.data)+'</td><td>'+escapeHtml(n.fornecedor||"—")+'</td><td style="font-family:\'IBM Plex Mono\',monospace">'+escapeHtml(n.numeroNota||"—")+'</td><td>'+itensStr+'</td><td style="font-family:\'IBM Plex Mono\',monospace;font-weight:600">'+fmtBRL(valorTotalNota)+'</td></tr>';
  }).join("");
  const table = STATE.notas.length===0
    ? emptyStateHtml('Nenhuma nota de entrada lançada. Clique em "Nova Nota" para adicionar.')
    : '<table class="pcp-table"><thead><tr><th>Data</th><th>Fornecedor</th><th>Nº Nota</th><th>Itens</th><th>Valor Total</th></tr></thead><tbody>'+rows+'</tbody></table>';
  document.getElementById("content").innerHTML =
    screenHeaderHtml("package","Notas de Entrada","Lançamentos que somam ao estoque de matéria-prima",
      '<button class="btn btn-primary" onclick="openNotaModal()">'+icon("plus",14)+' Nova Nota</button>')+
    '<div class="pcp-card" style="padding:0;overflow:auto">'+table+'</div>';
}

/* ============================== NAV / LOGIN / INIT ============================== */
const NAV_ITEMS = [
  {id:"dashboard", label:"Dashboard", icon:"barChart"},
  {id:"pedidos", label:"Lançamento de Pedidos", icon:"dashboard"},
  {id:"prog-perfilar", label:"Programação Semanal Perfilar", icon:"calendar"},
  {id:"prog-pintura", label:"Programação Semanal Pintura", icon:"droplet"},
  {id:"prog-colagem", label:"Programação Semanal Colagem", icon:"layers"},
  {id:"prog-entrega", label:"Programação de Entrega", icon:"truck"},
  {id:"entregues", label:"Pedidos Entregues", icon:"checkCircle"},
  {id:"calendario", label:"Calendário", icon:"calendar"},
  {id:"baixas", label:"Baixa de Materiais", icon:"arrowDownCircle"},
  {id:"baixaEstoque", label:"Baixa de Estoque (Perda)", icon:"trash"},
  {id:"transferencia", label:"Transferência de Estoque", icon:"repeat"},
  {id:"movimentacao", label:"Movimentação de Estoque", icon:"trendingUp"},
  {id:"materiais", label:"Matéria-Prima", icon:"boxes"},
  {id:"notas", label:"Notas de Entrada", icon:"package"},
  {id:"motoristas", label:"Motoristas", icon:"truck"},
  {id:"cidades", label:"Cidades", icon:"mapPin"},
  {id:"equipamentos", label:"Equipamentos", icon:"wrench"},
];
function setScreen(id){ STATE.screen=id; renderSidebar(); renderScreen(); }
function renderSidebar(){
  const items = NAV_ITEMS.map(it=>'<button class="pcp-sidebar-btn '+(STATE.screen===it.id?"active":"")+'" onclick="setScreen(\''+it.id+'\')">'+icon(it.icon,16)+' '+it.label+'</button>').join("");
  const themeBtnIcon = STATE.theme==="dark" ? "sun" : "moon";
  const themeBtnLabel = STATE.theme==="dark" ? "Modo Claro" : "Modo Escuro";
  document.getElementById("sidebar").innerHTML =
    '<div style="display:flex;align-items:center;gap:9px;padding:4px 8px 18px">'+
      '<div style="width:32px;height:32px;border-radius:8px;background:var(--panel-alt);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:5px">'+
        '<img src="'+markDataUri()+'" alt="ELEVE" style="width:100%;height:100%;object-fit:contain"/></div>'+
      '<div><div style="font-family:\'Space Grotesk\',sans-serif;font-weight:700;font-size:14.5px;letter-spacing:.02em">ELEVE</div>'+
      '<div style="font-size:10px;color:'+COLORS.textMuted+'">Painel de Produção</div></div>'+
    '</div>'+items+
    '<div style="flex:1"></div>'+
    '<button class="pcp-sidebar-btn" onclick="toggleTheme()">'+icon(themeBtnIcon,16)+' '+themeBtnLabel+'</button>'+
    '<div style="padding:10px 12px;font-size:11.5px;color:'+COLORS.textMuted+'">'+escapeHtml(STATE.userName)+'</div>'+
    '<button class="pcp-sidebar-btn" onclick="handleLogout()">'+icon("logout",16)+' Sair</button>';
}
function renderScreen(){
  if(STATE.screen==="dashboard") renderDashboardScreen();
  else if(STATE.screen==="pedidos") renderPedidosScreen();
  else if(STATE.screen==="prog-perfilar") renderStageScreen("perfilar");
  else if(STATE.screen==="prog-pintura") renderStageScreen("pintura");
  else if(STATE.screen==="prog-colagem") renderStageScreen("colagem");
  else if(STATE.screen==="prog-entrega") renderStageScreen("entrega");
  else if(STATE.screen==="entregues") renderEntreguesScreen();
  else if(STATE.screen==="calendario") renderCalendarioScreen();
  else if(STATE.screen==="baixas") renderBaixasScreen();
  else if(STATE.screen==="baixaEstoque") renderBaixaEstoqueScreen();
  else if(STATE.screen==="transferencia") renderTransferenciaScreen();
  else if(STATE.screen==="movimentacao") renderMovimentacaoScreen();
  else if(STATE.screen==="notas") renderNotasScreen();
  else if(STATE.screen==="materiais") renderGenericScreen("material");
  else if(STATE.screen==="motoristas") renderGenericScreen("motorista");
  else if(STATE.screen==="cidades") renderGenericScreen("cidade");
  else if(STATE.screen==="equipamentos") renderGenericScreen("equipamento");
}
function showLoginError(msg){
  const el = document.getElementById("login-error");
  el.textContent = msg;
  el.style.display = "block";
}
function clearLoginError(){
  const el = document.getElementById("login-error");
  el.style.display = "none";
  el.textContent = "";
}
async function enterApp(userName){
  STATE.userName = userName || "operador";
  STATE.loggedIn = true;
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-shell").style.display = "flex";
  renderSidebar();
  await loadAllData();
  renderScreen();
}
async function handleLogin(event){
  event.preventDefault();
  clearLoginError();
  const email = document.getElementById("login-user").value.trim();
  const senha = document.getElementById("login-pass").value;
  const btn = document.getElementById("login-submit-btn");
  btn.disabled = true;
  btn.textContent = "Entrando…";
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
    if(error){
      showLoginError(error.message==="Invalid login credentials" ? "E-mail ou senha inválidos." : error.message);
      return false;
    }
    await enterApp(data.user && data.user.email ? data.user.email : email);
  } catch(err){
    showLoginError("Não foi possível conectar ao servidor de autenticação. Verifique sua conexão.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Entrar";
  }
  return false;
}
async function handleLogout(){
  await sb.auth.signOut();
  STATE.loggedIn = false;
  STATE.dataLoaded = false;
  document.getElementById("app-shell").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
  clearLoginError();
  const passInput = document.getElementById("login-pass");
  if(passInput) passInput.value = "";
}
sb.auth.onAuthStateChange((event, session)=>{
  if(event==="SIGNED_OUT" && STATE.loggedIn){
    STATE.loggedIn = false;
    STATE.dataLoaded = false;
    document.getElementById("app-shell").style.display = "none";
    document.getElementById("login-screen").style.display = "flex";
  }
});
async function restoreSession(){
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session && data.session.user){
      await enterApp(data.session.user.email);
    }
  } catch(err){
    // Sem sessão ativa — permanece na tela de login.
  }
}

/* ============================== INIT ============================== */
initLocalDefaults();
document.documentElement.setAttribute("data-theme", STATE.theme);
Object.assign(COLORS, THEMES[STATE.theme]);
document.getElementById("login-logo-img").src = logoDataUri();
restoreSession();
</script>
