async function updatePedidoSituacao(id, situacaoId){
  const p = STATE.pedidos.find(x=>x.id===id);
  if(!p) return;
  const anterior = p.situacaoId;
  const oldSnapshot = Object.assign({}, p, {situacaoId:anterior});
  p.situacaoId = situacaoId;
  renderScreen();
  const { error } = await sb.from("pedidos").update({situacao_id:situacaoId||null}).eq("id", id);
  if(error){ sbErrorToast("atualizar situação", error); p.situacaoId = anterior; renderScreen(); return; }
  await adjustStock(oldSnapshot, p);
  renderScreen();
  const saiuDePreProducao = isStatusPreProducao((STATE.statusOptions.find(s=>s.id===anterior)||{}).nome) && !isPedidoPreProducao(p);
  const entrouEmPreProducao = !isStatusPreProducao((STATE.statusOptions.find(s=>s.id===anterior)||{}).nome) && isPedidoPreProducao(p);
  showToast("success", saiuDePreProducao ? "Situação atualizada — matéria-prima baixada do estoque." : entrouEmPreProducao ? "Situação atualizada — baixa estornada (pedido voltou para Pré-produção)." : "Situação atualizada.");
}

/* ---- production timer ---- */
async function startTimer(id){
  const p = STATE.pedidos.find(x=>x.id===id);
  if(!p || p.producaoStatus==="concluido") return;
  const startedAt = Date.now();
  p.producaoStartedAt = startedAt;
  p.producaoStatus = "rodando";
  renderScreen();
  const { error } = await sb.from("pedidos").update({producao_status:"rodando", producao_started_at:new Date(startedAt).toISOString()}).eq("id", id);
  if(error) sbErrorToast("iniciar produção", error);
}
async function pauseTimer(id){
  const p = STATE.pedidos.find(x=>x.id===id);
  if(!p || p.producaoStatus!=="rodando") return;
  const elapsed = (p.producaoElapsedMs||0) + (Date.now()-(p.producaoStartedAt||Date.now()));
  p.producaoElapsedMs = elapsed;
  p.producaoStartedAt = null;
  p.producaoStatus = "pausado";
  renderScreen();
  const { error } = await sb.from("pedidos").update({producao_status:"pausado", producao_elapsed_ms:elapsed, producao_started_at:null}).eq("id", id);
  if(error) sbErrorToast("pausar produção", error);
}
async function concludeTimer(id){
  const p = STATE.pedidos.find(x=>x.id===id);
  if(!p) return;
  const oldSnapshot = Object.assign({}, p);
  let elapsed = p.producaoElapsedMs||0;
  if(p.producaoStatus==="rodando"){
    elapsed = elapsed + (Date.now()-(p.producaoStartedAt||Date.now()));
  }
  const fromStage = p.etapaAtual || "perfilar";
  const to = nextStageOf(p);
  let patch;
  if(to==="entregue"){
    const entregue = STATE.statusOptions.find(s=>s.nome.toLowerCase().indexOf("entregue")===0);
    patch = { producao_status:"concluido", producao_started_at:null, producao_elapsed_ms:elapsed, etapa_atual:"entregue", data_entregue: todayStr() };
    if(entregue) patch.situacao_id = entregue.id;
  } else {
    patch = { etapa_atual:to, producao_started_at:null, producao_elapsed_ms:0, producao_status:"idle" };
  }
  const { error } = await sb.from("pedidos").update(patch).eq("id", id);
  if(error){ sbErrorToast("concluir etapa", error); return; }
  p.producaoElapsedMs = patch.producao_elapsed_ms;
  p.producaoStartedAt = null;
  p.producaoStatus = patch.producao_status;
  p.etapaAtual = patch.etapa_atual;
  if(to==="entregue"){
    p.dataEntregue = patch.data_entregue;
    if(patch.situacao_id) p.situacaoId = patch.situacao_id;
    showToast("success","Entrega confirmada — pedido movido para Pedidos Entregues.");
  } else {
    const stDef = STAGE_DEFS[to];
    showToast("success", (STAGE_DEFS[fromStage]?STAGE_DEFS[fromStage].short:fromStage)+" concluída — pedido movido para "+(stDef?stDef.label:to)+".");
  }
  await adjustStock(oldSnapshot, p);
  renderScreen();
}

      if(!ok){ STATE.materialTipos.pop(); return; }
    }
    const tipoInput = document.getElementById("f-tipo");
    if(tipoInput) tipoInput.value = val;
    const dl = document.getElementById("dl-tipo");
    if(dl && !Array.from(dl.options).some(o=>o.value===val)){
      const opt2 = document.createElement("option"); opt2.value = val; dl.appendChild(opt2);
    }
    cancelQuickAdd(type);
    return;
  }
  const select = document.getElementById(selectId);
  const opt = document.createElement("option");
  opt.value = newObj.id;
  opt.textContent = val;
  select.appendChild(opt);
  select.value = newObj.id;
  cancelQuickAdd(type);
}

async function submitPedidoForm(event, mode, id){
  event.preventDefault();
  const fd = new FormData(event.target);
  const data = Object.fromEntries(fd.entries());
  data.temPintura = !!(event.target.elements["temPintura"] && event.target.elements["temPintura"].checked);
  data.temColagem = !!(event.target.elements["temColagem"] && event.target.elements["temColagem"].checked);
  /* Trava o botão e aguarda o salvamento (que baixa/estorna estoque) terminar antes de
     fechar o modal. Sem isso, um duplo clique ou uma segunda tentativa de salvar antes da
     primeira terminar pode disparar adjustStock() duas vezes para a mesma alteração —
     cada chamada calcula o delta a partir do pedido "antigo" em memória, então se a
     segunda chamada ler esse "antigo" antes da primeira já ter sido persistida, o mesmo
     consumo é baixado do estoque real duas vezes, mesmo aparecendo só um lançamento. */
  const submitBtn = event.target.querySelector('button[type="submit"]');
  if(submitBtn) submitBtn.disabled = true;
  const ok = await savePedido(mode==="edit"?id:null, data);
  if(submitBtn) submitBtn.disabled = false;
  if(ok===false) return false;
  closeModal();
  renderScreen();
  return false;
}

function sortPedidos(list){
  const accessor = PEDIDO_SORT_ACCESSORS[STATE.pedidosSort.campo] || PEDIDO_SORT_ACCESSORS.dataProg;
  const dir = STATE.pedidosSort.direcao==="asc" ? 1 : -1;
  return [...list].sort((a,b)=>{
    const va=accessor(a), vb=accessor(b);
    if(va<vb) return -1*dir;
    if(va>vb) return 1*dir;
    return 0;
  });
}

    if(f.op && !(p.op||"").toLowerCase().includes(f.op.toLowerCase())) return false;
    if(f.situacaoId && p.situacaoId!==f.situacaoId) return false;
    if(f.material && !(p.material||"").toLowerCase().includes(f.material.toLowerCase())) return false;
    if(f.corSupId && p.corSupId!==f.corSupId) return false;
    if(f.corInfId && p.corInfId!==f.corInfId) return false;
    if(f.cidadeId && p.cidadeId!==f.cidadeId) return false;
    if(f.dIni && (!p.dataProg || p.dataProg<f.dIni)) return false;
    if(f.dFim && (!p.dataProg || p.dataProg>f.dFim)) return false;
    return true;
  });
}

function shiftWeek(stage, n){
  const s = STATE.stageState[stage];
  s.weekStart = toISO(addDays(new Date(s.weekStart+"T00:00:00"), n*7));
  s.dIni = s.weekStart;
  s.dFim = toISO(addDays(new Date(s.weekStart+"T00:00:00"),5));
  renderScreen();
}
function updateProgFilter(stage, which, val){ STATE.stageState[stage][which]=val; renderScreen(); }
function clearProgFiltro(stage){

function handleDragStart(event, pedidoId){
  event.dataTransfer.setData("text/plain", pedidoId);
  event.dataTransfer.effectAllowed = "move";
  const tr = event.target.closest("tr");
  if(tr) tr.classList.add("dragging");
}
function handleDragEnd(event){
  const tr = event.target.closest("tr");
  if(tr) tr.classList.remove("dragging");
}
function handleDrop(event, targetDate){
  event.preventDefault();
  event.currentTarget.classList.remove("drag-over");
  const id = event.dataTransfer.getData("text/plain");
  reschedulePedido(id, targetDate);
}

async function saveMetas(stage){
  const s = STATE.stageState[stage];
  const novasMetas = [];
  for(let i=0;i<6;i++){ novasMetas.push(Number(document.getElementById("meta-input-"+i).value||0)); }

  const pct = meta>0 ? Math.min(100, Math.round((metros/meta)*100)) : 0;

  return '<div class="pcp-card stat-card">'+
    '<div class="stat-label">'+label+'</div>'+
    '<div style="font-family:\'Space Grotesk\',sans-serif;font-size:19px;font-weight:700;margin-top:6px;color:'+color+'">'+fmtNum(metros)+' m</div>'+
    '<div style="font-size:10.5px;color:'+COLORS.textMuted+';margin-top:4px">Meta: '+fmtNum(meta)+' m</div>'+

function materialSummaryHtml(pedidosList, includeHeading){
  const porCor = {}, porEps = {};
  pedidosList.forEach(p=>{
    if(p.corSupId) porCor[p.corSupId] = (porCor[p.corSupId]||0) + Number(p.metragem||0);
    if(p.corInfId) porCor[p.corInfId] = (porCor[p.corInfId]||0) + Number(p.metragem||0);
    if(p.epsId){ const m=STATE.materiais.find(x=>x.id===p.epsId); const fator=m?Number(m.fator||1):1; porEps[p.epsId]=(porEps[p.epsId]||0)+Number(p.metragem||0)*fator; }
  });
  const corItems = Object.keys(porCor).map(id=>{ const m=STATE.materiais.find(x=>x.id===id); return {label:m?m.nome:"?", labelHtml:coilSwatchHtml(m?m.nome:"?"), value:porCor[id]}; }).sort((a,b)=>b.value-a.value);
  const epsItems = Object.keys(porEps).map(id=>{ const m=STATE.materiais.find(x=>x.id===id); return {label:m?m.nome:"?", value:porEps[id]}; }).sort((a,b)=>b.value-a.value);

      '<div class="pcp-card"><div class="preview-title">Bobinas por Cor (metragem)</div>'+(corItems.length?barListHtml(corItems):emptyStateHtml("Sem consumo de bobina no período."))+'</div>'+
      '<div class="pcp-card"><div class="preview-title">EPS por Tipo (metragem)</div>'+(epsItems.length?barListHtml(epsItems):emptyStateHtml("Sem consumo de EPS no período."))+'</div>'+
    '</div>';
}
function computeStageAtivos(stage){
  const s = STATE.stageState[stage];
  const dIni = s.dIni, dFim = s.dFim;
  return STATE.pedidos.filter(p=>{
    if((p.etapaAtual||"perfilar")!==stage || !p.dataProg) return false;
    if(p.dataProg<dIni || p.dataProg>dFim) return false;
    if(s.maquinaId && p.equipamentoId!==s.maquinaId) return false;
    if(s.cidadeId && p.cidadeId!==s.cidadeId) return false;
    if(s.corSupId && p.corSupId!==s.corSupId) return false;
    if(s.corInfId && p.corInfId!==s.corInfId) return false;
    if(s.epsId && p.epsId!==s.epsId) return false;
    if(s.material && !(p.material||"").toLowerCase().includes(s.material.toLowerCase())) return false;
    if(s.op && !(p.op||"").toLowerCase().includes(s.op.toLowerCase())) return false;
    if(stage==="entrega" && s.motoristaId && p.motoristaId!==s.motoristaId) return false;
    return true;
  });
}

function getBaixaRows(){
  const rows = [];
  STATE.pedidos.forEach(p=>{
    if(!p.dataProg) return;
    const preProducao = isPedidoPreProducao(p);
    if(p.corSupId){ const m=STATE.materiais.find(x=>x.id===p.corSupId); rows.push({pedidoId:p.id, op:p.op, data:p.dataProg, cliente:p.cliente, papel:"Cor Sup.", materialId:p.corSupId, materialNome:m?m.nome:"?", materialTipo:m?m.tipo:"", quantidade:Number(p.metragem||0), unidade:m?m.unidade:"m", preProducao:preProducao}); }
    if(p.corInfId){ const m=STATE.materiais.find(x=>x.id===p.corInfId); rows.push({pedidoId:p.id, op:p.op, data:p.dataProg, cliente:p.cliente, papel:"Cor Inf.", materialId:p.corInfId, materialNome:m?m.nome:"?", materialTipo:m?m.tipo:"", quantidade:Number(p.metragem||0), unidade:m?m.unidade:"m", preProducao:preProducao}); }
    if(p.epsId){ const m=STATE.materiais.find(x=>x.id===p.epsId); const fator=m?Number(m.fator||1):1; rows.push({pedidoId:p.id, op:p.op, data:p.dataProg, cliente:p.cliente, papel:"EPS", materialId:p.epsId, materialNome:m?m.nome:"?", materialTipo:m?m.tipo:"", quantidade:Number(p.metragem||0)*fator, unidade:m?m.unidade:"m", preProducao:preProducao}); }
  });
  return rows;
}
/* Linhas que representam baixa REAL (já efetivada no estoque) — exclui Pré-produção. */
function getEfetivaBaixaRows(){ return getBaixaRows().filter(r=>!r.preProducao); }
function matchesBaixaDateMaterial(r, f){
  if(f.materialId && r.materialId!==f.materialId) return false;
  if(f.tipo && r.materialTipo!==f.tipo) return false;
  if(f.op && !(r.op||"").toLowerCase().includes(f.op.toLowerCase())) return false;
  return matchesDateFilters(r.data, f);
}
function filterBaixaRows(rows){
  const f = STATE.baixasFiltro;
  return rows.filter(r=>{
    if(!matchesBaixaDateMaterial(r, f)) return false;
    if(f.situacao==="efetivas" && r.preProducao) return false;
    if(f.situacao==="preproducao" && !r.preProducao) return false;
    return true;
  });
}

/* ============================== MOVIMENTAÇÃO DE ESTOQUE ============================== */
function monthlyMovementForMaterial(materialId, year){
  const mat = STATE.materiais.find(m=>m.id===materialId);
  const compras = new Array(12).fill(0);
  const producao = new Array(12).fill(0);
  STATE.notas.forEach(n=>{
    if(!n.data || n.data.slice(0,4)!==String(year)) return;
    const mIdx = Number(n.data.slice(5,7))-1;
    n.itens.forEach(it=>{ if(it.materialId===materialId) compras[mIdx]+=it.quantidade; });
  });
  getEfetivaBaixaRows().forEach(r=>{
    if(r.materialId!==materialId || r.data.slice(0,4)!==String(year)) return;
    const mIdx = Number(r.data.slice(5,7))-1;
    producao[mIdx]+=r.quantidade;
  });
  STATE.baixasManual.forEach(b=>{
    if(b.materialId!==materialId || !b.data || b.data.slice(0,4)!==String(year)) return;
    const mIdx = Number(b.data.slice(5,7))-1;
    producao[mIdx]+=Number(b.quantidade||0);
  });
  STATE.transferencias.forEach(t=>{
    if(!t.data || t.data.slice(0,4)!==String(year)) return;
    const mIdx = Number(t.data.slice(5,7))-1;
    if(t.materialOrigemId===materialId) producao[mIdx]+=Number(t.quantidade||0);
    if(t.materialDestinoId===materialId) compras[mIdx]+=Number(t.quantidade||0);
  });
  const totalCompras = compras.reduce((a,b)=>a+b,0);
  const totalProducao = producao.reduce((a,b)=>a+b,0);
  const estoqueAtual = mat ? mat.estoque : 0;
  const estoqueInicialAno = estoqueAtual - totalCompras + totalProducao;
  const rows = [];
  let saldo = estoqueInicialAno;
  for(let i=0;i<12;i++){
    const inicial = saldo;
    const final = inicial + compras[i] - producao[i];
    rows.push({mes:i, inicial, compras:compras[i], producao:producao[i], final});
    saldo = final;
  }
  return {rows, estoqueInicialAno, totalCompras, totalProducao, estoqueFinalAno:saldo, valorUnitario: mat? Number(mat.valorUnitario||0):0, unidade: mat?mat.unidade:"m"};
}
function monthlyMovementAggregate(materiaisList, year){
  const rows = new Array(12).fill(null).map((_,i)=>({mes:i, inicial:0, compras:0, producao:0, final:0, valor:0}));
  let estoqueInicialAno=0, totalCompras=0, totalProducao=0, estoqueFinalAno=0, valorFinalTotal=0;
  materiaisList.forEach(m=>{
    const r = monthlyMovementForMaterial(m.id, year);
    estoqueInicialAno += r.estoqueInicialAno;
    totalCompras += r.totalCompras;
    totalProducao += r.totalProducao;
    estoqueFinalAno += r.estoqueFinalAno;
    valorFinalTotal += r.estoqueFinalAno*r.valorUnitario;
    r.rows.forEach((row,i)=>{
      rows[i].inicial += row.inicial;
      rows[i].compras += row.compras;
      rows[i].producao += row.producao;
      rows[i].final += row.final;
      rows[i].valor += row.final*r.valorUnitario;
    });
  });
  const unidade = materiaisList.length ? materiaisList[0].unidade : "m";
  return {rows, estoqueInicialAno, totalCompras, totalProducao, estoqueFinalAno, valorFinalTotal, unidade};
}
function monthlyMovementTotal(year){ return monthlyMovementAggregate(STATE.materiais.filter(m=>m.unidade==="m"), year); }
function monthlyMovementByTipo(tipo, year){ return monthlyMovementAggregate(STATE.materiais.filter(m=>m.tipo===tipo), year); }
function updateMovFiltro(key, val){ STATE.movFiltro[key]=val; renderScreen(); }

/* Cálculo da Movimentação de Estoque conforme os filtros — usado pela tela e pelas exportações. */
function movimentacaoDados(){
  const f = STATE.movFiltro;
  let data, escopo;
  if(f.materialId){
    const mat = STATE.materiais.find(m=>m.id===f.materialId);
    const r = monthlyMovementForMaterial(f.materialId, f.ano);
    data = {
      rows: r.rows.map(row=>({...row, valor: row.final*r.valorUnitario})),
      estoqueInicialAno:r.estoqueInicialAno, totalCompras:r.totalCompras, totalProducao:r.totalProducao,
      estoqueFinalAno:r.estoqueFinalAno, valorFinalTotal:r.estoqueFinalAno*r.valorUnitario, unidade:r.unidade,
    };
    escopo = mat ? (mat.nome+" ("+mat.tipo+")") : "Material";
  } else if(f.tipo){
    data = monthlyMovementByTipo(f.tipo, f.ano);
    escopo = "Tipo: "+f.tipo;
  } else {
    data = monthlyMovementTotal(f.ano);
    escopo = "Total Geral (bobinas e EPS)";
  }
  return {data:data, escopo:escopo, ano:f.ano};
}
function movimentacaoLinhasExport(){
  const d = movimentacaoDados();
  const linhas = MESES.map(function(nome,i){
    const row = d.data.rows[i];
    return [nome, row.inicial, row.compras, row.producao, row.final, row.valor];
  });
  linhas.push(["Total do Ano", d.data.estoqueInicialAno, d.data.totalCompras, d.data.totalProducao, d.data.estoqueFinalAno, d.data.valorFinalTotal]);
  return {linhas:linhas, escopo:d.escopo, ano:d.ano, unidade:d.data.unidade};
}

  const d = movimentacaoLinhasExport();

  const body = d.linhas.map(function(r){

/* Resolve o período dos velocímetros a partir do filtro.
   Prioridade: intervalo entre datas > mês+ano > ano inteiro > mês corrente. */
function dashMetaPeriodo(){
  const f = STATE.dashMetaFiltro;
  const hoje = new Date();
  const pad = n=>pad2(n);
  if(f.dIni && f.dFim){
    const ini = f.dIni <= f.dFim ? f.dIni : f.dFim;
    const fim = f.dIni <= f.dFim ? f.dFim : f.dIni;
    return {ini:ini, fim:fim, label:fmtDateBR(ini)+" a "+fmtDateBR(fim)};
  }
  if(f.dIni && !f.dFim) return {ini:f.dIni, fim:toISO(hoje), label:"De "+fmtDateBR(f.dIni)+" até hoje"};
  if(f.dFim && !f.dIni) return {ini:f.dFim.slice(0,4)+"-01-01", fim:f.dFim, label:"Até "+fmtDateBR(f.dFim)};
  const ano = f.ano || String(hoje.getFullYear());
  if(f.mes){
    const ultimo = new Date(Number(ano), Number(f.mes), 0).getDate();
    return {ini:ano+"-"+f.mes+"-01", fim:ano+"-"+f.mes+"-"+pad(ultimo), label:MESES[Number(f.mes)-1]+" de "+ano};
  }
  if(f.ano) return {ini:ano+"-01-01", fim:ano+"-12-31", label:"Ano de "+ano};
  const m = pad(hoje.getMonth()+1);
  const ultimo = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
  return {ini:ano+"-"+m+"-01", fim:ano+"-"+m+"-"+pad(ultimo), label:MESES[hoje.getMonth()]+" de "+ano};
}
/* Produção real de uma etapa dentro de um intervalo de datas. */
function producaoNoPeriodo(stage, ini, fim){
  let total = 0, pedidos = 0;
  STATE.pedidos.forEach(function(p){
    if(!p.dataProg || p.dataProg < ini || p.dataProg > fim) return;
    if(stage==="colagem" && !p.temColagem) return;
    if(!stageConcluido(p, stage)) return;
    const fator = stage==="perfilar" ? fatorProducaoPerfilarPara(p.tipo) : 1;
    total += Number(p.metragem||0)*fator;
    pedidos += 1;
  });
  return {total: Math.round(total*100)/100, pedidos: pedidos};
}
/* Meta acumulada do período. Dias no futuro não entram: comparar o realizado de
   meio de mês contra a meta do mês inteiro daria sempre a impressão de atraso.
   Retorna também se houve corte, para avisar na tela. */
function metaNoPeriodo(stage, ini, fim){
  const hojeStr = todayStr();
  const limite = fim > hojeStr ? hojeStr : fim;
  const cortado = fim > hojeStr;
  let total = 0, diasUteis = 0;
  if(limite < ini) return {total:0, diasUteis:0, cortado:cortado, limite:limite};
  const [ya,ma,da] = ini.split("-").map(Number);
  const cursor = new Date(ya, ma-1, da);
  let guard = 0;
  while(toISO(cursor) <= limite && guard++ < 800){
    const m = metaDoDia(stage, cursor.getFullYear(), cursor.getMonth()+1, cursor.getDate());
    if(m > 0){ total += m; diasUteis++; }
    cursor.setDate(cursor.getDate()+1);
  }
  return {total: Math.round(total*100)/100, diasUteis: diasUteis, cortado: cortado, limite: limite};
}

/* ---- Velocímetro (gauge) meia-lua: realizado x meta ----
   Arco de 180° dividido em faixas de desempenho (vermelho → amarelo → verde) e um
   ponteiro na posição do realizado. A escala vai até 125% da meta, para que dar
   exatamente a meta caia visivelmente dentro do verde e ainda sobre espaço acima. */
/* Inteiro com separador de milhar, sem casas decimais — dentro do velocímetro o
   que importa é a leitura rápida, e ",86" só rouba espaço. */
function fmtInt(n){ return Math.round(Number(n)||0).toLocaleString("pt-BR", {maximumFractionDigits:0}); }
function gaugeChartHtml(valor, meta, unidadeTxt){
  const W = 260, H = 158, cx = 130, cy = 132, rOut = 108, rIn = 76;
  /* Cores sólidas e saturadas — o velocímetro precisa ser lido de longe, no chão de fábrica. */
  const G_VERMELHO = "#E4342A", G_AMARELO = "#F5A623", G_VERDE = "#1FA85B";
  const temMeta = Number(meta) > 0;
  const escala = temMeta ? Number(meta)*1.25 : Math.max(Number(valor)||0, 1);
  const frac = Math.max(0, Math.min(1, (Number(valor)||0)/escala));
  const pol = (r, t)=>{ const a=Math.PI*(1-t); return [cx+r*Math.cos(a), cy-r*Math.sin(a)]; };
  /* Setor do anel entre duas frações da escala. O gauge inteiro é meia-lua (180°),
     então nenhum setor pode passar de 180° — large-arc-flag é sempre 0. */
  const setor = (t0, t1, cor)=>{
    const [x0o,y0o]=pol(rOut,t0), [x1o,y1o]=pol(rOut,t1);
    const [x1i,y1i]=pol(rIn,t1),  [x0i,y0i]=pol(rIn,t0);
    return '<path d="M '+x0o.toFixed(1)+' '+y0o.toFixed(1)+
      ' A '+rOut+' '+rOut+' 0 0 1 '+x1o.toFixed(1)+' '+y1o.toFixed(1)+
      ' L '+x1i.toFixed(1)+' '+y1i.toFixed(1)+
      ' A '+rIn+' '+rIn+' 0 0 0 '+x0i.toFixed(1)+' '+y0i.toFixed(1)+
      ' Z" fill="'+cor+'"/>';
  };
  let faixas;
  if(temMeta){
    /* 0–70% da meta vermelho, 70–100% amarelo, 100%+ verde. Convertido para
       frações da escala (que é 1,25x a meta). */
    faixas = setor(0, 0.70/1.25, G_VERMELHO) +
             setor(0.70/1.25, 1/1.25, G_AMARELO) +
             setor(1/1.25, 1, G_VERDE);
  } else {
    faixas = setor(0, 1, COLORS.steelBorder+"66");
  }
  /* Marca da meta (100%) */
  const metaTick = temMeta ? (function(){
    const t = 1/1.25;
    const [xa,ya] = pol(rIn-4, t), [xb,yb] = pol(rOut+4, t);
    return '<line x1="'+xa.toFixed(1)+'" y1="'+ya.toFixed(1)+'" x2="'+xb.toFixed(1)+'" y2="'+yb.toFixed(1)+'" stroke="'+COLORS.text+'" stroke-width="3" stroke-linecap="round"/>';
  })() : '';
  const [px,py] = pol(rOut-14, frac);
  const atingiu = temMeta && Number(valor) >= Number(meta);
  const corValor = !temMeta ? COLORS.textMuted : (atingiu ? G_VERDE : (Number(valor) >= Number(meta)*0.7 ? G_AMARELO : G_VERMELHO));
  const pct = temMeta ? Math.round((Number(valor)/Number(meta))*100) : null;
  /* Sem meta não há escala com significado — mostrar ponteiro apontando pro fim
     daria a falsa impressão de 100%. Nesse caso só o número é exibido. */
  const ponteiro = temMeta
    ? '<line x1="'+cx+'" y1="'+cy+'" x2="'+px.toFixed(1)+'" y2="'+py.toFixed(1)+'" stroke="'+COLORS.text+'" stroke-width="4" stroke-linecap="round"/>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="'+COLORS.text+'"/>'
    : '';
  const escalaLabels = temMeta
    ? '<text x="14" y="'+(cy+16)+'" font-size="11" fill="'+COLORS.textMuted+'">0</text>'+
      '<text x="'+(W-14)+'" y="'+(cy+16)+'" text-anchor="end" font-size="11" fill="'+COLORS.textMuted+'">'+fmtInt(escala)+'</text>'
    : '';
  /* Ajusta o corpo do número para caber no furo do anel. O furo estreita conforme
     o texto sobe, então a largura disponível depende do próprio tamanho da fonte —
     por isso testa de cima pra baixo até encontrar o maior que ainda cabe.
     Sem isso, valores altos (16.225, 50.000, 1.234.567) invadem as faixas coloridas. */
  const valorTxt = fmtInt(valor);
  let fsValor = 26;
  for(let fs=26; fs>=13; fs--){
    const topo = 30 + 0.70*fs;
    const meia = topo < rIn ? Math.sqrt(rIn*rIn - topo*topo) : 0;
    if(valorTxt.length*0.60*fs <= 2*meia - 10){ fsValor = fs; break; }
    fsValor = fs;
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:280px;display:block;margin:0 auto" role="img">'+
      faixas + metaTick + ponteiro +
      '<text x="'+cx+'" y="'+(cy-30)+'" text-anchor="middle" font-size="'+fsValor+'" font-weight="700" fill="'+corValor+'" font-family="IBM Plex Mono, monospace">'+valorTxt+'</text>'+
      '<text x="'+cx+'" y="'+(cy-13)+'" text-anchor="middle" font-size="12" fill="'+COLORS.textMuted+'">'+escapeHtml(unidadeTxt)+'</text>'+
      escalaLabels+
    '</svg>'+
    '<div style="text-align:center;margin-top:6px;font-size:12.5px;line-height:1.5">'+
      (temMeta
        ? '<span style="color:'+COLORS.textMuted+'">Meta do período: </span><strong style="font-family:\'IBM Plex Mono\',monospace">'+fmtInt(meta)+' m</strong>'+
          ' <span style="color:'+corValor+';font-weight:700">('+pct+'%)</span>'+
          '<div style="font-size:11.5px;color:'+corValor+';font-weight:600;margin-top:2px">'+
            (atingiu ? 'Meta atingida' : 'Faltam '+fmtInt(Number(meta)-Number(valor))+' m')+'</div>'
        : '<span style="color:'+COLORS.textMuted+'">Sem meta definida para este período</span>')+
    '</div>';
}
/* Custo dos materiais consumidos por um pedido (cor sup + cor inf + EPS com fator). */
function valorMateriaisDoPedido(p){
  let v = 0;
  const m = Number(p.metragem||0);
  const unit = id=>{ const mat = STATE.materiais.find(x=>x.id===id); return mat ? Number(mat.valorUnitario||0) : 0; };
  if(p.corSupId) v += unit(p.corSupId)*m;
  if(p.corInfId) v += unit(p.corInfId)*m;
  if(p.epsId){
    const mat = STATE.materiais.find(x=>x.id===p.epsId);
    const fator = mat ? Number(mat.fator||1) : 1;
    v += unit(p.epsId)*m*fator;
  }
  return v;
}
/* Totais das caixas do dashboard, respeitando o filtro de período da tela.
   Cada um traz metragem e valor; a caixa escolhe qual mostrar. */
function dashTotais(f){
  const r2 = v=>Math.round(v*100)/100;
  let bobM=0, bobV=0, epsM=0, epsV=0;
  STATE.notas.forEach(function(n){
    if(!matchesDateFilters(n.data, f)) return;
    (n.itens||[]).forEach(function(it){
      const mat = STATE.materiais.find(x=>x.id===it.materialId);
      if(!mat) return;
      const q = Number(it.quantidade||0);
      const v = q*Number(it.valorUnitario||mat.valorUnitario||0);
      if(mat.tipo==="Bobina"){ bobM+=q; bobV+=v; }
      else if(mat.tipo==="EPS"){ epsM+=q; epsV+=v; }
    });
  });
  let entM=0, entV=0, entQtd=0;
  STATE.pedidos.forEach(function(p){
    if(p.etapaAtual!=="entregue") return;
    /* Usa a data em que foi efetivamente entregue; se faltar, cai na programada. */
    if(!matchesDateFilters(p.dataEntregue||p.dataProg, f)) return;
    entM += Number(p.metragem||0); entV += valorMateriaisDoPedido(p); entQtd += 1;
  });
  let pintM=0, pintV=0, pintQtd=0;
  STATE.pedidos.forEach(function(p){
    if(!p.temPintura) return;
    if(!stageConcluido(p, "pintura")) return;
    if(!matchesDateFilters(p.dataProg, f)) return;
    pintM += Number(p.metragem||0); pintV += valorMateriaisDoPedido(p); pintQtd += 1;
  });
  return {
    bobinasCompradas:{m:r2(bobM), valor:r2(bobV)},
    epsComprado:{m:r2(epsM), valor:r2(epsV)},
    pedidosEntregues:{m:r2(entM), valor:r2(entV), qtd:entQtd},
    enviadoPintura:{m:r2(pintM), valor:r2(pintV), qtd:pintQtd},
  };
}

function shiftMonth(n){
  let m = STATE.calMonth + n, y = STATE.calYear;
  if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
  STATE.calMonth = m; STATE.calYear = y;
  renderScreen();
}
function updateCalFiltro(key, val){ STATE[key]=val; renderScreen(); }
function toggleCalStatus(statusId){ STATE.calStatusVisiveis[statusId] = !(STATE.calStatusVisiveis[statusId]!==false); renderScreen(); }
function dayCellHtml(dateStr, dayNum, items, isCurrentMonth){
  const totalM = items.reduce((s,p)=>s+Number(p.metragem||0),0);
  const isToday = dateStr===todayStr();
  let chips = items.slice(0,3).map(p=>{
    const st = STATE.statusOptions.find(s=>s.id===p.situacaoId);
    const color = st?st.cor:COLORS.textMuted;
    const cidade = STATE.cidades.find(c=>c.id===p.cidadeId);
    const label = (p.cliente||"—")+(cidade?" · "+cidade.nome:"");
    return '<div onclick="openPedidoModal(\'edit\',\''+p.id+'\')" style="cursor:pointer;font-size:10px;padding:3px 5px;border-radius:4px;background:'+color+'18;border-left:3px solid '+color+';margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="'+escapeAttr(label+" — "+fmtNum(p.metragem)+"m")+'">'+escapeHtml(label)+'</div>';
  }).join("");
  const maisBtn = items.length>3
    ? '<div onclick="openDiaPedidosModal(\''+dateStr+'\')" style="cursor:pointer;font-size:9.5px;color:'+COLORS.brand+';font-weight:700;padding:2px 0;text-decoration:underline">Ver todos os '+items.length+' pedido(s)</div>'
    : '';
  const headerClick = items.length>0 ? ' onclick="openDiaPedidosModal(\''+dateStr+'\')" title="Ver todos os pedidos do dia"' : '';
  return '<div style="min-height:112px;border:1px solid var(--steel-border);border-radius:6px;padding:6px;background:'+(isCurrentMonth?"var(--panel)":"var(--panel-alt)")+';'+(isToday?"box-shadow:inset 0 0 0 2px "+COLORS.brand+";":"")+'">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;'+(items.length>0?"cursor:pointer":"")+'"'+headerClick+'>'+
      '<span style="font-size:11px;font-weight:700;color:'+(isCurrentMonth?COLORS.text:COLORS.textMuted)+'">'+dayNum+'</span>'+
      (totalM>0?'<span style="font-size:9.5px;font-family:\'IBM Plex Mono\',monospace;color:'+COLORS.brand+';font-weight:600">'+fmtNum(totalM)+'m</span>':'')+
    '</div>'+chips+maisBtn+
  '</div>';
}

function renderCalendarioScreen(){
  const year = STATE.calYear, month = STATE.calMonth;
  const maquina = STATE.equipamentos.find(e=>e.id===STATE.calMaquinaId);
  const pedidosVisiveis = STATE.pedidos.filter(p=>{
    if(!p.dataProg) return false;
    if(STATE.calMaquinaId && p.equipamentoId!==STATE.calMaquinaId) return false;
    return STATE.calStatusVisiveis[p.situacaoId] !== false;
  });
  const porData = {};
  pedidosVisiveis.forEach(p=>{ (porData[p.dataProg]=porData[p.dataProg]||[]).push(p); });

  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();

  const cells = [];
  for(let i=0;i<startWeekday;i++){
    const dayNum = prevMonthDays - startWeekday + 1 + i;
    const d = new Date(year, month-1, dayNum);
    cells.push({dateStr: toISO(d), dayNum, currentMonth:false});
  }
  for(let d=1; d<=daysInMonth; d++){
    cells.push({dateStr: toISO(new Date(year,month,d)), dayNum: d, currentMonth:true});
  }
  while(cells.length % 7 !== 0){
    const last = cells[cells.length-1];
    const nd = addDays(new Date(last.dateStr+"T00:00:00"), 1);
    cells.push({dateStr: toISO(nd), dayNum: nd.getDate(), currentMonth:false});
  }

  const weekdayHeaders = DIAS_SEMANA_CURTO.map(d=>'<div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:'+COLORS.textMuted+';font-weight:700;text-align:center;padding:4px">'+d+'</div>').join("");
  const cellsHtml = cells.map(c=>dayCellHtml(c.dateStr, c.dayNum, porData[c.dateStr]||[], c.currentMonth)).join("");
  const monthLabel = MESES[month]+" de "+year;

  const monthPrefix = year+"-"+pad2(month+1);
  let totalMesMetragem = 0, totalMesPedidos = 0;
  Object.keys(porData).forEach(d=>{ if(d.slice(0,7)===monthPrefix){ totalMesPedidos += porData[d].length; totalMesMetragem += porData[d].reduce((s,p)=>s+Number(p.metragem||0),0); } });

  const statusToggleHtml = STATE.statusOptions.map(s=>{
    const checked = STATE.calStatusVisiveis[s.id]!==false;
    return '<label class="day-toggle" style="background:'+(checked?s.cor+"22":"transparent")+';color:'+(checked?s.cor:COLORS.textMuted)+';border-color:'+(checked?s.cor+"55":"var(--steel)")+'">'+
      '<input type="checkbox" '+(checked?"checked":"")+' onchange="toggleCalStatus(\''+s.id+'\')" style="accent-color:'+s.cor+'"/>'+escapeHtml(s.nome)+'</label>';
  }).join("");

  document.getElementById("content").innerHTML =
    screenHeaderHtml("calendar","Calendário de Produção","Visão mensal de todos os pedidos programados — clique num pedido para editar",
      '<div style="display:flex;align-items:center;gap:10px">'+
        '<button class="icon-btn" onclick="shiftMonth(-1)">'+icon("chevronLeft",15)+'</button>'+
        '<span style="font-family:\'Space Grotesk\',sans-serif;font-size:14px;font-weight:700;color:'+COLORS.brand+';white-space:nowrap;text-transform:capitalize">'+monthLabel+'</span>'+
        '<button class="icon-btn" onclick="shiftMonth(1)">'+icon("chevronRight",15)+'</button>'+
      '</div>')+
    '<div class="stat-row">'+
      statCardHtml("Pedidos no Mês", totalMesPedidos, "dashboard")+
      statCardHtml("Metragem no Mês", fmtNum(totalMesMetragem)+" m", "package", COLORS.brand)+
    '</div>'+
    '<div class="pcp-card filter-bar">'+
      '<div style="min-width:220px"><label class="field-label">Máquina</label><select class="field-select" onchange="updateCalFiltro(\'calMaquinaId\', this.value)"><option value="">Todas as máquinas</option>'+
        STATE.equipamentos.map(e=>'<option value="'+e.id+'" '+(STATE.calMaquinaId===e.id?"selected":"")+'>'+escapeHtml(e.nome)+'</option>').join("")+
        '</select></div>'+
    '</div>'+
    '<div class="pcp-card" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px">'+
      '<label class="field-label" style="margin:0;margin-right:4px">Mostrar situações:</label>'+statusToggleHtml+
    '</div>'+
    '<div class="pcp-card">'+
      '<div class="cal-grid-outer">'+
        '<div class="cal-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px">'+weekdayHeaders+'</div>'+
        '<div class="cal-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">'+cellsHtml+'</div>'+
      '</div>'+
    '</div>';
}

async function saveMetaDiaOverride(stage, dataStr, valorStr){
  const valor = (valorStr==null || valorStr==="") ? null : Number(valorStr);
  const mapa = Object.assign({}, (STATE.metasDiaOverride[stage]||{}));
  if(valor==null || isNaN(valor)) delete mapa[dataStr]; else mapa[dataStr] = valor;
  const ok = await configSet("metas_dia_"+stage, mapa);
  if(!ok) return;
  STATE.metasDiaOverride[stage] = mapa;
  renderScreen();
  showToast("success","Meta do dia "+fmtDateBR(dataStr)+" atualizada.");
}
async function clearMetaDiaOverride(stage, dataStr){
  const mapa = Object.assign({}, (STATE.metasDiaOverride[stage]||{}));
  delete mapa[dataStr];
  const ok = await configSet("metas_dia_"+stage, mapa);
  if(!ok) return;
  STATE.metasDiaOverride[stage] = mapa;

async function submitNovoFeriado(){
  const dataInput = document.getElementById("novo-feriado-data");
  const nomeInput = document.getElementById("novo-feriado-nome");
  const data = dataInput.value;
  const nome = (nomeInput.value||"").trim();
  if(!data || !nome){ showToast("error","Informe a data e o nome do feriado."); return; }
  const lista = (STATE.feriadosCustom||[]).slice();
  lista.push({data:data, nome:nome});
  const ok = await configSet("feriados_custom", lista);
  if(!ok) return;
  STATE.feriadosCustom = lista;
  closeModal();
  renderScreen();

async function removerFeriado(dataStr, isCustom){
  if(isCustom){
    const lista = (STATE.feriadosCustom||[]).filter(function(f){ return f.data!==dataStr; });
    const ok = await configSet("feriados_custom", lista);
    if(!ok) return;
    STATE.feriadosCustom = lista;
  } else {
    const lista = (STATE.feriadosRemovidos||[]).slice();
    if(lista.indexOf(dataStr)===-1) lista.push(dataStr);
    const ok = await configSet("feriados_removidos", lista);
    if(!ok) return;
    STATE.feriadosRemovidos = lista;
  }
  renderScreen();
  showToast("info","Feriado removido da lista.");
}

async function confirmAplicarMetaEmMassa(stage){
  const dataIniEl = document.getElementById("massa-data-ini");
  const dataFimEl = document.getElementById("massa-data-fim");
  const valorEl = document.getElementById("massa-valor");
  const pularFeriadosEl = document.getElementById("massa-pular-feriados");
  const dataIni = dataIniEl ? dataIniEl.value : "";
  const dataFim = dataFimEl ? dataFimEl.value : "";
  if(!dataIni || !dataFim){ showToast("error","Informe as datas inicial e final."); return; }
  if(dataFim < dataIni){ showToast("error","A data final precisa ser igual ou depois da data inicial."); return; }
  const valorStr = valorEl ? valorEl.value : "";
  const limpar = valorStr==="" || valorStr==null;
  const valor = limpar ? null : Number(valorStr);
  if(!limpar && (isNaN(valor) || valor<0)){ showToast("error","Informe um valor de meta válido."); return; }
  const diasPermitidos = [];
  for(let i=0;i<7;i++){
    const el = document.getElementById("massa-dow-"+i);
    if(el && el.checked) diasPermitidos.push(i);
  }
  if(diasPermitidos.length===0){ showToast("error","Selecione ao menos um dia da semana."); return; }
  const pularFeriados = !pularFeriadosEl || pularFeriadosEl.checked;

  const mapa = Object.assign({}, (STATE.metasDiaOverride[stage]||{}));
  let d = new Date(dataIni+"T00:00:00");
  const fim = new Date(dataFim+"T00:00:00");
  let contador = 0;
  while(d<=fim){
    const dataStr = toISO(d);
    const wd = d.getDay();
    const aplicaDia = diasPermitidos.indexOf(wd)!==-1 && !(pularFeriados && feriadoInfo(dataStr));
    if(aplicaDia){
      if(limpar) delete mapa[dataStr]; else mapa[dataStr] = valor;
      contador++;
    }
    d = addDays(d,1);
  }
  if(contador===0){ showToast("error","Nenhum dia no período corresponde aos filtros escolhidos."); return; }
  const ok = await configSet("metas_dia_"+stage, mapa);
  if(!ok) return;
  STATE.metasDiaOverride[stage] = mapa;
  closeModal();
  renderScreen();
  showToast("success", (limpar?"Meta padrão restaurada em ":"Meta aplicada em ")+contador+" dia(s).");
}

async function addNota(nota){
  const { data:row, error } = await sb.from("notas").insert({
    data:nota.data, fornecedor:nota.fornecedor||null, numero_nota:nota.numeroNota||null, itens:nota.itens,
  }).select().single();
  if(error){ sbErrorToast("lançar nota de entrada", error); return false; }
  STATE.notas.unshift(mapNotaFromRow(row));
  // Agrupa itens por material (uma nota pode ter mais de uma linha do mesmo material) para
  // evitar leituras concorrentes do mesmo m.estoque/m.valorUnitario e calcular o custo médio corretamente.
  const porMaterial = {};
  nota.itens.forEach(it=>{
    const k = it.materialId;
    if(!porMaterial[k]) porMaterial[k] = {qtd:0, valorTotal:0, temValor:false};
    porMaterial[k].qtd += Number(it.quantidade||0);
    if(Number(it.valorUnitario)>0){
      porMaterial[k].valorTotal += Number(it.quantidade||0)*Number(it.valorUnitario||0);
      porMaterial[k].temValor = true;
    }
  });
  const writes = [];
  Object.keys(porMaterial).forEach(materialId=>{
    const m = STATE.materiais.find(x=>x.id===materialId);
    if(!m) return;
    const agg = porMaterial[materialId];
    const estoqueAnterior = Number(m.estoque||0);
    const custoAnterior = Number(m.valorUnitario||0);
    const novoEstoque = Math.round((estoqueAnterior+agg.qtd)*100)/100;
    const patch = {estoque:novoEstoque};
    let novoCustoMedio = custoAnterior;
    if(agg.temValor){
      const valorTotalAnterior = estoqueAnterior*custoAnterior;
      novoCustoMedio = novoEstoque>0 ? (valorTotalAnterior+agg.valorTotal)/novoEstoque : custoAnterior;
      novoCustoMedio = Math.round(novoCustoMedio*10000)/10000;
      patch.valor_unitario = novoCustoMedio;
    }
    writes.push(sb.from("materiais").update(patch).eq("id", m.id).then(async r=>{
      if(r.error){ sbErrorToast("atualizar estoque de "+m.nome, r.error); }
      else {
        m.estoque = novoEstoque; if(agg.temValor) m.valorUnitario = novoCustoMedio;
        await logMovimento(m.id, "entrada", agg.qtd, "compra", "Nota "+(nota.numeroNota||"—")+(nota.fornecedor?(" — "+nota.fornecedor):""));
      }
    }));
  });
  await Promise.all(writes);
  showToast("success","Nota de entrada lançada, estoque atualizado e custo médio recalculado.");
  return true;
}
async function updateNota(id, nota){
  const old = STATE.notas.find(x=>x.id===id);
  if(!old) return false;
  const { error } = await sb.from("notas").update({
    data:nota.data, fornecedor:nota.fornecedor||null, numero_nota:nota.numeroNota||null, itens:nota.itens,
  }).eq("id", id);
  if(error){ sbErrorToast("atualizar nota de entrada", error); return false; }
  // Custo médio ponderado é cumulativo (estoque × custo médio = valor total em estoque), então
  // corrigir uma nota já lançada equivale a aplicar só a DIFERENÇA entre os valores antigos e os novos.
  const oldByMat = {};
  old.itens.forEach(it=>{
    const k = it.materialId;
    if(!oldByMat[k]) oldByMat[k] = {qtd:0, valorTotal:0};
    oldByMat[k].qtd += Number(it.quantidade||0);
    oldByMat[k].valorTotal += Number(it.quantidade||0)*Number(it.valorUnitario||0);
  });
  const newByMat = {};
  nota.itens.forEach(it=>{
    const k = it.materialId;
    if(!newByMat[k]) newByMat[k] = {qtd:0, valorTotal:0};
    newByMat[k].qtd += Number(it.quantidade||0);
    newByMat[k].valorTotal += Number(it.quantidade||0)*Number(it.valorUnitario||0);
  });
  const materialIds = new Set(Object.keys(oldByMat).concat(Object.keys(newByMat)));
  const writes = [];
  materialIds.forEach(materialId=>{
    const m = STATE.materiais.find(x=>x.id===materialId);
    if(!m) return;
    const o = oldByMat[materialId] || {qtd:0, valorTotal:0};
    const nw = newByMat[materialId] || {qtd:0, valorTotal:0};
    const diffQtd = nw.qtd - o.qtd;
    const diffValorTotal = nw.valorTotal - o.valorTotal;
    if(!diffQtd && !diffValorTotal) return;
    const estoqueAnterior = Number(m.estoque||0);
    const custoAnterior = Number(m.valorUnitario||0);
    const novoEstoque = Math.round((estoqueAnterior+diffQtd)*100)/100;
    const patch = {estoque:novoEstoque};
    let novoCustoMedio = custoAnterior;
    if(diffValorTotal){
      const valorTotalAtual = estoqueAnterior*custoAnterior;
      novoCustoMedio = novoEstoque>0 ? (valorTotalAtual+diffValorTotal)/novoEstoque : custoAnterior;
      novoCustoMedio = Math.round(novoCustoMedio*10000)/10000;
      patch.valor_unitario = novoCustoMedio;
    }
    writes.push(sb.from("materiais").update(patch).eq("id", m.id).then(async r=>{
      if(r.error){ sbErrorToast("ajustar estoque/custo de "+m.nome, r.error); }
      else {
        m.estoque = novoEstoque; if(diffValorTotal) m.valorUnitario = novoCustoMedio;
        if(diffQtd) await logMovimento(m.id, diffQtd>0?"entrada":"saida", diffQtd, "compra", "Ajuste na nota "+(nota.numeroNota||"—")+(nota.fornecedor?(" — "+nota.fornecedor):""));
      }
    }));
  });
  await Promise.all(writes);
  old.data = nota.data; old.fornecedor = nota.fornecedor; old.numeroNota = nota.numeroNota; old.itens = nota.itens;
  showToast("success","Nota atualizada e custo médio recalculado pela diferença.");
  return true;
}

async function doDeleteNota(id){
  const n = STATE.notas.find(x=>x.id===id);
  if(!n){ closeModal(); return; }
  const { error } = await sb.from("notas").delete().eq("id", id);
  if(error){ sbErrorToast("remover nota", error); return; }
  const writes = [];
  n.itens.forEach(it=>{
    const m = STATE.materiais.find(x=>x.id===it.materialId);
    if(!m) return;
    const novoEstoque = Math.round((m.estoque - Number(it.quantidade||0))*100)/100;
    writes.push(sb.from("materiais").update({estoque:novoEstoque}).eq("id", m.id).then(async r=>{
      if(r.error){ sbErrorToast("estornar estoque de "+m.nome, r.error); }
      else {
        m.estoque = novoEstoque;
        await logMovimento(m.id, "saida", it.quantidade, "compra", "Remoção da nota "+(n.numeroNota||"—")+(n.fornecedor?(" — "+n.fornecedor):""));
      }
    }));
  });
  await Promise.all(writes);
  STATE.notas = STATE.notas.filter(x=>x.id!==id);
  closeModal();
  renderScreen();
  showToast("info","Nota removida e estoque estornado.");
}
function onNotaItemMaterialChange(select){
  const opt = select.selectedOptions[0];
  const row = select.closest(".nota-item-row");
  if(!opt || !opt.value || !row) return;
  const unidadeInput = row.querySelector(".nota-item-unidade");
  const valorInput = row.querySelector(".nota-item-valor");
  if(unidadeInput && !unidadeInput.value) unidadeInput.value = opt.getAttribute("data-unidade")||"";
  if(valorInput && !valorInput.value) valorInput.value = opt.getAttribute("data-valor")||"";
  const fatorKg = Number(opt.getAttribute("data-fator-kg")||0);
  const fatorInput = row.querySelector(".nota-item-fator-kg");
  if(fatorInput) fatorInput.value = fatorKg>0 ? fatorKg : "";
  const checkbox = row.querySelector(".nota-item-conv-toggle");
  const hint = row.querySelector(".nota-item-conv-hint");
  if(checkbox){
    checkbox.disabled = fatorKg<=0;
    if(fatorKg>0 && !checkbox.checked){ checkbox.checked = true; toggleNotaItemConversao(checkbox); }
    else if(fatorKg<=0 && checkbox.checked){ checkbox.checked = false; toggleNotaItemConversao(checkbox); }
  }
  if(hint) hint.style.display = fatorKg<=0 ? "block" : "none";
}

function toggleNotaItemConversao(checkbox){
  const row = checkbox.closest(".nota-item-row");
  const convFields = row.querySelector(".nota-item-conv-fields");
  const qtdInput = row.querySelector(".nota-item-qtd");
  const valorInput = row.querySelector(".nota-item-valor");
  if(checkbox.checked){
    convFields.style.display = "grid";
    if(qtdInput){ qtdInput.readOnly = true; qtdInput.style.background = "var(--panel-alt)"; }
    if(valorInput){ valorInput.readOnly = true; valorInput.style.background = "var(--panel-alt)"; }
    recalcNotaItemConversao(checkbox);
  } else {
    convFields.style.display = "none";
    if(qtdInput){ qtdInput.readOnly = false; qtdInput.style.background = ""; }
    if(valorInput){ valorInput.readOnly = false; valorInput.style.background = ""; }
  }

function recalcNotaItemConversao(el){
  const row = el.closest(".nota-item-row");
  const kg = Number(row.querySelector(".nota-item-kg").value||0);
  const custoKg = Number(row.querySelector(".nota-item-custo-kg").value||0);
  const fatorKg = Number(row.querySelector(".nota-item-fator-kg").value||0);
  const qtdM = fatorKg>0 ? kg/fatorKg : 0;
  const valorM = custoKg * fatorKg;
  const qtdOut = row.querySelector(".nota-item-conv-qtd");
  const valorOut = row.querySelector(".nota-item-conv-valor");
  if(qtdOut) qtdOut.textContent = fmtNum(qtdM)+" m";
  if(valorOut) valorOut.textContent = fmtBRL(valorM)+"/m";
  const qtdInput = row.querySelector(".nota-item-qtd");
  const valorInput = row.querySelector(".nota-item-valor");
  const unidadeInput = row.querySelector(".nota-item-unidade");
  if(qtdInput) qtdInput.value = qtdM>0 ? qtdM.toFixed(2) : "";
  if(valorInput) valorInput.value = valorM>0 ? valorM.toFixed(2) : "";
  if(unidadeInput && !unidadeInput.value) unidadeInput.value = "m";

async function submitNotaForm(event, editId){
  event.preventDefault();
  const form = event.target;
  const data = form.querySelector('input[name="data"]').value;
  const fornecedor = form.querySelector('input[name="fornecedor"]').value;
  const numeroNota = form.querySelector('input[name="numeroNota"]').value;
  const rows = form.querySelectorAll(".nota-item-row");
  const itens = [];
  rows.forEach(r=>{
    const materialId = r.querySelector(".nota-item-material").value;
    const quantidade = Number(r.querySelector(".nota-item-qtd").value||0);
    const unidade = r.querySelector(".nota-item-unidade").value.trim();
    const valorUnitario = Number(r.querySelector(".nota-item-valor").value||0);
    const kgInput = r.querySelector(".nota-item-kg");
    const custoKgInput = r.querySelector(".nota-item-custo-kg");
    const kgTotais = kgInput ? Number(kgInput.value||0) : 0;
    const custoPorKg = custoKgInput ? Number(custoKgInput.value||0) : 0;
    if(materialId && quantidade>0) itens.push({materialId, quantidade, unidade, valorUnitario, kgTotais, custoPorKg});
  });
  if(itens.length===0) return false;
  const ok = editId ? await updateNota(editId, {data, fornecedor, numeroNota, itens}) : await addNota({data, fornecedor, numeroNota, itens});
  if(ok===false) return false;
  closeModal();
  renderScreen();
  return false;
}
function updateNotasFiltro(key, val){ STATE.notasFiltro[key]=val; renderScreen(); }
function clearNotasFiltro(){ STATE.notasFiltro = {produto:"",tipo:"",dIni:"",dFim:"",mes:"",ano:""}; renderScreen(); }
function notaMatchesFiltro(n, f){
  if(f.dIni && n.data<f.dIni) return false;
  if(f.dFim && n.data>f.dFim) return false;
  if(f.mes && n.data.slice(5,7)!==f.mes) return false;
  if(f.ano && n.data.slice(0,4)!==f.ano) return false;
  if(f.produto || f.tipo){
    const matchItem = n.itens.some(it=>{
      const m = STATE.materiais.find(x=>x.id===it.materialId);
      if(!m) return false;
      if(f.tipo && m.tipo!==f.tipo) return false;
      if(f.produto && !(m.nome||"").toLowerCase().includes(f.produto.toLowerCase())) return false;
      return true;
    });
    if(!matchItem) return false;
  }
  return true;
}
function notasAggregateStats(notas){
  let totalKg=0, totalM=0, totalValor=0;
  notas.forEach(n=>{
    n.itens.forEach(it=>{
      totalKg += Number(it.kgTotais||0);
      const unidade = it.unidade || "m";
      if(unidade==="m") totalM += Number(it.quantidade||0);
      totalValor += Number(it.quantidade||0)*Number(it.valorUnitario||0);
    });
  });
  const custoMedio = totalM>0 ? totalValor/totalM : 0;
  return {totalKg, totalM, totalValor, custoMedio};
}

/* ============================== ACOMPANHAMENTO DE PREÇO POR PRODUTO (INFLAÇÃO INTERNA) ============================== */
const MESES_ABREV = MESES.map(function(n){ return n.slice(0,3).toLowerCase(); });
function fmtMesAno(mesAno){
  const parts = mesAno.split("-");
  const y = parts[0], m = Number(parts[1]);
  return MESES_ABREV[m-1]+"/"+y.slice(2);
}
function monthRangeList(startMesAno, endMesAno){
  const out = [];
  const sp = startMesAno.split("-"); let y = Number(sp[0]), m = Number(sp[1]);
  const ep = endMesAno.split("-"); const ey = Number(ep[0]), em = Number(ep[1]);
  let guard = 0;
  while((y<ey || (y===ey && m<=em)) && guard<600){
    out.push(y+"-"+pad2(m));
    m++; if(m>12){ m=1; y++; }
    guard++;
  }
  return out;
}
function variacaoPct(de, para){ return de>0 ? ((para-de)/de)*100 : 0; }
function fmtPct(v){ return (v>=0?"+":"")+v.toFixed(1).replace(".",",")+"%"; }
function itensPrecoDoMaterial(materialId, dIni, dFim){
  const out = [];
  STATE.notas.forEach(n=>{
    if(!n.data) return;
    if(dIni && n.data<dIni) return;
    if(dFim && n.data>dFim) return;
    n.itens.forEach(it=>{
      if(it.materialId!==materialId) return;
      if(!(Number(it.valorUnitario)>0)) return;
      out.push({data:n.data, valorUnitario:Number(it.valorUnitario), quantidade:Number(it.quantidade||0)});
    });
  });
  return out.sort(function(a,b){ return a.data.localeCompare(b.data); });
}
function precoMensalDoMaterial(materialId, dIni, dFim){
  const itens = itensPrecoDoMaterial(materialId, dIni, dFim);
  const porMes = {};
  itens.forEach(it=>{
    const mesAno = it.data.slice(0,7);
    if(!porMes[mesAno]) porMes[mesAno] = {somaValor:0, somaQtd:0};
    const qtd = it.quantidade>0 ? it.quantidade : 1;
    porMes[mesAno].somaValor += it.valorUnitario*qtd;
    porMes[mesAno].somaQtd += qtd;
  });
  return Object.keys(porMes).sort().map(function(mesAno){
    const d = porMes[mesAno];
    return {mesAno:mesAno, precoMedio: d.somaQtd>0 ? d.somaValor/d.somaQtd : 0, qtd: d.somaQtd};
  });
}
function precoRankingPorPeriodo(tipo, dIni, dFim){
  const out = [];
  STATE.materiais.forEach(function(m){
    if(tipo && m.tipo!==tipo) return;
    const mensal = precoMensalDoMaterial(m.id, dIni, dFim);
    if(mensal.length<1) return;
    const inicial = mensal[0].precoMedio;
    const final = mensal[mensal.length-1].precoMedio;
    out.push({material:m, inicial:inicial, final:final, variacao:variacaoPct(inicial,final), pontos:mensal.length});
  });
  return out.sort(function(a,b){ return b.variacao-a.variacao; });
}
function priceTrendChartHtml(mensal, cor){
  if(mensal.length===0) return '<p style="font-size:12.5px;color:'+COLORS.textMuted+';padding:20px 0;text-align:center">Nenhum preço registrado neste período.</p>';
  const meses = monthRangeList(mensal[0].mesAno, mensal[mensal.length-1].mesAno);
  const porMes = {}; mensal.forEach(function(x){ porMes[x.mesAno]=x; });
  const valores = meses.map(function(mesAno){ return porMes[mesAno] ? porMes[mesAno].precoMedio : null; });
  const maxValor = Math.max.apply(null, valores.filter(function(v){ return v!=null; }).concat([1]));
  const escala = maxValor*1.15;
  let anterior = null;
  const barras = meses.map(function(mesAno,i){
    const v = valores[i];
    const alturaPct = (v!=null && escala>0) ? Math.min(100,(v/escala)*100) : 0;
    let variacaoTxt = "";
    if(v!=null && anterior!=null) variacaoTxt = " · "+fmtPct(variacaoPct(anterior,v))+" vs mês anterior";
    const corBarra = v==null ? "var(--steel-border)" : cor;
    const tip = fmtMesAno(mesAno)+" — "+(v!=null?fmtBRL(v):"sem compra")+variacaoTxt;
    if(v!=null) anterior = v;
    return '<div class="chart-col" title="'+escapeAttr(tip)+'">'+
      (v!=null ? '<div style="font-size:7.5px;color:'+COLORS.textMuted+';margin-bottom:2px;white-space:nowrap">'+fmtNum(v)+'</div>' : '')+
      '<div class="chart-bar" style="height:'+alturaPct+'%;background:'+corBarra+'"></div>'+
    '</div>';
  }).join("");
  const rotulos = meses.map(function(mesAno){ return '<div class="chart-day" style="font-size:8px">'+fmtMesAno(mesAno)+'</div>'; }).join("");
  return '<div class="chart-wrap">'+barras+'</div><div class="chart-days">'+rotulos+'</div>';
}

function clearPrecoFiltro(){ STATE.precoFiltro = {materialId:"",tipo:"",dIni:"",dFim:""}; renderScreen(); }

  }
  const inicial = mensal[0].precoMedio;
  const final = mensal[mensal.length-1].precoMedio;
  const variacao = variacaoPct(inicial, final);
  const corVariacao = variacao>0 ? COLORS.red : (variacao<0 ? COLORS.green : COLORS.textMuted);
  const statsHtml = '<div class="stat-row" style="margin-top:14px">'+

  '</div>';
  const chart = '<div class="pcp-card" style="margin-top:14px">'+
    '<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px">'+icon("trendingUp",17,COLORS.brand)+
      '<h3 style="font-family:\'Space Grotesk\',sans-serif;font-size:15.5px;font-weight:600;margin:0">'+escapeHtml(m.nome)+' — preço médio por mês (R$/'+unidade+')</h3></div>'+
    priceTrendChartHtml(mensal, COLORS.brand)+
  '</div>';
  let anterior = null;
  const rows = mensal.map(function(x){
    const variacaoMes = anterior!=null ? variacaoPct(anterior, x.precoMedio) : null;
    anterior = x.precoMedio;
    const variacaoCell = variacaoMes==null
      ? '<span style="color:'+COLORS.textMuted+'">—</span>'
      : '<span style="color:'+(variacaoMes>0?COLORS.red:(variacaoMes<0?COLORS.green:COLORS.textMuted))+';font-weight:600">'+fmtPct(variacaoMes)+'</span>';

/* ============================== FATOR DE CONVERSÃO (KG → METRO) — COM VIGÊNCIAS ============================== */
function updateFatorConversaoFiltro(key, val){ STATE.fatorConversaoFiltro[key]=val; renderScreen(); }
function clearFatorConversaoFiltro(){ STATE.fatorConversaoFiltro = {tipo:"",produto:""}; renderScreen(); }
function historicoDoMaterial(materialId){
  return STATE.fatorConversaoHistorico
    .filter(h=>h.materialId===materialId)
    .sort(function(a,b){
      if(a.vigenciaDesde!==b.vigenciaDesde) return a.vigenciaDesde<b.vigenciaDesde?1:-1;
      return (b.criadoEm||"").localeCompare(a.criadoEm||"");
    });
}
function fatorVigenteInfo(materialId){
  const hoje = todayStr();
  const hist = historicoDoMaterial(materialId).filter(h=>h.vigenciaDesde<=hoje);
  return hist.length ? hist[0] : null;
}
function fatorVigenteDoMaterial(materialId){
  const info = fatorVigenteInfo(materialId);
  return info ? Number(info.fator||0) : 0;
}
async function addVigenciaFator(materialId, fator, vigenciaDesde){
  const { data:row, error } = await sb.from("fator_conversao_historico").insert({
    material_id:materialId, fator:Number(fator), vigencia_desde:vigenciaDesde,
  }).select().single();
  if(error){ sbErrorToast("cadastrar vigência do fator de conversão", error); return false; }
  STATE.fatorConversaoHistorico.unshift(mapFatorHistoricoFromRow(row));
  return true;
}
async function deleteVigenciaFator(id, materialId){
  const { error } = await sb.from("fator_conversao_historico").delete().eq("id", id);
  if(error){ sbErrorToast("remover vigência", error); return; }
  STATE.fatorConversaoHistorico = STATE.fatorConversaoHistorico.filter(h=>h.id!==id);
  showToast("success","Vigência removida.");
  renderScreen();
  openHistoricoVigenciasModal(materialId);
}

/* ============================== ACOMPANHAMENTO DA PRODUÇÃO ============================== */
function updateAcompFiltro(key, val){ STATE.acompFiltro[key]=val; renderScreen(); }
function clearAcompFiltro(){
  STATE.acompFiltro = {mes:pad2(new Date().getMonth()+1), ano:String(new Date().getFullYear()), maquinaId:"", base:"concl", modo:"dia"};
  renderScreen();
}
function stageConcluido(p, stage){
  const order = stageOrderFor(p);
  const iStage = order.indexOf(stage);
  if(iStage===-1) return false;
  if(p.etapaAtual==="entregue") return true;
  const iAtual = order.indexOf(p.etapaAtual);
  if(iAtual===-1) return false;
  return iAtual > iStage;
}
function normTipoStr(s){ return (s||"").trim().toLowerCase(); }
function fatorProducaoPerfilarPara(tipo){
  if(!tipo) return 1;
  const alvo = normTipoStr(tipo);
  const mapa = STATE.fatoresProducaoPerfilar || {};
  const chave = Object.keys(mapa).find(function(k){ return normTipoStr(k)===alvo; });
  const val = chave ? Number(mapa[chave]) : 1;
  return val>0 ? val : 1;
}
function producaoDiariaPorEtapa(stage){
  const f = STATE.acompFiltro;
  const dias = new Array(31).fill(0);
  const pedidosDia = new Array(31).fill(0);
  STATE.pedidos.forEach(function(p){
    if(!p.dataProg) return;
    if(f.ano && p.dataProg.slice(0,4)!==String(f.ano)) return;
    if(f.mes && p.dataProg.slice(5,7)!==String(f.mes)) return;
    if(f.maquinaId && p.equipamentoId!==f.maquinaId) return;
    if(stage==="colagem" && !p.temColagem) return;
    if(f.base==="concl" && !stageConcluido(p, stage)) return;
    const d = Number(p.dataProg.slice(8,10));
    if(!(d>=1 && d<=31)) return;
    const fator = stage==="perfilar" ? fatorProducaoPerfilarPara(p.tipo) : 1;
    dias[d-1] += Number(p.metragem||0)*fator;
    pedidosDia[d-1] += 1;
  });
  return {dias:dias, pedidos:pedidosDia};
}
function diasNoMes(ano, mes){
  const y = Number(ano), m = Number(mes);
  if(!y || !m) return 31;
  return new Date(y, m, 0).getDate();
}
/* Dia de referência para o cálculo "até hoje": no mês corrente é o dia de hoje (limitado ao
   tamanho do mês); em mês já encerrado é o mês inteiro (mesmo valor do acumulado do mês);
   em mês futuro ainda não há dias decorridos. */
function diaReferenciaAteHoje(ano, mes, maxDia){
  const hoje = new Date();
  const anoAtual = hoje.getFullYear(), mesAtual = hoje.getMonth()+1, diaAtual = hoje.getDate();
  const anoNum = Number(ano), mesNum = Number(mes);
  if(anoNum < anoAtual || (anoNum===anoAtual && mesNum < mesAtual)) return maxDia;
  if(anoNum > anoAtual || (anoNum===anoAtual && mesNum > mesAtual)) return 0;
  return Math.min(diaAtual, maxDia);
}

/* ============================== OBSERVAÇÕES DIÁRIAS DE PRODUÇÃO ============================== */
function obsCacheKey(stage, ano, mes){ return stage+"_"+ano+"_"+mes; }
function obsConfigKey(stage, ano, mes){ return "obs_producao_"+stage+"_"+ano+"_"+mes; }
function ensureObsProducaoLoaded(stage, ano, mes){

  if(STATE.obsProducao[cacheKey]!==undefined) return;

  STATE.obsProducaoLoading[cacheKey] = true;
  configGet(obsConfigKey(stage, ano, mes)).then(function(data){

}

async function saveObsDia(stage, dia){
  const textarea = document.getElementById("obs-dia-textarea");
  const texto = (textarea ? textarea.value : "").trim();
  const f = STATE.acompFiltro;
  const cacheKey = obsCacheKey(stage, f.ano, f.mes);
  const obsMes = Object.assign({}, STATE.obsProducao[cacheKey]||{});
  const diaStr = pad2(dia);
  if(texto) obsMes[diaStr] = texto; else delete obsMes[diaStr];

function acumularArray(arr){
  let acc = 0;
  return arr.map(function(v){ acc += Number(v||0); return acc; });
}
function weekdayIdxForDate(ano, mes, dia){
  const d = new Date(Number(ano), Number(mes)-1, dia);
  const wd = d.getDay();
  return wd===0 ? -1 : wd-1;
}
/* ---- Feriados nacionais (fixos + móveis via algoritmo de Meeus/Jones/Butcher p/ Páscoa) ---- */
function feriadosNacionaisDoAno(ano){
  const y = Number(ano);
  const fixos = [
    {md:"01-01", nome:"Confraternização Universal"},
    {md:"04-21", nome:"Tiradentes"},
    {md:"05-01", nome:"Dia do Trabalho"},
    {md:"09-07", nome:"Independência do Brasil"},
    {md:"10-12", nome:"Nossa Senhora Aparecida"},
    {md:"11-02", nome:"Finados"},
    {md:"11-15", nome:"Proclamação da República"},
    {md:"11-20", nome:"Consciência Negra"},
    {md:"12-25", nome:"Natal"},
  ].map(function(f){ return {data:y+"-"+f.md, nome:f.nome, fixo:true}; });
  const a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3),
    h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
    mesP=Math.floor((h+l-7*m+114)/31), diaP=((h+l-7*m+114)%31)+1;
  const pascoa = new Date(y, mesP-1, diaP);
  const moveis = [
    {off:-48, nome:"Carnaval (segunda)"},
    {off:-47, nome:"Carnaval (terça)"},
    {off:-2, nome:"Sexta-feira Santa"},
    {off:60, nome:"Corpus Christi"},
  ].map(function(f){ return {data:toISO(addDays(pascoa,f.off)), nome:f.nome, fixo:false}; });
  return fixos.concat(moveis);
}
function feriadosEfetivosDoAno(ano){
  const removidos = STATE.feriadosRemovidos||[];
  const nacionais = feriadosNacionaisDoAno(ano).filter(function(f){ return removidos.indexOf(f.data)===-1; });
  const customDoAno = (STATE.feriadosCustom||[]).filter(function(f){ return f.data && f.data.slice(0,4)===String(ano); }).map(function(f){ return {data:f.data, nome:f.nome, fixo:false, custom:true}; });
  return nacionais.concat(customDoAno).sort(function(a,b){ return a.data.localeCompare(b.data); });
}
function feriadoInfo(dataStr){
  if(!dataStr) return null;
  const ano = dataStr.slice(0,4);
  const lista = feriadosEfetivosDoAno(ano);
  return lista.find(function(f){ return f.data===dataStr; }) || null;
}
function metaDoDia(stage, ano, mes, dia){
  const dataStr = ano+"-"+pad2(mes)+"-"+pad2(dia);
  const overrides = (STATE.metasDiaOverride && STATE.metasDiaOverride[stage]) || {};
  if(overrides[dataStr]!=null) return Number(overrides[dataStr]||0);
  const idx = weekdayIdxForDate(ano, mes, dia);
  if(idx<0) return 0;
  if(feriadoInfo(dataStr)) return 0;
  const s = STATE.stageState[stage];
  const metas = (s && s.metas) || [];
  return Number(metas[idx]||0);
}
function cumulativeLineChartHtml(cor, maxDia, metasPorDia, dadosDias, ano, mes){
  const metaAcum = acumularArray(metasPorDia.slice(0,maxDia));
  const realAcum = acumularArray(dadosDias.slice(0,maxDia));
  const maxValor = Math.max.apply(null, metaAcum.concat(realAcum).concat([1]));
  const W = 1000, H = 200, padTop = 12, padBottom = 12, padX = 8;
  const plotH = H - padTop - padBottom;
  const xFor = function(dia){ return padX + ((dia-0.5)/31)*(W-2*padX); };
  const yFor = function(v){ return padTop + plotH - (maxValor>0 ? (v/maxValor)*plotH : 0); };
  const metaPts = metaAcum.map(function(v,i){ return xFor(i+1).toFixed(1)+','+yFor(v).toFixed(1); }).join(' ');
  const realPts = realAcum.map(function(v,i){ return xFor(i+1).toFixed(1)+','+yFor(v).toFixed(1); }).join(' ');
  const areaPts = realAcum.length ? (xFor(1).toFixed(1)+','+yFor(0).toFixed(1)+' '+realPts+' '+xFor(realAcum.length).toFixed(1)+','+yFor(0).toFixed(1)) : '';
  const gridHtml = [0.25,0.5,0.75,1].map(function(f){
    const valor = maxValor*f;
    const y = yFor(valor);
    return '<line x1="'+padX+'" y1="'+y.toFixed(1)+'" x2="'+(W-padX)+'" y2="'+y.toFixed(1)+'" stroke="'+COLORS.steelBorder+'" stroke-width="1" stroke-dasharray="4,4"/>'+
      '<text x="'+(W-padX-4)+'" y="'+(y-3).toFixed(1)+'" font-size="12" text-anchor="end" fill="'+COLORS.textMuted+'">'+Math.round(valor)+'</text>';
  }).join('');
  const diaRef = diaReferenciaAteHoje(ano, mes, maxDia);
  const hojeLineHtml = (diaRef>0 && diaRef<=maxDia)
    ? '<line x1="'+xFor(diaRef).toFixed(1)+'" y1="'+padTop+'" x2="'+xFor(diaRef).toFixed(1)+'" y2="'+(padTop+plotH)+'" stroke="'+COLORS.brand+'" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.65"><title>Hoje — dia '+pad2(diaRef)+'</title></line>'
    : '';
  const metaCircles = metaAcum.map(function(v,i){
    const dia=i+1;
    return '<circle cx="'+xFor(dia).toFixed(1)+'" cy="'+yFor(v).toFixed(1)+'" r="2.5" fill="'+COLORS.red+'"><title>Dia '+pad2(dia)+' — Meta acumulada: '+fmtNum(v)+' m</title></circle>';
  }).join('');
  const realCircles = realAcum.map(function(v,i){
    const dia=i+1;
    return '<circle cx="'+xFor(dia).toFixed(1)+'" cy="'+yFor(v).toFixed(1)+'" r="3" fill="'+cor+'"><title>Dia '+pad2(dia)+' — Real acumulado: '+fmtNum(v)+' m</title></circle>';
  }).join('');
  return '<div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:200px;display:block;overflow:visible" preserveAspectRatio="none">'+
      gridHtml+
      '<line x1="'+padX+'" y1="'+(padTop+plotH)+'" x2="'+(W-padX)+'" y2="'+(padTop+plotH)+'" stroke="'+COLORS.steelBorder+'" stroke-width="1"/>'+
      (areaPts?'<polygon points="'+areaPts+'" fill="'+cor+'" opacity="0.12"/>':'')+
      hojeLineHtml+
      '<polyline points="'+metaPts+'" fill="none" stroke="'+COLORS.red+'" stroke-width="2.5" stroke-dasharray="8,5"/>'+
      '<polyline points="'+realPts+'" fill="none" stroke="'+cor+'" stroke-width="3"/>'+
      metaCircles+realCircles+
    '</svg>'+
    '<div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:'+COLORS.textMuted+'">'+
      '<div style="display:flex;align-items:center;gap:6px"><span style="width:16px;border-top:2px dashed '+COLORS.red+'"></span> Meta Acumulada (dias úteis)</div>'+
      '<div style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:3px;background:'+cor+';display:inline-block;border-radius:2px"></span> Real Acumulado</div>'+
      (hojeLineHtml ? '<div style="display:flex;align-items:center;gap:6px"><span style="width:16px;border-top:2px dashed '+COLORS.brand+'"></span> Hoje</div>' : '')+
    '</div>'+
  '</div>';
}

/* ============================== RECADOS ==============================
   Avisos escritos por um administrador e dirigidos a colaboradores específicos
   (ou a todos). Ao abrir o sistema, os recados ainda não lidos aparecem em um
   pop-up para o colaborador dar como lido. A confirmação fica registrada com
   data e hora, e o admin acompanha quem já leu na tela "Gerenciar Recados". */
function recadoDestinatarioTodos(r){ return !r.destinatarios || r.destinatarios.length===0; }
function recadoEhPara(r, email){
  if(!r || r.ativo===false) return false;
  const e = (email||"").trim().toLowerCase();
  if(!e) return false;
  if(recadoDestinatarioTodos(r)) return true;
  return (r.destinatarios||[]).map(x=>String(x).toLowerCase()).indexOf(e)!==-1;
}
function recadoLidoPor(r, email){
  const e = (email||"").trim().toLowerCase();
  return !!(r && r.leituras && r.leituras[e]);
}
function recadosDoUsuario(email){
  return (STATE.recados||[])
    .filter(r=>recadoEhPara(r, email))
    .sort((a,b)=> String(b.criadoEm||"").localeCompare(String(a.criadoEm||"")));
}
function recadosNaoLidos(email){
  return recadosDoUsuario(email).filter(r=>!recadoLidoPor(r, email));
}
/* Escrita segura: relê os recados do banco antes de gravar, para não sobrescrever
   uma confirmação de leitura feita por outro usuário entre a carga e o salvamento. */
async function salvarRecados(mutador){
  const atuais = await configGet("recados");
  const lista = Array.isArray(atuais) ? atuais : [];
  const nova = mutador(lista);
  const ok = await configSet("recados", nova);
  if(!ok) return false;
  STATE.recados = nova;
  return true;
}
async function marcarRecadoLido(id){
  const email = (STATE.currentUserEmail||"").trim().toLowerCase();
  if(!email) return;
  const ok = await salvarRecados(function(lista){
    return lista.map(function(r){
      if(r.id!==id) return r;
      const leituras = Object.assign({}, r.leituras||{});
      if(!leituras[email]) leituras[email] = new Date().toISOString();
      return Object.assign({}, r, {leituras: leituras});
    });
  });
  if(!ok) return;
  renderSidebar();
  const restantes = recadosNaoLidos(email);
  if(restantes.length>0) mostrarPopupRecados();
  else { closeModal(); renderScreen(); showToast("success","Recado confirmado como lido."); }
}
async function marcarTodosRecadosLidos(){
  const email = (STATE.currentUserEmail||"").trim().toLowerCase();
  if(!email) return;
  const ids = recadosNaoLidos(email).map(r=>r.id);
  if(ids.length===0) return;
  const ok = await salvarRecados(function(lista){
    return lista.map(function(r){
      if(ids.indexOf(r.id)===-1) return r;
      const leituras = Object.assign({}, r.leituras||{});
      if(!leituras[email]) leituras[email] = new Date().toISOString();
      return Object.assign({}, r, {leituras: leituras});
    });
  });
  if(!ok) return;
  closeModal();
  renderSidebar();
  renderScreen();
  showToast("success", ids.length+" recado(s) confirmado(s) como lido(s).");
}
function fmtDataHora(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "—";
  return fmtDateBR(toISO(d))+" às "+pad2(d.getHours())+":"+pad2(d.getMinutes());
}
function recadoCardHtml(r, opts){
  opts = opts || {};
  const email = (STATE.currentUserEmail||"").trim().toLowerCase();
  const lido = recadoLidoPor(r, email);
  const cor = lido ? COLORS.textMuted : COLORS.brand;
  return '<div style="border:1px solid '+(lido?"var(--steel-border)":cor+"66")+';background:'+(lido?"transparent":cor+"0D")+';border-radius:8px;padding:14px;margin-bottom:10px">'+
    '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">'+
      '<div style="font-size:14px;font-weight:700">'+escapeHtml(r.titulo||"Recado")+'</div>'+
      (lido
        ? '<span style="font-size:10px;font-weight:700;color:'+COLORS.green+';white-space:nowrap">LIDO EM '+escapeHtml(fmtDataHora(r.leituras[email]))+'</span>'
        : '<span style="font-size:10px;font-weight:700;color:'+cor+';border:1px solid '+cor+'66;border-radius:10px;padding:2px 8px;white-space:nowrap">NÃO LIDO</span>')+
    '</div>'+
    '<div style="font-size:11px;color:'+COLORS.textMuted+';margin-top:3px">De '+escapeHtml(r.autor||"—")+' · '+escapeHtml(fmtDataHora(r.criadoEm))+'</div>'+
    '<div style="font-size:13px;line-height:1.6;margin-top:10px;white-space:pre-wrap">'+escapeHtml(r.mensagem||"")+'</div>'+

async function salvarRecado(editId){
  const titulo = (document.getElementById("recado-titulo").value||"").trim();
  const mensagem = (document.getElementById("recado-mensagem").value||"").trim();
  if(!titulo || !mensagem){ showToast("error","Preencha título e mensagem."); return; }
  const todos = document.getElementById("recado-todos").checked;
  const destinatarios = todos ? [] : Array.from(document.querySelectorAll(".recado-dest")).filter(c=>c.checked).map(c=>c.value);
  if(!todos && destinatarios.length===0){ showToast("error","Escolha ao menos um destinatário, ou marque Todos."); return; }
  const autor = STATE.currentUserEmail || "administração";
  const ok = await salvarRecados(function(lista){
    if(editId){
      /* Editar mantém as leituras já registradas: quem leu não é obrigado a reler
         uma correção de digitação. Para exigir nova leitura, crie outro recado. */
      return lista.map(r=> r.id===editId ? Object.assign({}, r, {titulo, mensagem, destinatarios}) : r);
    }
    return [{id:"rec_"+Date.now()+"_"+Math.random().toString(36).slice(2,7), titulo, mensagem,
             destinatarios, autor, criadoEm:new Date().toISOString(), ativo:true, leituras:{}}].concat(lista);
  });
  if(!ok) return;
  closeModal();
  renderSidebar();
  renderScreen();
  showToast("success", editId ? "Recado atualizado." : "Recado publicado.");
}

/* ============================== PERMISSÕES DE USUÁRIO ==============================
   Os usuários são criados diretamente no Supabase Auth (fora deste app). Aqui apenas
   controlamos, por e-mail, quais telas cada um pode acessar. Um usuário sem cadastro
   nesta lista mantém acesso total (comportamento atual), evitando bloquear alguém por
   esquecimento. Marcar "Administrador" dá acesso total, incluindo esta própria tela.

   SUPERADMINISTRADOR: os e-mails abaixo têm acesso total garantido pelo próprio código,
   independente do que estiver salvo em app_config. Isso é uma trava de segurança para
   nunca ficar todo mundo travado para fora do sistema por engano (ex.: alguém remove o
   próprio admin, ou zera a lista de telas por acidente). Não depende de configuração —
   mesmo que a tabela de permissões seja apagada ou corrompida, este e-mail continua com
   acesso total ao logar. */
const SUPER_ADMIN_EMAILS = ["elevecap2025@gmail.com"];
function isSuperAdminEmail(email){
  return SUPER_ADMIN_EMAILS.indexOf((email||"").trim().toLowerCase())!==-1;
}
/* Telas que o admin pode ligar/desligar por usuário. O grupo "Geral" entra aqui para
   que o Dashboard seja configurável. Ficam de fora apenas as telas que se autogovernam:
   "Permissões de Usuário" e "Gerenciar Recados" são sempre restritas a administradores,
   e "Recados" é sempre livre — é onde o colaborador lê os avisos dirigidos a ele, então
   bloqueá-la anularia o propósito do recado. */
const TELAS_SEMPRE_ADMIN = ["permissoesUsuarios", "gerenciarRecados"];
const TELAS_SEMPRE_LIVRES = ["recados"];
function permTelasConfiguraveis(){
  const fixas = TELAS_SEMPRE_ADMIN.concat(TELAS_SEMPRE_LIVRES);
  return NAV_GROUPS
    .map(function(g){ return Object.assign({}, g, { items: g.items.filter(function(it){ return fixas.indexOf(it.id)===-1; }) }); })
    .filter(function(g){ return g.items.length>0; });
}
function permsForCurrentUser(){
  const email = (STATE.currentUserEmail||"").trim().toLowerCase();
  if(!email) return null;
  return (STATE.permissoesUsuarios||{})[email] || null;
}
function isCurrentUserAdmin(){
  if(isSuperAdminEmail(STATE.currentUserEmail)) return true;
  const cfg = permsForCurrentUser();
  if(cfg) return !!cfg.admin;
  const todas = STATE.permissoesUsuarios||{};
  const existeAdmin = Object.keys(todas).some(function(e){ return todas[e] && todas[e].admin; });
  return !existeAdmin; // bootstrap: sem nenhum admin configurado, qualquer usuário logado pode configurar
}
function telaPermitida(screenId){
  if(TELAS_SEMPRE_LIVRES.indexOf(screenId)!==-1) return true;
  if(isSuperAdminEmail(STATE.currentUserEmail)) return true;
  if(TELAS_SEMPRE_ADMIN.indexOf(screenId)!==-1) return isCurrentUserAdmin();
  const cfg = permsForCurrentUser();
  if(!cfg) return true;
  if(cfg.admin) return true;
  return (cfg.screens||[]).indexOf(screenId)!==-1;
}
function primeiraTelaPermitida(){
  for(const it of NAV_ITEMS){ if(telaPermitida(it.id)) return it.id; }
  return "recados";   // sempre liberada, então nunca sobra usuário sem destino
}

async function confirmAddUsuarioPermissao(){
  const input = document.getElementById("perm-usuario-email");
  const email = (input ? input.value : "").trim().toLowerCase();
  if(!email || email.indexOf("@")===-1){ showToast("error","Informe um e-mail válido."); return; }

  const atual = Object.assign({}, STATE.permissoesUsuarios);
  if(atual[email]){ showToast("error","Este usuário já está na lista."); return; }
  atual[email] = { admin:false, screens:[] };
  STATE.permissoesUsuarios = atual;

  showToast("success","Usuário adicionado. Selecione as telas permitidas.");

async function removeUsuarioPermissao(email){
  if(isSuperAdminEmail(email)){ showToast("error","Este e-mail tem acesso garantido pelo sistema e não pode ser removido."); return; }
  if(!confirm("Remover as permissões de "+email+"? O usuário volta a ter acesso total até ser adicionado novamente.")) return;
  const atual = Object.assign({}, STATE.permissoesUsuarios);

  await savePermissoesUsuarios();
  showToast("success","Usuário removido da lista de permissões.");

async function toggleUsuarioAdmin(email){
  if(isSuperAdminEmail(email)) return;
  const atual = Object.assign({}, STATE.permissoesUsuarios);
  const cfg = Object.assign({admin:false, screens:[]}, atual[email]);
  cfg.admin = !cfg.admin;
  atual[email] = cfg;
  STATE.permissoesUsuarios = atual;
  await savePermissoesUsuarios();
}
async function toggleUsuarioTela(email, screenId){
  if(isSuperAdminEmail(email)) return;
  const atual = Object.assign({}, STATE.permissoesUsuarios);
  const cfg = Object.assign({admin:false, screens:[]}, atual[email]);
  const screens = (cfg.screens||[]).slice();
  const idx = screens.indexOf(screenId);
  if(idx===-1) screens.push(screenId); else screens.splice(idx,1);
  cfg.screens = screens;
  atual[email] = cfg;
  STATE.permissoesUsuarios = atual;
  await savePermissoesUsuarios();
}

  await savePermissoesUsuarios();
}
