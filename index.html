/* ============================== BACKUP AUTOMÁTICO (LOCAL) ==============================
   Uma vez por dia (por máquina/navegador, controlado via localStorage), ao entrar no
   sistema é gerado e baixado automaticamente um arquivo .json com uma cópia de todos os
   dados (pedidos, cadastros e configurações). Não depende de nenhum serviço externo — é
   só um download local, então quem quiser manter um histórico precisa guardar os arquivos
   baixados (ex.: numa pasta do Google Drive sincronizada). Também dá pra baixar na hora,
   a qualquer momento, pela tela "Backup dos Dados". */
const BACKUP_LOCALSTORAGE_KEY = "eleve_backup_ultima_data";
function coletarDadosBackup(){
  return {
    sistema: "ELEVE — Painel de Produção",
    geradoEm: new Date().toISOString(),
    dados: {
      cidades: STATE.cidades,
      equipamentos: STATE.equipamentos,
      motoristas: STATE.motoristas,
      statusOptions: STATE.statusOptions,
      materiais: STATE.materiais,
      pedidos: STATE.pedidos,
      notas: STATE.notas,
      baixasManual: STATE.baixasManual,
      transferencias: STATE.transferencias,
      fatorConversaoHistorico: STATE.fatorConversaoHistorico,
      materiaisAvulsos: STATE.materiaisAvulsos,
    },
    configuracoes: {
      materialTipos: STATE.materialTipos,
      motivosPerda: STATE.motivosPerda,
      tipoOptions: STATE.tipoOptions,
      cumeeiraOptions: STATE.cumeeiraOptions,
      metasPerfilar: (STATE.stageState.perfilar||{}).metas||[],
      metasPintura: (STATE.stageState.pintura||{}).metas||[],
      metasColagem: (STATE.stageState.colagem||{}).metas||[],
      metasEntrega: (STATE.stageState.entrega||{}).metas||[],
      fatoresProducaoPerfilar: STATE.fatoresProducaoPerfilar,
      metasDiaOverride: STATE.metasDiaOverride,
      feriadosCustom: STATE.feriadosCustom,
      feriadosRemovidos: STATE.feriadosRemovidos,
      permissoesUsuarios: STATE.permissoesUsuarios,
      recados: STATE.recados,
    },
  };
}
function baixarArquivoJSON(dados, nomeArquivo){
  try{
    const blob = new Blob([JSON.stringify(dados, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nomeArquivo;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    return true;
  } catch(err){
    console.error("Erro ao gerar backup", err);
    return false;
  }
}
function getUltimoBackupData(){
  try{ return window.localStorage.getItem(BACKUP_LOCALSTORAGE_KEY) || ""; } catch(err){ return ""; }
}
function setUltimoBackupData(dataStr){
  try{ window.localStorage.setItem(BACKUP_LOCALSTORAGE_KEY, dataStr); } catch(err){}
}
function executarBackup(manual){
  const dados = coletarDadosBackup();
  const nomeArquivo = "backup-eleve-"+todayStr()+".json";
  const ok = baixarArquivoJSON(dados, nomeArquivo);
  if(ok){
    setUltimoBackupData(todayStr());
    if(manual) showToast("success","Backup baixado: "+nomeArquivo);
  } else if(manual){
    showToast("error","Não foi possível gerar o backup neste navegador.");
  }
  return ok;
}
/* Chamado uma vez, logo após o login, sempre que a data do último backup salva neste
   navegador não for hoje. Silencioso (sem toast) pra não incomodar no dia a dia — só
   baixa o arquivo direto na pasta de downloads padrão do navegador. */
function executarBackupAutomaticoSeNecessario(){
  try{
    if(getUltimoBackupData()===todayStr()) return;
    executarBackup(false);
  } catch(err){
    console.error("Backup automático falhou", err);
  }
}

  const acoes = '<div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap">'+
    '<button class="btn btn-primary" onclick="executarBackup(true)">'+icon("arrowDownCircle",14)+' Baixar backup agora</button>'+
  '</div>';
  document.getElementById("content").innerHTML =
    screenHeaderHtml("arrowDownCircle","Backup dos Dados","Uma cópia local (.json) de todos os pedidos, cadastros e configurações do sistema.", acoes)+
    '<div class="pcp-card" style="margin-bottom:16px">'+
      '<div class="chart-stats-row" style="display:flex;gap:22px;flex-wrap:wrap">'+statusHtml+'</div>'+
    '</div>'+
    '<div class="pcp-card">'+
      '<div style="font-size:13px;font-weight:700;margin-bottom:8px">Como funciona</div>'+
      '<ul style="font-size:12.5px;color:'+COLORS.textMuted+';line-height:1.8;margin:0;padding-left:18px">'+
        '<li>Assim que alguém faz login no sistema <strong style="color:'+COLORS.text+'">neste navegador</strong>, o app confere se já baixou um backup hoje. Se ainda não baixou, gera e baixa automaticamente — sem precisar clicar em nada.</li>'+
        '<li>O backup é baixado <strong style="color:'+COLORS.text+'">no máximo uma vez por dia</strong>, mesmo que várias pessoas façam login no mesmo dia neste computador.</li>'+
        '<li>O arquivo (<code>backup-eleve-AAAA-MM-DD.json</code>) inclui pedidos, matéria-prima, cidades, equipamentos, motoristas, notas, baixas de estoque, transferências, metas por dia e permissões de usuário.</li>'+
        '<li>É um download local — o app não guarda histórico de backups antigos. Para manter um histórico seguro, mova os arquivos baixados pra uma pasta sincronizada (Google Drive, OneDrive etc.) de tempos em tempos.</li>'+
        '<li>O controle de "já baixei hoje" fica salvo neste navegador/computador — em outro computador, o primeiro login do dia também vai gerar um backup.</li>'+
      '</ul>'+
    '</div>';
}
function loadSidebarCollapsedGroups(){
  try{
    const raw = window.localStorage.getItem("eleve_sidebar_collapsed");
    return raw ? JSON.parse(raw) : {};
  } catch(err){ return {}; }
}
function saveSidebarCollapsedGroups(){
  try{ window.localStorage.setItem("eleve_sidebar_collapsed", JSON.stringify(STATE.sidebarCollapsedGroups)); } catch(err){}
}
function applySidebarHidden(){
  const shell = document.getElementById("app-shell");
  const btn = document.getElementById("sidebar-float-btn");
  if(shell) shell.classList.toggle("sidebar-hidden", !!STATE.sidebarHidden);
  if(btn){
    btn.style.display = STATE.sidebarHidden ? "inline-flex" : "none";
    btn.innerHTML = icon("menu",16)+' Menu';
  }
}
function toggleSidebarHidden(){
  STATE.sidebarHidden = !STATE.sidebarHidden;
  try{ window.localStorage.setItem("eleve_sidebar_hidden", STATE.sidebarHidden ? "1" : "0"); } catch(err){}
  applySidebarHidden();
}
document.addEventListener("keydown", function(e){
  if((e.ctrlKey||e.metaKey) && (e.key==="b"||e.key==="B")){
    if(!STATE.loggedIn) return;
    e.preventDefault();
    toggleSidebarHidden();
  }
});
function toggleSidebarGroup(groupId){
  STATE.sidebarCollapsedGroups[groupId] = !STATE.sidebarCollapsedGroups[groupId];
  saveSidebarCollapsedGroups();
  renderSidebar();
}
function setScreen(id){
  if(!telaPermitida(id)){
    showToast("error","Você não tem permissão para acessar esta tela.");
    return;
  }
  if(STATE.screen!==id) STATE.screenAnterior = STATE.screen;
  STATE.screen=id;
  const groupId = findNavGroupFor(id);
  if(groupId && STATE.sidebarCollapsedGroups[groupId]){
    STATE.sidebarCollapsedGroups[groupId] = false;
    saveSidebarCollapsedGroups();
  }
  renderSidebar();
  renderScreen();
}
function renderSidebar(){
  const groupsHtml = NAV_GROUPS.map(g=>{
    const itemsPermitidos = g.items.filter(it=>telaPermitida(it.id));
    if(itemsPermitidos.length===0) return "";
    const itemsHtml = itemsPermitidos.map(function(it){
      /* Contador de recados não lidos ao lado do item "Recados". */
      let badge = "";
      if(it.id==="recados"){
        const n = recadosNaoLidos(STATE.currentUserEmail).length;
        if(n>0) badge = '<span style="margin-left:auto;font-size:10px;font-weight:700;color:#fff;background:'+COLORS.red+';border-radius:9px;padding:1px 6px;min-width:17px;text-align:center">'+n+'</span>';
      }
      return '<button class="pcp-sidebar-btn '+(STATE.screen===it.id?"active":"")+'" onclick="setScreen(\''+it.id+'\')">'+icon(it.icon,16)+' '+it.label+badge+'</button>';
    }).join("");
    if(g.id==="_top") return itemsHtml;
    const collapsed = !!STATE.sidebarCollapsedGroups[g.id];
    return '<button class="pcp-sidebar-group-header" onclick="toggleSidebarGroup(\''+g.id+'\')">'+
        '<span>'+g.title+'</span>'+
        '<span class="pcp-sidebar-group-chevron" style="'+(collapsed?"transform:rotate(-90deg)":"")+'">'+icon("chevronDown",13)+'</span>'+
      '</button>'+
      '<div class="pcp-sidebar-group-items" style="'+(collapsed?"display:none":"")+'">'+itemsHtml+'</div>';
  }).join("");
  const themeBtnIcon = STATE.theme==="dark" ? "sun" : "moon";
  const themeBtnLabel = STATE.theme==="dark" ? "Modo Claro" : "Modo Escuro";
  document.getElementById("sidebar").innerHTML =
    '<div style="display:flex;align-items:center;gap:9px;padding:4px 8px 18px">'+
      '<div style="width:32px;height:32px;border-radius:8px;background:var(--panel-alt);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:5px">'+
        '<img src="'+markDataUri()+'" alt="ELEVE" style="width:100%;height:100%;object-fit:contain"/></div>'+
      '<div style="flex:1;min-width:0"><div style="font-family:\'Space Grotesk\',sans-serif;font-weight:700;font-size:14.5px;letter-spacing:.02em">ELEVE</div>'+
      '<div style="font-size:10px;color:'+COLORS.textMuted+'">Painel de Produção</div></div>'+
      '<button class="icon-btn" title="Ocultar menu (Ctrl+B)" onclick="toggleSidebarHidden()">'+icon("panelLeft",14)+'</button>'+
    '</div>'+groupsHtml+
    '<div style="flex:1"></div>'+
    '<button class="pcp-sidebar-btn" onclick="toggleTheme()">'+icon(themeBtnIcon,16)+' '+themeBtnLabel+'</button>'+
    '<div style="padding:10px 12px;font-size:11.5px;color:'+COLORS.textMuted+'">'+escapeHtml(STATE.userName)+'</div>'+
    '<button class="pcp-sidebar-btn" onclick="handleLogout()">'+icon("logout",16)+' Sair</button>';
}
function renderScreen(){
  invalidateMovTotais();
  if(STATE.screen==="dashboard") renderDashboardScreen();
  else if(STATE.screen==="pedidos") renderPedidosScreen();
  else if(STATE.screen==="prog-perfilar") renderStageScreen("perfilar");
  else if(STATE.screen==="prog-pintura") renderStageScreen("pintura");
  else if(STATE.screen==="prog-colagem") renderStageScreen("colagem");
  else if(STATE.screen==="prog-entrega") renderStageScreen("entrega");
  else if(STATE.screen==="entregues") renderEntreguesScreen();
  else if(STATE.screen==="calendario") renderCalendarioScreen();
  else if(STATE.screen==="acompanhamento") renderAcompanhamentoScreen();
  else if(STATE.screen==="metasCalendario") renderMetasCalendarioScreen();
  else if(STATE.screen==="baixas") renderBaixasScreen();
  else if(STATE.screen==="baixaEstoque") renderBaixaEstoqueScreen();
  else if(STATE.screen==="avulsoLancamento") renderAvulsoLancamentoScreen();
  else if(STATE.screen==="avulsoSeparacao") renderAvulsoSeparacaoScreen();
  else if(STATE.screen==="avulsoConcluidos") renderAvulsoConcluidosScreen();
  else if(STATE.screen==="transferencia") renderTransferenciaScreen();
  else if(STATE.screen==="movimentacao") renderMovimentacaoScreen();
  else if(STATE.screen==="notas") renderNotasScreen();
  else if(STATE.screen==="precoProduto") renderPrecoProdutoScreen();
  else if(STATE.screen==="materiais") renderGenericScreen("material");
  else if(STATE.screen==="fatorConversao") renderFatorConversaoScreen();
  else if(STATE.screen==="fatorProducaoPerfilar") renderFatorProducaoPerfilarScreen();
  else if(STATE.screen==="motoristas") renderGenericScreen("motorista");
  else if(STATE.screen==="cidades") renderGenericScreen("cidade");
  else if(STATE.screen==="equipamentos") renderGenericScreen("equipamento");
  else if(STATE.screen==="permissoesUsuarios") renderPermissoesUsuariosScreen();
  else if(STATE.screen==="recados") renderRecadosScreen();
  else if(STATE.screen==="gerenciarRecados") renderGerenciarRecadosScreen();
  else if(STATE.screen==="backup") renderBackupScreen();
}
function showLoginError(msg){
  const el = document.getElementById("login-error");
  el.textContent = msg;
  el.style.display = "block";
}
function clearLoginError(){
  const el = document.getElementById("login-error");
  el.style.display = "none";
  el.textContent = "";
}
async function enterApp(userName){
  STATE.userName = userName || "operador";
  STATE.currentUserEmail = (userName||"").trim().toLowerCase();
  STATE.loggedIn = true;
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-shell").style.display = "flex";
  applySidebarHidden();
  renderSidebar();
  await loadAllData();
  if(!telaPermitida(STATE.screen)) STATE.screen = primeiraTelaPermitida();
  renderSidebar();
  renderScreen();
  /* Recados pendentes aparecem assim que o sistema abre, uma vez por sessão. */
  if(!STATE.recadosPopupMostrado){
    STATE.recadosPopupMostrado = true;
    mostrarPopupRecados();
  }
  executarBackupAutomaticoSeNecessario();
}
async function handleLogin(event){
  event.preventDefault();
  clearLoginError();
  const email = document.getElementById("login-user").value.trim();
  const senha = document.getElementById("login-pass").value;
  const btn = document.getElementById("login-submit-btn");
  btn.disabled = true;
  btn.textContent = "Entrando…";
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
    if(error){
      showLoginError(error.message==="Invalid login credentials" ? "E-mail ou senha inválidos." : error.message);
      return false;
    }
    await enterApp(data.user && data.user.email ? data.user.email : email);
  } catch(err){
    showLoginError("Não foi possível conectar ao servidor de autenticação. Verifique sua conexão.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Entrar";
  }
  return false;
}
async function handleLogout(){
  await sb.auth.signOut();
  STATE.loggedIn = false;
  const fb = document.getElementById("sidebar-float-btn"); if(fb) fb.style.display = "none";
  STATE.dataLoaded = false;
  document.getElementById("app-shell").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
  clearLoginError();
  const passInput = document.getElementById("login-pass");
  if(passInput) passInput.value = "";
}
sb.auth.onAuthStateChange((event, session)=>{
  if(event==="SIGNED_OUT" && STATE.loggedIn){
    STATE.loggedIn = false;
    const fb = document.getElementById("sidebar-float-btn"); if(fb) fb.style.display = "none";
    STATE.dataLoaded = false;
    document.getElementById("app-shell").style.display = "none";
    document.getElementById("login-screen").style.display = "flex";
  }
});
async function restoreSession(){
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session && data.session.user){
      await enterApp(data.session.user.email);
    }
  } catch(err){
    // Sem sessão ativa — permanece na tela de login.
  }
}

/* ============================== INIT ============================== */
initLocalDefaults();
document.documentElement.setAttribute("data-theme", STATE.theme);
Object.assign(COLORS, THEMES[STATE.theme]);
document.getElementById("login-logo-img").src = logoDataUri();
restoreSession();
</script>
</body>
