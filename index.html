<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#12161C; --panel:#1B212B; --panel-alt:#151B23; --steel:#3E4C5E; --steel-border:#232B36;
  --text:#E7EBEF; --text-muted:#8C97A6; --row-hover:#1A2029;
  --brand:#0080C6; --brand-dim:#005788; --green:#4CAF6D; --red:#E2574C;
}
html[data-theme="light"]{
  --bg:#F3F5F7; --panel:#FFFFFF; --panel-alt:#EAEFF3; --steel:#D7DEE5; --steel-border:#E3E8ED;
  --text:#20262E; --text-muted:#66707C; --row-hover:#F1F4F7;
  --brand:#0080C6; --brand-dim:#005788; --green:#2F9E5B; --red:#D1493E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{font-family:'Inter',sans-serif;color:var(--text);transition:background .2s,color .2s;}
button,input,select{font-family:'Inter',sans-serif;}

.pcp-shell{display:flex;min-height:100vh;}
@media (min-width:861px){.pcp-sidebar{height:100vh;position:sticky;top:0;overflow-y:auto;}}
.pcp-sidebar{width:236px;flex-shrink:0;background:var(--panel-alt);border-right:1px solid var(--steel-border);padding:20px 12px;display:flex;flex-direction:column;gap:3px;transition:background .2s,border-color .2s;}
.pcp-sidebar-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;border:none;background:transparent;color:var(--text-muted);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;position:relative;transition:background .15s,color .15s;width:100%;}
.pcp-sidebar-btn:hover{background:var(--row-hover);color:var(--text);}
.pcp-sidebar-btn.active{background:var(--row-hover);color:var(--brand);}
.pcp-sidebar-btn.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--brand);border-radius:0 3px 3px 0;}
.pcp-sidebar-group-header{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:14px 12px 6px;border:none;background:transparent;color:var(--text-muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;cursor:pointer;width:100%;text-align:left;}
.pcp-sidebar-group-header:hover{color:var(--text);}
.pcp-sidebar-group-chevron{display:inline-flex;transition:transform .15s;flex-shrink:0;}
.pcp-sidebar-group-items{display:flex;flex-direction:column;gap:3px;}
.pcp-content{flex:1;min-width:0;padding:30px 34px;overflow-x:auto;}

/* ---- Menu recolhível (item 1) ---- */
.pcp-shell.sidebar-hidden .pcp-sidebar{display:none;}
.pcp-shell.sidebar-hidden .pcp-content{padding-top:58px;--pad-v:88px;}
#sidebar-float-btn{display:none;position:fixed;top:12px;left:12px;z-index:55;align-items:center;gap:7px;

.btn{font-size:13px;font-weight:600;padding:9px 16px;border-radius:7px;border:1px solid var(--steel);background:var(--panel);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap;}

.field-input,.field-select{width:100%;background:var(--bg);border:1px solid var(--steel);color:var(--text);border-radius:6px;padding:9px 10px;font-size:13.5px;}

/* ---- Campo de meta do dia (calendário Metas por Dia): sem as setinhas do number, que

.screen-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:12px;}

  .coil-swatch-label{font-size:7.5px !important;}
  .coil-swatch-wrap{gap:3px !important;}
  .status-pill{padding:1px 5px !important;font-size:7px !important;}
  .status-pill-dot{width:4px !important;height:4px !important;}
  .screen-fixed{display:block !important;height:auto !important;}
  .screen-fixed-body{overflow:visible !important;}
  .screen-fixed-body .pcp-table thead th{position:static !important;}
  #sidebar-float-btn{display:none !important;}

  /* Acompanhamento da Produção — compactado para caber em 1 folha A4 */
  .acomp-print-page{display:block;}
  .acomp-print-page .chart-card{margin-bottom:6px !important;page-break-inside:avoid;break-inside:avoid;}
  .acomp-print-page .chart-card-header{margin-bottom:4px !important;}

  .acomp-print-page .chart-stat .stat-label{font-size:7px !important;}
  .acomp-print-page .chart-stat-value{font-size:12px !important;}
  .acomp-print-page .chart-wrap{height:130px !important;}
  .acomp-print-page .chart-days{margin-top:3px !important;}
  .acomp-print-page .chart-day{font-size:6.5px !important;}
  .acomp-print-page .chart-meta-tag{font-size:7.5px !important;}
  .acomp-print-page .print-only{margin-bottom:6px !important;}
  .acomp-print-page .chart-obs-section{margin-top:6px !important;}
  .acomp-print-page .chart-obs-item{padding:3px 0 !important;gap:5px !important;}
  .acomp-print-page .chart-obs-text{font-size:8.5px !important;line-height:1.3 !important;}
  .acomp-print-page .chart-obs-empty{font-size:8px !important;margin:4px 0 0 !important;}
}

@media (max-width:860px){
  .pcp-shell{flex-direction:column;}
  .pcp-sidebar{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--steel-border);padding:10px;gap:4px;}

  .pcp-content{padding:18px;}
  .screen-fixed{display:block;height:auto;}

}

function sbErrorToast(action, error){

const DEFAULT_CONFIG_VALUES = {
  material_tipos: ["Bobina","EPS","Outro"],
  motivos_perda: ["Quebra/Avaria","Erro de Corte","Desperdício de Produção","Vencimento/Validade","Outro"],
  tipo_options: ["Simples","Colonial","Colonial Simples","Sanduíche","Semi-Sanduíche","Bandeja"],

};
async function configGet(key){
  const { data, error } = await sb.from("app_config").select("value").eq("key", key).maybeSingle();
  if(error){ sbErrorToast("carregar configuração", error); return DEFAULT_CONFIG_VALUES[key] || null; }
  return data ? data.value : (DEFAULT_CONFIG_VALUES[key] || null);
}
async function configSet(key, value){
  const { error } = await sb.from("app_config").upsert({key, value, updated_at:new Date().toISOString()}, {onConflict:"key"});
  if(error){ sbErrorToast("salvar configuração", error); return false; }
  return true;
}

/* ---- registro de movimentações de estoque (auditoria: Saldo Inicial + Entradas − Saídas = Saldo Atual) ----
   Chamado em TODO ponto que altera materiais.estoque (nota de entrada, baixa manual, avulso, transferência,
   consumo de produção via pedido, acerto). Best-effort: se falhar, avisa mas não desfaz a operação principal,
   que já foi concluída com sucesso no banco. */
async function logMovimento(materialId, tipo, quantidade, origem, referencia){
  if(!materialId) return;
  const qtd = Math.round(Math.abs(Number(quantidade||0))*100)/100;
  if(!(qtd>0)) return;
  const row = {material_id:materialId, tipo:tipo, origem:origem, quantidade:qtd, referencia:referencia||"", data:todayStr()};
  const { data:inserted, error } = await sb.from("movimentacoes_estoque").insert(row).select().single();
  if(error){ sbErrorToast("registrar movimentação de estoque ("+origem+")", error); return; }
  STATE.movimentacoes.push(mapMovimentoFromRow(inserted));
}
/* ---- Entradas / Saídas reais, calculadas AO VIVO das fontes que já existem ----
   Entradas: Notas de Entrada (compra), transferências recebidas e devoluções
             (baixas lançadas com quantidade negativa).
   Saídas:   consumo de Produção (pedidos fora de Pré-produção), baixas manuais,
             separações avulsas e transferências enviadas.
   Não depende de backfill nem de tabela populada — é sempre retroativo e reflete
   qualquer edição feita nas telas de origem. O único movimento que não aparece
   aqui é o Acerto de Estoque, que por natureza é uma correção do próprio saldo. */
let _movTotaisCache = null;
function invalidateMovTotais(){ _movTotaisCache = null; }
function movTotaisMap(){
  if(_movTotaisCache) return _movTotaisCache;
  const map = {};
  function bump(id, campo, qtd){
    if(!id) return;
    const q = Number(qtd||0);
    if(!(q>0)) return;
    if(!map[id]) map[id] = {entradas:0, saidas:0};
    map[id][campo] += q;
  }
  // 1) Notas de Entrada → entrada
  STATE.notas.forEach(function(n){
    (n.itens||[]).forEach(function(it){ bump(it.materialId, "entradas", it.quantidade); });
  });
  // 2) Baixas manuais e avulsos → saída (negativas são devoluções → entrada)
  STATE.baixasManual.forEach(function(b){
    const q = Number(b.quantidade||0);
    if(q>0) bump(b.materialId, "saidas", q); else if(q<0) bump(b.materialId, "entradas", -q);
  });
  // 3) Transferências → saída na origem, entrada no destino
  STATE.transferencias.forEach(function(t){
    bump(t.materialOrigemId, "saidas", t.quantidade);
    bump(t.materialDestinoId, "entradas", t.quantidade);
  });
  // 4) Consumo de Produção (mesma regra da tela "Baixa de Materiais")
  getEfetivaBaixaRows().forEach(function(r){ bump(r.materialId, "saidas", r.quantidade); });
  Object.keys(map).forEach(function(id){
    map[id].entradas = Math.round(map[id].entradas*100)/100;
    map[id].saidas   = Math.round(map[id].saidas*100)/100;
  });
  _movTotaisCache = map;
  return map;
}
function movTotaisDoMaterial(materialId){
  const t = movTotaisMap()[materialId];
  return t ? {entradas:t.entradas, saidas:t.saidas} : {entradas:0, saidas:0};
}
/* Saldo inicial que FARIA a conta fechar, dado o saldo atual e os movimentos reais. */
function saldoInicialSugerido(m){
  const t = movTotaisDoMaterial(m.id);
  return Math.round((Number(m.estoque||0) - t.entradas + t.saidas)*100)/100;
}
/* Divergência entre o que o saldo inicial cadastrado projeta e o saldo atual real. */
function divergenciaDoMaterial(m){
  const t = movTotaisDoMaterial(m.id);
  const projetado = Number(m.estoqueInicial||0) + t.entradas - t.saidas;
  return Math.round((projetado - Number(m.estoque||0))*100)/100;
}
/* ---- Lançamentos individuais de Entrada/Saída de um material ----
   Monta, a partir das mesmas fontes usadas em movTotaisMap() (Notas de Entrada,
   Baixas Manuais/devoluções, Transferências e Consumo de Produção), a lista
   detalhada de lançamentos que compõem o total de Entradas ou Saídas exibido
   na tela de Matéria-Prima — para exibir em modal e permitir impressão (PDF). */
function materialLancamentosRows(materialId, tipo){
  const rows = [];
  const mat = STATE.materiais.find(x=>x.id===materialId);
  const unidade = mat ? mat.unidade : "";
  // 1) Notas de Entrada (compra) → só entradas
  if(tipo==="entradas"){
    STATE.notas.forEach(function(n){
      (n.itens||[]).forEach(function(it){
        if(it.materialId!==materialId) return;
        const q = Number(it.quantidade||0);
        if(!(q>0)) return;
        rows.push({data:n.data, origem:"Compra (Nota de Entrada)",
          detalhe:"Fornecedor: "+(n.fornecedor||"—")+(n.numeroNota?" · Nota "+n.numeroNota:""),
          quantidade:q});
      });
    });
  }
  // 2) Baixas manuais → saída (perda); quantidade negativa = devolução → entrada
  STATE.baixasManual.forEach(function(b){
    if(b.materialId!==materialId) return;
    const q = Number(b.quantidade||0);
    if(tipo==="saidas" && q>0){
      rows.push({data:b.data, origem:"Baixa Manual ("+(b.motivo||"Perda")+")", detalhe:b.observacao||"—", quantidade:q});
    } else if(tipo==="entradas" && q<0){
      rows.push({data:b.data, origem:"Devolução ao Estoque", detalhe:b.observacao||"—", quantidade:-q});
    }
  });
  // 3) Transferências → saída na origem, entrada no destino
  STATE.transferencias.forEach(function(t){
    const q = Number(t.quantidade||0);
    if(!(q>0)) return;
    if(tipo==="saidas" && t.materialOrigemId===materialId){
      const destino = STATE.materiais.find(x=>x.id===t.materialDestinoId);
      rows.push({data:t.data, origem:"Transferência enviada",
        detalhe:"Para: "+(destino?destino.nome:"—")+(t.observacao?" · "+t.observacao:""), quantidade:q});
    }
    if(tipo==="entradas" && t.materialDestinoId===materialId){
      const origem = STATE.materiais.find(x=>x.id===t.materialOrigemId);
      rows.push({data:t.data, origem:"Transferência recebida",
        detalhe:"De: "+(origem?origem.nome:"—")+(t.observacao?" · "+t.observacao:""), quantidade:q});
    }
  });
  // 4) Consumo de Produção (baixa efetiva dos pedidos) → só saídas
  if(tipo==="saidas"){
    getEfetivaBaixaRows().forEach(function(r){
      if(r.materialId!==materialId) return;
      rows.push({data:r.data, origem:"Consumo de Produção",
        detalhe:"OP "+(r.op||"—")+" · Cliente: "+(r.cliente||"—")+" · "+r.papel, quantidade:r.quantidade});
    });
  }
  rows.sort(function(a,b){ return (b.data||"").localeCompare(a.data||""); });
  rows.forEach(function(r){ r.unidade = unidade; });
  return rows;
}

/* Auditoria: mostra o que foi realmente ESCRITO no estoque (tabela movimentacoes_estoque),
   ao contrário da lista acima, que é calculada ao vivo a partir das telas de origem.
   Comparar as duas é o jeito de flagrar uma baixa que entrou em duplicidade: o mesmo
   pedido aparecendo duas vezes aqui, mas uma vez só na lista calculada. */
function openAuditoriaMaterialModal(materialId){

    return '<tr'+(dup?' style="background:'+COLORS.red+'12"':'')+'>'+

      '<td style="color:'+COLORS.textMuted+'">'+escapeHtml(mv.referencia||"—")+'</td>'+

        '<strong style="color:'+COLORS.red+'">'+duplicadas+' lançamento(s) de produção repetido(s)</strong> — marcados abaixo. Se a saída aconteceu uma vez só na prática, use <strong>Recalcular Saldo Atual</strong> na coluna Saldo Inicial para corrigir o estoque.</div>'
    : '<div style="font-size:12.5px;color:'+COLORS.textMuted+';margin-bottom:12px;line-height:1.5">Nenhum lançamento de produção repetido encontrado neste registro.</div>';

/* ---- Reconciliação: por que este material está divergente? ----
   A conta oficial é Saldo Inicial + Entradas − Saídas = Saldo Atual. Quando não fecha,
   a causa está na diferença entre o que foi CALCULADO ao vivo (a partir das notas,
   pedidos, baixas e transferências) e o que foi de fato ESCRITO no estoque (registrado
   em movimentacoes_estoque). Comparando os dois lado a lado, por origem, dá para separar:
     · Acerto de Estoque (origem "ajuste")  -> divergência legítima, foi uma correção manual
     · excesso na origem "producao"         -> consumo de pedido baixado em duplicidade
   Vale a identidade: divergência = (líquido calculado) − (líquido registrado). */
const MOV_ORIGEM_GRUPOS = [
  {id:"compra",        label:"Compras (Notas de Entrada)"},
  {id:"baixa_manual",  label:"Baixas manuais e avulsos"},
  {id:"transferencia", label:"Transferências"},
  {id:"producao",      label:"Consumo de produção"},
  {id:"ajuste",        label:"Acertos de estoque"},
];
function grupoDaOrigem(origem){
  if(origem==="avulso") return "baixa_manual";
  return MOV_ORIGEM_GRUPOS.some(g=>g.id===origem) ? origem : "ajuste";
}
function reconciliacaoMaterial(materialId){
  const m = STATE.materiais.find(x=>x.id===materialId);
  const live = {compra:0, baixa_manual:0, transferencia:0, producao:0, ajuste:0};
  const log  = {compra:0, baixa_manual:0, transferencia:0, producao:0, ajuste:0};
  // --- líquido CALCULADO ao vivo (positivo = entra no estoque) ---
  STATE.notas.forEach(function(n){
    (n.itens||[]).forEach(function(it){ if(it.materialId===materialId) live.compra += Number(it.quantidade||0); });
  });
  STATE.baixasManual.forEach(function(b){ if(b.materialId===materialId) live.baixa_manual -= Number(b.quantidade||0); });
  STATE.transferencias.forEach(function(t){
    if(t.materialOrigemId===materialId)  live.transferencia -= Number(t.quantidade||0);
    if(t.materialDestinoId===materialId) live.transferencia += Number(t.quantidade||0);
  });
  getEfetivaBaixaRows().forEach(function(r){ if(r.materialId===materialId) live.producao -= Number(r.quantidade||0); });
  // --- líquido REGISTRADO (o que realmente mexeu no saldo) ---
  (STATE.movimentacoes||[]).forEach(function(mv){
    if(mv.materialId!==materialId) return;
    const g = grupoDaOrigem(mv.origem);
    log[g] += (mv.tipo==="entrada" ? 1 : -1) * Number(mv.quantidade||0);
  });
  const r2 = v=>Math.round(v*100)/100;
  const grupos = MOV_ORIGEM_GRUPOS.map(function(g){
    return {id:g.id, label:g.label, live:r2(live[g.id]), log:r2(log[g.id]), diff:r2(log[g.id]-live[g.id])};
  });
  const liveTotal = r2(Object.keys(live).reduce((s,k)=>s+live[k],0));
  const logTotal  = r2(Object.keys(log).reduce((s,k)=>s+log[k],0));
  const divergencia = m ? divergenciaDoMaterial(m) : 0;
  /* Excesso de saída lançado como produção: o sinal negativo em diff quer dizer que
     saiu mais do estoque do que os pedidos justificam. */
  const excessoProducao = r2(-(grupos.find(g=>g.id==="producao").diff));
  const acertos = r2(log.ajuste);
  let classificacao, detalhe;
  if(Math.abs(divergencia) < 0.01){
    classificacao = "ok"; detalhe = "Sem divergência.";
  } else if(excessoProducao > 0.01 && Math.abs(excessoProducao - divergencia) < 0.02){
    classificacao = "duplicidade";
    detalhe = "Consumo de produção baixado a mais: "+fmtNum(excessoProducao)+" "+(m?m.unidade:"")+". O registro mostra mais saída de produção do que os pedidos justificam — típico de baixa lançada em duplicidade.";
  } else if(Math.abs(acertos) > 0.01 && Math.abs(divergencia + acertos) < 0.02){
    classificacao = "acerto";
    detalhe = "Explicada por Acerto de Estoque de "+(acertos>0?"+":"")+fmtNum(acertos)+" "+(m?m.unidade:"")+". É uma correção manual do saldo — não é erro.";
  } else if(excessoProducao > 0.01){
    classificacao = "duplicidade_parcial";
    detalhe = "Há "+fmtNum(excessoProducao)+" "+(m?m.unidade:"")+" de consumo de produção baixado a mais, mas isso não explica a divergência inteira. Pode haver também acerto de estoque ou lançamento não registrado.";
  } else {
    classificacao = "indeterminado";
    detalhe = "Não foi possível atribuir a uma causa só. Pode ser saldo inicial cadastrado errado, ou movimentação feita antes de o registro de auditoria existir.";
  }
  return {material:m, grupos:grupos, liveTotal:liveTotal, logTotal:logTotal,
          divergencia:divergencia, excessoProducao:excessoProducao, acertos:acertos,
          classificacao:classificacao, detalhe:detalhe};
}
const DIVERGENCIA_BADGES = {
  duplicidade:         {label:"Baixa duplicada",      cor:"#D1493E"},
  duplicidade_parcial: {label:"Duplicidade parcial",  cor:"#C98A00"},
  acerto:              {label:"Acerto de estoque",    cor:"#2F9E5B"},
  indeterminado:       {label:"Causa indeterminada",  cor:"#66707C"},
  ok:                  {label:"Sem divergência",      cor:"#2F9E5B"},
};
function badgeDivergenciaHtml(classificacao){

/* Detalhe material a material: calculado x registrado, linha por origem. */
function openReconciliacaoModal(materialId){
  const d = reconciliacaoMaterial(materialId);
  const m = d.material;
  if(!m) return;

      '<td style="text-align:right">'+num(g.live)+'</td>'+
      '<td style="text-align:right">'+num(g.log)+'</td>'+

    '</tr>';

  const html =
    '<div class="modal-overlay" onmousedown="if(event.target===this) closeModal()">'+
      '<div class="modal-card" style="max-width:640px">'+
        '<div class="modal-header"><h3>Reconciliação — '+escapeHtml(m.nome)+'</h3><button type="button" class="icon-btn" onclick="closeModal()">'+icon("x",16)+'</button></div>'+
        '<div style="margin-bottom:12px">'+badgeDivergenciaHtml(d.classificacao)+'</div>'+
        '<p style="font-size:12.5px;line-height:1.55;margin:0 0 14px;color:'+COLORS.text+'">'+escapeHtml(d.detalhe)+'</p>'+
        '<table class="pcp-table"><thead><tr><th>Origem</th><th style="text-align:right">Calculado</th><th style="text-align:right">Registrado</th><th style="text-align:right">Diferença</th></tr></thead>'+
        '<tbody>'+rowsHtml+
          '<tr style="background:var(--panel-alt);font-weight:700"><td>Líquido total</td>'+
            '<td style="text-align:right">'+num(d.liveTotal)+'</td>'+
            '<td style="text-align:right">'+num(d.logTotal)+'</td>'+
            '<td style="text-align:right">'+num(Math.round((d.logTotal-d.liveTotal)*100)/100, COLORS.red)+'</td></tr>'+
        '</tbody></table>'+
        '<p style="font-size:11.5px;color:'+COLORS.textMuted+';margin:12px 0 0;line-height:1.5">'+
          '<strong style="color:'+COLORS.text+'">Calculado</strong> = o que as telas de origem (notas, pedidos, baixas, transferências) dizem que deveria ter acontecido. '+
          '<strong style="color:'+COLORS.text+'">Registrado</strong> = o que de fato foi escrito no saldo. Uma diferença negativa em "Consumo de produção" significa que saiu mais do que os pedidos justificam.'+
          '<br><br>Atenção: o registro de auditoria é preenchido desde que esse controle passou a existir. Movimentações muito antigas podem não aparecer em "Registrado", o que sozinho já gera diferença sem significar erro.</p>'+
        '<div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="openAuditoriaMaterialModal(\''+m.id+'\')">Ver lançamentos</button>'+

        '</div>'+
      '</div>'+
    '</div>';
  document.getElementById("modal-root").innerHTML = html;
}
async function recalcularTodasDuplicidades(){
  if(!isCurrentUserAdmin()){ showToast("error","Apenas administradores podem recalcular saldos."); return; }
  const alvos = STATE.materiais
    .filter(m=>Math.abs(divergenciaDoMaterial(m))>=0.01)
    .filter(m=>reconciliacaoMaterial(m.id).classificacao==="duplicidade");
  if(alvos.length===0){ showToast("info","Nenhuma duplicidade confirmada para recalcular."); return; }
  if(!confirm("Recalcular o Saldo Atual de "+alvos.length+" material(is) com baixa duplicada confirmada? O Saldo Inicial de cada um é mantido.")) return;
  let ok = 0;
  for(const m of alvos){
    const t = movTotaisDoMaterial(m.id);
    const novoSaldo = Math.round((Number(m.estoqueInicial||0) + t.entradas - t.saidas)*100)/100;
    const delta = Math.round((novoSaldo - Number(m.estoque||0))*100)/100;
    if(!delta) continue;
    const { error } = await sb.from("materiais").update({estoque:novoSaldo}).eq("id", m.id);
    if(error){ sbErrorToast("recalcular saldo de "+m.nome, error); continue; }
    m.estoque = novoSaldo;
    await logMovimento(m.id, delta>0?"entrada":"saida", delta, "ajuste",
      "Recálculo em lote (baixa duplicada) para "+fmtNum(novoSaldo)+" "+m.unidade);
    ok++;
  }
  closeModal();
  renderScreen();
  showToast("success", ok+" saldo(s) recalculado(s).");
}
function imprimirLancamentosMaterial(materialId, tipo){
  const m = STATE.materiais.find(x=>x.id===materialId);
  if(!m) return;
  const rows = materialLancamentosRows(materialId, tipo);
  if(rows.length===0){ showToast("info","Nenhum lançamento pra imprimir."); return; }
  const sinal = tipo==="entradas" ? "+" : "−";
  const head = ["Data","Origem","Detalhe","Quantidade"];
  const body = rows.map(function(r){
    return [fmtDateBR(r.data), r.origem, r.detalhe||"—", sinal+fmtNum(r.quantidade)+" "+r.unidade];
  });
  gerarPdfTabela((tipo==="entradas"?"Entradas":"Saídas")+" — "+m.nome,
    "Gerado em "+fmtDateBR(todayStr())+" · "+rows.length+" lançamento(s)",
    head, body, "portrait");
}
function mapMaterialAvulsoFromRow(r){
  return {
    id:r.id, op:r.op||"", cliente:r.cliente||"", materialId:r.material_id, quantidade:Number(r.quantidade||0),
    dataPrevista:r.data_prevista||"", status:r.status||"aguardando", observacao:r.observacao||"",
    baixado:!!r.baixado, baixaManualId:r.baixa_manual_id||null, concluidoEm:r.concluido_em||null, criadoEm:r.created_at||null,
  };
}

/* ============================== HELPERS ============================== */
const DIAS_SEMANA = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
function pad2(n){ return String(n).padStart(2,"0"); }
function toISO(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function addDays(d,n){ const c=new Date(d); c.setDate(c.getDate()+n); return c; }
function mondayOfCurrentWeek(){ const d=new Date(); const day=(d.getDay()+6)%7; return addDays(d,-day); }
function weekdayFromDateStr(s){ if(!s) return ""; const [y,m,d]=s.split("-").map(Number); return DIAS_SEMANA[new Date(y,m-1,d).getDay()]; }
function fmtDateBR(s){ if(!s) return "—"; const [y,m,d]=s.split("-"); return d+"/"+m+"/"+y; }
function fmtNum(n){ return Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtBRL(n){ return Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function fmtElapsed(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return pad2(h)+":"+pad2(m)+":"+pad2(s);
}
function isoWeekNumber(s){
  const [y,m,d]=s.split("-").map(Number);
  const date=new Date(Date.UTC(y,m-1,d));
  const dayNum=(date.getUTCDay()+6)%7;
  date.setUTCDate(date.getUTCDate()-dayNum+3);
  const firstThursday=new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const diff=date-firstThursday;
  return 1+Math.round(diff/(7*24*3600*1000));
}
function isoFromUTCParts(d){ return d.getUTCFullYear()+"-"+pad2(d.getUTCMonth()+1)+"-"+pad2(d.getUTCDate()); }
function mondayOfIsoWeek(week, year){
  const jan4 = new Date(Date.UTC(year,0,4));
  const jan4Day = (jan4.getUTCDay()+6)%7;
  const mondayWeek1 = new Date(jan4); mondayWeek1.setUTCDate(jan4.getUTCDate()-jan4Day);
  const monday = new Date(mondayWeek1); monday.setUTCDate(mondayWeek1.getUTCDate() + (week-1)*7);
  return monday;
}
function jumpToWeek(stage, week, year){
  week = Number(week); year = Number(year);
  if(!week || !year) return;
  const s = STATE.stageState[stage];
  const monday = mondayOfIsoWeek(week, year);
  s.weekStart = isoFromUTCParts(monday);
  s.dIni = s.weekStart;
  const sat = new Date(monday); sat.setUTCDate(monday.getUTCDate()+5);
  s.dFim = isoFromUTCParts(sat);
  renderScreen();
}
function todayStr(){ return toISO(new Date()); }
function escapeAttr(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escapeHtml(s){ return escapeAttr(s); }
function matchesDateFilters(dateStr, f){
  if(!dateStr) return false;
  const hasAny = f.dia || f.dIni || f.dFim || f.ano || f.mes;
  if(!hasAny) return true;
  if(f.dia) return dateStr===f.dia;
  if(f.dIni && dateStr<f.dIni) return false;
  if(f.dFim && dateStr>f.dFim) return false;
  if(f.ano && dateStr.slice(0,4)!==String(f.ano)) return false;
  if(f.mes && dateStr.slice(5,7)!==String(f.mes).padStart(2,"0")) return false;
  return true;
}

function isStatusPreProducao(nome){ const n=(nome||"").toLowerCase(); return n.indexOf("pré-produ")===0 || n.indexOf("pre-produ")===0; }

/* ============================== EXPORTAÇÃO (EXCEL / PDF) ==============================
   Helpers genéricos usados pelas telas de Matéria-Prima, Baixa de Materiais e
   Movimentação de Estoque. O "Excel" é um CSV com separador ponto-e-vírgula e BOM
   UTF-8 — é o formato que o Excel em português abre direto, com acentos corretos e
   já separado em colunas. Números vão com vírgula decimal para o Excel reconhecer. */
function exportBotoesHtml(fnBase){
  return '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn btn-ghost" onclick="'+fnBase+'Excel()" title="Baixar planilha (.csv, abre no Excel)">'+icon("package",13)+' Excel</button>'+
    '<button class="btn btn-ghost" onclick="'+fnBase+'Pdf()" title="Gerar PDF">'+icon("printer",13)+' PDF</button>'+
  '</div>';
}
function csvCell(v){
  if(v==null) return "";
  const s = String(v);
  return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvNum(n){ return String(Number(n||0).toFixed(2)).replace(".", ","); }
function baixarCsv(nomeArquivo, head, body){
  const linhas = [head].concat(body).map(function(r){ return r.map(csvCell).join(";"); }).join("\r\n");
  const blob = new Blob(["\ufeff"+linhas], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nomeArquivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showToast("success","Planilha gerada.");
}
function gerarPdfTabela(titulo, subtitulo, head, body, orientacao){
  if(!window.jspdf || !window.jspdf.jsPDF){ showToast("error","Biblioteca de PDF não carregou — verifique sua conexão e tente novamente."); return; }
  const doc = new window.jspdf.jsPDF({orientation: orientacao || "landscape"});
  doc.setFontSize(14);
  doc.text(titulo, 14, 16);
  doc.setFontSize(9);
  doc.text(subtitulo, 14, 22);
  doc.autoTable({
    startY:28, head:[head], body:body,
    styles:{fontSize:8}, headStyles:{fillColor:[0,128,198]},
  });
  const nome = titulo.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  doc.save(nome+"-"+todayStr()+".pdf");
  showToast("success","PDF gerado.");
}
function statCardHtml(label, value, iconName, accent, onClick){
  accent = accent || COLORS.textMuted;
  const valColor = accent===COLORS.textMuted ? COLORS.text : accent;
  const clickAttrs = onClick ? ' onclick="'+escapeAttr(onClick)+'" style="cursor:pointer" title="Clique para ver o diagnóstico"' : '';
  return '<div class="pcp-card stat-card"'+clickAttrs+'><div style="display:flex;align-items:center;justify-content:space-between"><span class="stat-label">'+label+'</span>'+icon(iconName,15,accent)+'</div><div class="stat-value" style="color:'+valColor+'">'+value+'</div></div>';
}
function barListHtml(items){
  const max = Math.max.apply(null, items.map(i=>i.value).concat([1]));
  return items.map(i=>{
    const pct = Math.max(4, Math.round((i.value/max)*100));
    return '<div style="margin-bottom:12px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:4px"><span>'+(i.labelHtml||escapeHtml(i.label))+'</span><span style="font-family:\'IBM Plex Mono\',monospace;font-weight:600;white-space:nowrap;margin-left:8px">'+fmtNum(i.value)+' m</span></div>'+
      '<div style="height:8px;background:var(--panel-alt);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+COLORS.brand+'"></div></div>'+
    '</div>';
  }).join('');
}
/* Gráfico de barras verticais para comparar categorias (cidade, cor, tipo de EPS, etc). */
function categoryBarChartHtml(items, cor, unidade){
  unidade = unidade || "m";
  if(!items.length) return emptyStateHtml("Sem dados para o filtro selecionado.");
  const maxVal = Math.max.apply(null, items.map(function(i){ return i.value; }).concat([1]));
  const escala = maxVal * 1.15;
  const colWidth = 42;
  const bars = items.map(function(it){
    const alturaPct = escala>0 ? Math.min(100, (it.value/escala)*100) : 0;
    const tip = (it.label||"")+" — "+fmtNum(it.value)+" "+unidade;
    return '<div class="chart-col" style="min-width:'+colWidth+'px;flex:0 0 '+colWidth+'px" title="'+escapeAttr(tip)+'">'+
      (it.value>0 ? '<div style="font-size:8px;color:'+COLORS.textMuted+';margin-bottom:2px;white-space:nowrap">'+Math.round(it.value)+'</div>' : '')+
      '<div class="chart-bar" style="height:'+alturaPct+'%;background:'+cor+'"></div>'+
    '</div>';
  }).join('');
  const labels = items.map(function(it){
    const txt = (it.label||"").length>11 ? (it.label||"").slice(0,10)+"…" : (it.label||"");
    return '<div style="min-width:'+colWidth+'px;flex:0 0 '+colWidth+'px;text-align:center;font-size:9px;color:'+COLORS.textMuted+';white-space:nowrap;overflow:hidden" title="'+escapeAttr(it.label||"")+'">'+escapeHtml(txt)+'</div>';
  }).join('');
  const totalWidth = items.length*colWidth;
  return '<div style="overflow-x:auto">'+
    '<div class="chart-wrap" style="min-width:'+totalWidth+'px">'+bars+'</div>'+
    '<div class="chart-days" style="min-width:'+totalWidth+'px">'+labels+'</div>'+
  '</div>';

/* Acessores de ordenação por coluna da tela de Matéria-Prima. A chave é a mesma
   usada em `columns`, o que permite ordenar clicando no cabeçalho e pelo seletor
   "Ordenar por" usando um único estado (materiaisFiltro.ordenarPor = "chave_dir"). */
const MATERIAL_SORT_ACCESSORS = {
  atencao:        (m,ctx)=> m.atencao?1:0,
  tipo:           (m,ctx)=> (m.tipo||"").toLowerCase(),
  nome:           (m,ctx)=> (m.nome||"").toLowerCase(),
  cor:            (m,ctx)=> m.cor==="S"?1:0,
  estoqueInicial: (m,ctx)=> Number(m.estoqueInicial||0),
  entradas:       (m,ctx)=> ctx.mov[m.id] ? ctx.mov[m.id].entradas : 0,
  saidas:         (m,ctx)=> ctx.mov[m.id] ? ctx.mov[m.id].saidas : 0,
  estoque:        (m,ctx)=> Number(m.estoque||0),
  preProducao:    (m,ctx)=> Number(ctx.pre[m.id]||0),
  estoqueMinimo:  (m,ctx)=> Number(m.estoqueMinimo||0),
  loteMinimo:     (m,ctx)=> Number(m.loteMinimo||0),
  fator:          (m,ctx)=> Number(m.fator||1),
  valorUnitario:  (m,ctx)=> Number(m.valorUnitario||0),
  valorEstoque:   (m,ctx)=> Number(m.estoque||0)*Number(m.valorUnitario||0),
  dataCadastro:   (m,ctx)=> m.dataCadastro||"",
};
/* Opções do seletor "Ordenar por" — mesmo formato "chave_dir" dos cliques no cabeçalho. */
const MATERIAL_ORDENACAO_OPCOES = [
  {value:"", label:"Padrão"},
  {value:"nome_asc", label:"Material (A-Z)"},
  {value:"nome_desc", label:"Material (Z-A)"},
  {value:"tipo_asc", label:"Tipo (A-Z)"},
  {value:"saidas_desc", label:"Saídas (maior → menor)"},
  {value:"entradas_desc", label:"Entradas (maior → menor)"},
  {value:"estoque_desc", label:"Saldo Atual (maior → menor)"},
  {value:"estoque_asc", label:"Saldo Atual (menor → maior)"},
  {value:"valorEstoque_desc", label:"Valor em Estoque (maior → menor)"},
  {value:"valorEstoque_asc", label:"Valor em Estoque (menor → maior)"},
  {value:"dataCadastro_desc", label:"Cadastrado em (mais recente)"},
  {value:"dataCadastro_asc", label:"Cadastrado em (mais antigo)"},
];
/* Separa "chave_dir" em {chave, dir}. A chave pode conter "_", então corta no último. */
function parseOrdenacao(ordenarPor){
  if(!ordenarPor) return null;
  const i = ordenarPor.lastIndexOf("_");
  if(i<=0) return null;
  const chave = ordenarPor.slice(0,i), dir = ordenarPor.slice(i+1);
  if(!MATERIAL_SORT_ACCESSORS[chave] || (dir!=="asc" && dir!=="desc")) return null;
  return {chave:chave, dir:dir};
}
function ordenarMateriais(items, ordenarPor){
  const ord = parseOrdenacao(ordenarPor);
  if(!ord) return items;
  const acessor = MATERIAL_SORT_ACCESSORS[ord.chave];
  /* Contexto calculado UMA vez: preProducaoTotals() varre todos os pedidos, e
     chamá-lo dentro do comparador o executaria a cada comparação. */
  const ctx = {mov: movTotaisMap(), pre: preProducaoTotals()};
  const sinal = ord.dir==="desc" ? -1 : 1;
  const porNome = (a,b)=> (a.nome||"").localeCompare(b.nome||"", "pt-BR", {sensitivity:"base"});
  /* Decora-ordena-desdecora: calcula a chave de cada item uma vez só. */
  return items
    .map((m,i)=>({m:m, k:acessor(m,ctx), i:i}))
    .sort(function(a,b){
      let c;
      if(typeof a.k === "string" || typeof b.k === "string"){
        c = String(a.k).localeCompare(String(b.k), "pt-BR", {sensitivity:"base"});
      } else {
        c = (Number(a.k)||0) - (Number(b.k)||0);
      }
      if(c) return sinal*c;
      return porNome(a.m, b.m) || (a.i - b.i);   // empate: nome, depois ordem original
    })
    .map(x=>x.m);
}

/* ---- exportação: Matéria-Prima (respeita os filtros da tela) ---- */
function materiaisExportDados(){
  const items = ENTITY_CONFIGS.material.filterItems(STATE.materiais);
  const head = ["Tipo","Material","É Cor?","Saldo Inicial","Entradas","Saídas","Saldo Atual","Divergência","Pré-produção","Mínimo","Lote Mín. Compra","Fator Consumo","Valor Unit.","Valor em Estoque","Unidade","Cadastrado em"];
  const preTotals = preProducaoTotals();
  const rows = items.map(function(m){
    const t = movTotaisDoMaterial(m.id);
    return [
      m.tipo, m.nome, m.cor==="S"?"Sim":"Não",
      Number(m.estoqueInicial||0), t.entradas, t.saidas, Number(m.estoque||0),
      divergenciaDoMaterial(m), Number(preTotals[m.id]||0),
      Number(m.estoqueMinimo||0), Number(m.loteMinimo||0), Number(m.fator||1),
      Number(m.valorUnitario||0), Number(m.estoque||0)*Number(m.valorUnitario||0),
      m.unidade, m.dataCadastro||"",
    ];
  });
  return {items:items, head:head, rows:rows};
}

async function salvarAcertoEstoque(materialId){
  const m = STATE.materiais.find(x=>x.id===materialId);
  if(!m) return;
  if(!isCurrentUserAdmin()){ showToast("error","Apenas administradores podem fazer acerto de estoque."); return; }
  const novoSaldo = Number(document.getElementById("acerto-saldo").value||0);
  const motivo = document.getElementById("acerto-motivo").value.trim();
  const anterior = m.estoque;
  const ultimoAcerto = {data: todayStr(), motivo: motivo, saldoAnterior: anterior, saldoNovo: novoSaldo};
  const { error } = await sb.from("materiais").update({estoque:novoSaldo, ultimo_acerto:ultimoAcerto}).eq("id", materialId);
  if(error){ sbErrorToast("ajustar estoque", error); return; }
  m.estoque = novoSaldo;
  m.ultimoAcerto = ultimoAcerto;
  const deltaAcerto = novoSaldo - anterior;
  if(deltaAcerto) await logMovimento(materialId, deltaAcerto>0?"entrada":"saida", deltaAcerto, "ajuste", motivo||"Acerto de estoque");
  closeModal();
  renderScreen();
  showToast("success","Estoque ajustado: "+fmtNum(anterior)+" \u2192 "+fmtNum(novoSaldo)+" "+m.unidade+".");
}

async function submitBaixaManualForm(event){
  event.preventDefault();
  const fd = new FormData(event.target);
  const data = Object.fromEntries(fd.entries());
  const m = STATE.materiais.find(x=>x.id===data.materialId);
  const qtd = Number(data.quantidade||0);
  if(!m || qtd<=0) return false;
  const novoEstoque = Math.round((m.estoque - qtd)*100)/100;
  const { data:row, error:insErr } = await sb.from("baixas_manual").insert({
    material_id:data.materialId, quantidade:qtd, motivo:data.motivo||"", observacao:data.observacao||"", data:data.data||todayStr(),
  }).select().single();
  if(insErr){ sbErrorToast("registrar baixa", insErr); return false; }
  const { error:updErr } = await sb.from("materiais").update({estoque:novoEstoque}).eq("id", data.materialId);
  if(updErr){
    sbErrorToast("atualizar estoque após a baixa", updErr);
    await sb.from("baixas_manual").delete().eq("id", row.id);
    return false;
  }
  m.estoque = novoEstoque;
  STATE.baixasManual.push(mapBaixaManualFromRow(row));
  await logMovimento(data.materialId, "saida", qtd, "baixa_manual", data.motivo||"Baixa de estoque");
  closeModal();
  renderScreen();
  showToast("success","Baixa de "+fmtNum(qtd)+" "+m.unidade+" registrada para "+m.nome+".");
  return false;
}
function confirmDeleteBaixaManual(id){
  const b = STATE.baixasManual.find(x=>x.id===id);
  const m = b ? STATE.materiais.find(x=>x.id===b.materialId) : null;
  const html =
    '<div class="modal-overlay" onmousedown="if(event.target===this) closeModal()">'+
      '<div class="modal-card" style="max-width:380px">'+
        '<div class="modal-header"><h3>Estornar baixa</h3><button type="button" class="icon-btn" onclick="closeModal()">'+icon("x",16)+'</button></div>'+
        '<p style="color:'+COLORS.textMuted+';font-size:13.5px;line-height:1.5;margin:0">Remover esta baixa de "'+(m?escapeHtml(m.nome):"?")+'"? A quantidade será devolvida ao estoque.</p>'+
        '<div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button type="button" class="btn btn-danger" onclick="doDeleteBaixaManual(\''+id+'\')">Remover</button></div>'+
      '</div>'+
    '</div>';
  document.getElementById("modal-root").innerHTML = html;
}
async function doDeleteBaixaManual(id){
  const b = STATE.baixasManual.find(x=>x.id===id);
  if(b){
    const m = STATE.materiais.find(x=>x.id===b.materialId);
    const novoEstoque = m ? Math.round((m.estoque + b.quantidade)*100)/100 : null;
    const { error:delErr } = await sb.from("baixas_manual").delete().eq("id", id);
    if(delErr){ sbErrorToast("remover baixa", delErr); return; }
    if(m){
      const { error:updErr } = await sb.from("materiais").update({estoque:novoEstoque}).eq("id", m.id);
      if(updErr){ sbErrorToast("estornar estoque", updErr); }
      else {
        m.estoque = novoEstoque;
        const origemMov = (b.motivo||"").indexOf("Avulso")>=0 ? "avulso" : "baixa_manual";
        await logMovimento(m.id, b.quantidade>0?"entrada":"saida", b.quantidade, origemMov, "Estorno: "+(b.motivo||"baixa removida"));
      }
    }
    STATE.baixasManual = STATE.baixasManual.filter(x=>x.id!==id);
  }
  closeModal();
  renderScreen();
  showToast("info","Baixa removida e estoque estornado.");
}

async function devolverBaixaRow(materialId){

  if(updErr){
    sbErrorToast("atualizar estoque na devolução", updErr);
    await sb.from("baixas_manual").delete().eq("id", row.id);

  }
  m.estoque = novoEstoque;

  await logMovimento(materialId, "entrada", qtd, "baixa_manual", obs||"Devolução (baixa duplicada)");
  closeModal();
  renderScreen();
  showToast("success", fmtNum(qtd)+" "+m.unidade+" devolvidos ao estoque de "+m.nome+".");
}

/* ============================== SEPARAÇÃO DE MATERIAIS AVULSOS ==============================
   Fluxo de separação/baixa de matéria-prima vinculada a uma OP, mas fora do fluxo normal de
   produção (perfilar/pintura/colagem/entrega). Funciona como um quadro Kanban: cada registro
   nasce em "Aguardando" e avança pelos status até "Concluído" — quando chega em "Concluído" a
   quantidade é baixada automaticamente do estoque da matéria-prima (mesmo mecanismo da Baixa de
   Estoque manual). Se o status voltar de "Concluído" pra outro, a baixa é estornada. */
const STATUS_AVULSO_DEFS = [
  {id:"aguardando", label:"Aguardando"},
  {id:"pre_separacao", label:"Pré-separação"},
  {id:"em_separacao", label:"Em Separação"},
  {id:"aguardando_compra", label:"Aguardando Compra"},
  {id:"concluido", label:"Concluído"},
];
function statusAvulsoDef(id){ return STATUS_AVULSO_DEFS.find(function(s){ return s.id===id; }) || STATUS_AVULSO_DEFS[0]; }
function statusAvulsoLabel(id){ return statusAvulsoDef(id).label; }
function statusAvulsoCor(id){
  if(id==="concluido") return COLORS.green;
  if(id==="aguardando_compra") return COLORS.red;
  if(id==="em_separacao") return "#C98200";
  if(id==="pre_separacao") return COLORS.brand;
  return COLORS.textMuted;
}
function updateAvulsoFiltro(key, val){ STATE.avulsoFiltro[key]=val; renderScreen(); }
function clearAvulsoFiltro(){ STATE.avulsoFiltro = {op:"",materialId:"",status:"",tipo:""}; renderScreen(); }
function updateAvulsoConcluidosFiltro(key, val){ STATE.avulsoConcluidosFiltro[key]=val; renderScreen(); }
function clearAvulsoConcluidosFiltro(){ STATE.avulsoConcluidosFiltro = {op:"",materialId:"",dIni:"",dFim:""}; renderScreen(); }

function avulsoMaterialDisplay(m){ return m.tipo+" — "+m.nome+" (estoque: "+fmtNum(m.estoque)+" "+m.unidade+")"; }
/* Campo de matéria-prima com busca por texto (digita qualquer parte do nome ou tipo, não só
   o começo) — troca o <select> simples, que ficava ruim de usar com a lista grande.
   Indexado (idx) porque o lançamento agora pode ter vários itens na mesma tela. */
function materialBuscaFieldHtml(idx, selectedId, disabled){

function filterAvulsoMaterialOptions(idx, query){
  const box = document.getElementById("avulso-material-options-"+idx);
  if(!box) return;
  const q = (query||"").trim().toLowerCase();
  const matches = STATE.materiais.filter(function(m){
    if(!q) return true;
    return (m.nome||"").toLowerCase().indexOf(q)!==-1 || (m.tipo||"").toLowerCase().indexOf(q)!==-1;
  }).slice(0,60);
  box.innerHTML = matches.length
    ? matches.map(function(m){ return '<div class="avulso-material-option" style="padding:8px 10px;font-size:13px;cursor:pointer" onmousedown="selectAvulsoMaterial('+idx+',\''+m.id+'\')">'+escapeHtml(avulsoMaterialDisplay(m))+'</div>'; }).join("")
    : '<div style="padding:8px 10px;font-size:12.5px;color:'+COLORS.textMuted+'">Nenhuma matéria-prima encontrada.</div>';
  box.style.display = "block";
}
function hideAvulsoMaterialOptions(idx){
  const box = document.getElementById("avulso-material-options-"+idx);

}
function selectAvulsoMaterial(idx, id){

async function submitAvulsoForm(event, editId){
  event.preventDefault();
  const fd = new FormData(event.target);
  const data = Object.fromEntries(fd.entries());
  if(editId){
    const item = STATE.materiaisAvulsos.find(function(a){ return a.id===editId; });
    if(!item) return false;
    const payload = { op:data.op||"", cliente:data.cliente||"", data_prevista:data.dataPrevista||null, observacao:data.observacao||"" };
    if(!item.baixado){
      const materialId = (document.getElementById("avulso-material-id-0")||{}).value;
      const qtd = Number((document.getElementById("avulso-qtd-0")||{}).value||0);
      if(!materialId){ showToast("error","Selecione uma matéria-prima."); return false; }
      if(qtd<=0){ showToast("error","Informe uma quantidade válida."); return false; }
      payload.material_id = materialId;
      payload.quantidade = qtd;
    }
    const { data:row, error } = await sb.from("materiais_avulsos").update(payload).eq("id", editId).select().single();
    if(error){ sbErrorToast("atualizar registro avulso", error); return false; }
    Object.assign(item, mapMaterialAvulsoFromRow(row));
    closeModal();
    renderScreen();
    showToast("success","Registro atualizado.");
  } else {
    const container = document.getElementById("avulso-linhas");
    const linhaEls = container ? Array.from(container.querySelectorAll(".avulso-linha")) : [];
    const itens = [];
    linhaEls.forEach(function(el){
      const idx = el.getAttribute("data-idx");
      const materialId = (document.getElementById("avulso-material-id-"+idx)||{}).value;
      const qtd = Number((document.getElementById("avulso-qtd-"+idx)||{}).value||0);
      if(materialId && qtd>0) itens.push({material_id:materialId, quantidade:qtd});
    });
    if(itens.length===0){ showToast("error","Adicione ao menos um item válido (matéria-prima + quantidade)."); return false; }
    const rows = itens.map(function(it){
      return {
        op:data.op||"", cliente:data.cliente||"", material_id:it.material_id, quantidade:it.quantidade,
        data_prevista:data.dataPrevista||null, observacao:data.observacao||"", status:"aguardando",
      };
    });
    const { data:inseridos, error } = await sb.from("materiais_avulsos").insert(rows).select();
    if(error){ sbErrorToast("criar registro(s) avulso(s)", error); return false; }
    (inseridos||[]).forEach(function(r){ STATE.materiaisAvulsos.push(mapMaterialAvulsoFromRow(r)); });
    closeModal();
    renderScreen();
    showToast("success", itens.length>1 ? (itens.length+" itens criados em \"Aguardando\".") : "Registro criado em \"Aguardando\".");
  }
  return false;
}
function confirmDeleteAvulso(id){
  const item = STATE.materiaisAvulsos.find(function(a){ return a.id===id; });
  if(!item) return;
  const html =

      '<div class="modal-card" style="max-width:400px">'+

        '<p style="color:'+COLORS.textMuted+';font-size:13.5px;line-height:1.5;margin:0">Excluir o registro '+(item.op?("da OP "+escapeHtml(item.op)):"")+'?'+(item.baixado?' A baixa já feita no estoque será estornada.':'')+'</p>'+
        '<div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button type="button" class="btn btn-danger" onclick="doDeleteAvulso(\''+id+'\')">Excluir</button></div>'+
      '</div>'+
    '</div>';

async function doDeleteAvulso(id){
  const item = STATE.materiaisAvulsos.find(function(a){ return a.id===id; });
  if(!item) return;
  if(item.baixado){
    const ok = await estornarBaixaAvulso(item);
    if(!ok) return;
  }
  const { error } = await sb.from("materiais_avulsos").delete().eq("id", id);
  if(error){ sbErrorToast("excluir registro avulso", error); return; }
  STATE.materiaisAvulsos = STATE.materiaisAvulsos.filter(function(a){ return a.id!==id; });
  closeModal();
  renderScreen();
  showToast("info","Registro excluído.");
}
async function efetivarBaixaAvulso(item){
  const m = STATE.materiais.find(function(x){ return x.id===item.materialId; });
  if(!m){ showToast("error","Matéria-prima não encontrada — não é possível baixar."); return false; }
  const qtd = Number(item.quantidade||0);
  if(!(qtd>0)){ showToast("error","Quantidade inválida para baixa."); return false; }
  const novoEstoque = Math.round((m.estoque - qtd)*100)/100;
  const { data:row, error:insErr } = await sb.from("baixas_manual").insert({
    material_id:m.id, quantidade:qtd, motivo:"Separação de Material Avulso",
    observacao:"OP "+(item.op||"—")+(item.cliente?(" · "+item.cliente):""), data:todayStr(),
  }).select().single();
  if(insErr){ sbErrorToast("registrar baixa da separação avulsa", insErr); return false; }
  const { error:updErr } = await sb.from("materiais").update({estoque:novoEstoque}).eq("id", m.id);
  if(updErr){
    sbErrorToast("atualizar estoque da separação avulsa", updErr);
    await sb.from("baixas_manual").delete().eq("id", row.id);
    return false;
  }
  m.estoque = novoEstoque;
  STATE.baixasManual.push(mapBaixaManualFromRow(row));
  await logMovimento(m.id, "saida", qtd, "avulso", "OP "+(item.op||"—")+(item.cliente?(" · "+item.cliente):""));
  item.baixado = true;
  item.baixaManualId = row.id;
  const { error:updAvErr } = await sb.from("materiais_avulsos").update({ baixado:true, baixa_manual_id:row.id }).eq("id", item.id);
  if(updAvErr) sbErrorToast("marcar separação como baixada", updAvErr);
  return true;
}
async function estornarBaixaAvulso(item){
  const m = STATE.materiais.find(function(x){ return x.id===item.materialId; });
  const baixaManualIdAnterior = item.baixaManualId;
  // Ordem importa: materiais_avulsos.baixa_manual_id referencia baixas_manual.id, então
  // primeiro desvincula (senão o delete abaixo esbarra na constraint de chave estrangeira).
  const { error:updAvErr } = await sb.from("materiais_avulsos").update({ baixado:false, baixa_manual_id:null }).eq("id", item.id);
  if(updAvErr){ sbErrorToast("desmarcar separação como baixada", updAvErr); return false; }
  item.baixado = false;
  item.baixaManualId = null;
  if(baixaManualIdAnterior){
    const { error:delErr } = await sb.from("baixas_manual").delete().eq("id", baixaManualIdAnterior);
    if(delErr){ sbErrorToast("estornar baixa da separação avulsa", delErr); return false; }
    STATE.baixasManual = STATE.baixasManual.filter(function(b){ return b.id!==baixaManualIdAnterior; });
  }
  if(m){
    const novoEstoque = Math.round((m.estoque + Number(item.quantidade||0))*100)/100;
    const { error:updErr } = await sb.from("materiais").update({estoque:novoEstoque}).eq("id", m.id);
    if(updErr){ sbErrorToast("devolver estoque da separação avulsa", updErr); return false; }
    m.estoque = novoEstoque;
    await logMovimento(m.id, "entrada", item.quantidade, "avulso", "Estorno — OP "+(item.op||"—")+(item.cliente?(" · "+item.cliente):""));
  }
  return true;
}
async function updateAvulsoStatus(id, novoStatus){
  const item = STATE.materiaisAvulsos.find(function(a){ return a.id===id; });
  if(!item || item.status===novoStatus) return;
  const statusAnterior = item.status;
  if(novoStatus==="concluido" && !item.baixado){
    const ok = await efetivarBaixaAvulso(item);
    if(!ok) return;
  } else if(statusAnterior==="concluido" && novoStatus!=="concluido" && item.baixado){
    const ok = await estornarBaixaAvulso(item);
    if(!ok) return;
  }
  const concluidoEm = novoStatus==="concluido" ? new Date().toISOString() : null;
  const { error } = await sb.from("materiais_avulsos").update({ status:novoStatus, concluido_em:concluidoEm }).eq("id", id);
  if(error){ sbErrorToast("atualizar status", error); return; }
  item.status = novoStatus;
  item.concluidoEm = concluidoEm;
  renderScreen();
  showToast("success","Status atualizado para \""+statusAvulsoLabel(novoStatus)+"\".");
}
async function rescheduleAvulso(id, newDate){
  const item = STATE.materiaisAvulsos.find(function(x){ return x.id===id; });
  if(!item || item.dataPrevista===newDate) return;
  const anterior = item.dataPrevista;
  item.dataPrevista = newDate;
  renderScreen();
  const { error } = await sb.from("materiais_avulsos").update({ data_prevista:newDate }).eq("id", id);
  if(error){ sbErrorToast("reprogramar separação", error); item.dataPrevista = anterior; renderScreen(); return; }
  showToast("success","Reprogramado para "+weekdayFromDateStr(newDate)+" ("+fmtDateBR(newDate)+").");
}

function handleAvulsoDrop(event, targetDate){

/* Avança pro próximo status do fluxo (botão ▶). Reaproveita updateAvulsoStatus, que já cuida
   da baixa automática quando cair em "Concluído". */
function avancarAvulsoStatus(id){
  const item = STATE.materiaisAvulsos.find(function(a){ return a.id===id; });
  if(!item) return;
  const idx = STATUS_AVULSO_DEFS.findIndex(function(s){ return s.id===item.status; });
  if(idx===-1 || idx>=STATUS_AVULSO_DEFS.length-1) return;
  updateAvulsoStatus(id, STATUS_AVULSO_DEFS[idx+1].id);
}

/* ---- Tela 1: Lanç.de Pedidos (cadastro — igual à tela "Lançamentos" dos pedidos) ---- */

  document.getElementById("content").innerHTML =

function shiftAvulsoWeek(n){
  const s = STATE.avulsoStageState;
  s.weekStart = toISO(addDays(new Date(s.weekStart+"T00:00:00"), n*7));
  s.dIni = s.weekStart;
  s.dFim = toISO(addDays(new Date(s.weekStart+"T00:00:00"),5));
  renderScreen();
}
function updateAvulsoStageFilter(key, val){ STATE.avulsoStageState[key]=val; renderScreen(); }
function clearAvulsoStageFiltro(){
  const s = STATE.avulsoStageState;
  s.materialId=""; s.op=""; s.status=""; s.tipo="";
  renderScreen();
}
function toggleAvulsoDiaVisivel(idx){ STATE.avulsoStageState.diasVisiveis[idx] = !STATE.avulsoStageState.diasVisiveis[idx]; renderScreen(); }
function jumpToAvulsoWeek(week, year){
  week = Number(week); year = Number(year);
  if(!week || !year) return;
  const s = STATE.avulsoStageState;
  const monday = mondayOfIsoWeek(week, year);
  s.weekStart = isoFromUTCParts(monday);
  s.dIni = s.weekStart;
  const sat = new Date(monday); sat.setUTCDate(monday.getUTCDate()+5);
  s.dFim = isoFromUTCParts(sat);
  renderScreen();
}
function computeAvulsoAtivos(){
  const s = STATE.avulsoStageState;
  return STATE.materiaisAvulsos.filter(function(a){
    if(a.status==="concluido" || !a.dataPrevista) return false;
    if(a.dataPrevista<s.dIni || a.dataPrevista>s.dFim) return false;
    if(s.materialId && a.materialId!==s.materialId) return false;
    if(s.tipo){ const m = STATE.materiais.find(function(x){ return x.id===a.materialId; }); if(!m || m.tipo!==s.tipo) return false; }
    if(s.op && !(a.op||"").toLowerCase().includes(s.op.toLowerCase())) return false;
    if(s.status && a.status!==s.status) return false;
    return true;
  });
}

function gerarPdfAvulsosConcluidos(){
  if(!window.jspdf || !window.jspdf.jsPDF){ showToast("error","Biblioteca de PDF não carregou — verifique sua conexão e tente novamente."); return; }
  const f = STATE.avulsoConcluidosFiltro;
  const concluidos = STATE.materiaisAvulsos.filter(function(a){
    if(a.status!=="concluido") return false;
    if(f.op && !(a.op||"").toLowerCase().includes(f.op.toLowerCase())) return false;
    if(f.materialId && a.materialId!==f.materialId) return false;
    const d = (a.concluidoEm||"").slice(0,10);
    if(f.dIni && d && d<f.dIni) return false;
    if(f.dFim && d && d>f.dFim) return false;
    return true;
  }).sort(function(a,b){ return (b.concluidoEm||"").localeCompare(a.concluidoEm||""); });
  if(concluidos.length===0){ showToast("info","Nenhum registro concluído pra exportar com os filtros atuais."); return; }
  const doc = new window.jspdf.jsPDF({orientation:"landscape"});
  doc.setFontSize(14);
  doc.text("ELEVE — Pedidos Concluídos (Acessórios)", 14, 16);
  doc.setFontSize(9);
  doc.text("Gerado em "+fmtDateBR(todayStr())+" · "+concluidos.length+" registro(s)", 14, 22);
  const body = concluidos.map(function(a){
    const m = STATE.materiais.find(function(x){ return x.id===a.materialId; });
    return [
      a.op||"—", a.cliente||"—", m?m.nome:"?",
      fmtNum(a.quantidade)+" "+(m?m.unidade:""),
      a.concluidoEm ? fmtDateBR(a.concluidoEm.slice(0,10)) : "—",
      a.observacao||"—",
    ];
  });
  doc.autoTable({
    startY:28,
    head:[["OP","Cliente","Matéria-Prima","Quantidade","Concluído em","Observação"]],
    body:body,
    styles:{fontSize:8.5},
    headStyles:{fillColor:[0,128,198]},
  });
  doc.save("materiais-avulsos-concluidos-"+todayStr()+".pdf");
  showToast("success","PDF gerado.");
}

          '<div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button type="submit" class="btn btn-primary">Confirmar Transferência</button></div>'+

async function submitTransferenciaForm(event){
  event.preventDefault();
  const fd = new FormData(event.target);
  const data = Object.fromEntries(fd.entries());
  const qtd = Number(data.quantidade||0);
  if(data.materialOrigemId===data.materialDestinoId){ showToast("info","Escolha matérias-primas de origem e destino diferentes."); return false; }
  const origem = STATE.materiais.find(x=>x.id===data.materialOrigemId);
  const destino = STATE.materiais.find(x=>x.id===data.materialDestinoId);
  if(!origem || !destino || qtd<=0) return false;
  const novoOrigem = Math.round((origem.estoque - qtd)*100)/100;
  const novoDestino = Math.round((destino.estoque + qtd)*100)/100;
  const { data:row, error:insErr } = await sb.from("transferencias").insert({
    material_origem_id:origem.id, material_destino_id:destino.id, quantidade:qtd, observacao:data.observacao||"", data:data.data||todayStr(),
  }).select().single();
  if(insErr){ sbErrorToast("registrar transferência", insErr); return false; }
  const [r1, r2] = await Promise.all([
    sb.from("materiais").update({estoque:novoOrigem}).eq("id", origem.id),
    sb.from("materiais").update({estoque:novoDestino}).eq("id", destino.id),
  ]);
  if(r1.error || r2.error){
    sbErrorToast("atualizar estoque da transferência", r1.error||r2.error);
    await sb.from("transferencias").delete().eq("id", row.id);
    return false;
  }
  origem.estoque = novoOrigem;
  destino.estoque = novoDestino;
  STATE.transferencias.push(mapTransferenciaFromRow(row));
  await Promise.all([
    logMovimento(origem.id, "saida", qtd, "transferencia", "Para "+destino.nome+(data.observacao?(" — "+data.observacao):"")),
    logMovimento(destino.id, "entrada", qtd, "transferencia", "De "+origem.nome+(data.observacao?(" — "+data.observacao):"")),
  ]);
  closeModal();
  renderScreen();
  showToast("success","Transferidos "+fmtNum(qtd)+" de "+origem.nome+" para "+destino.nome+".");
  return false;
}

  const destino = t ? STATE.materiais.find(x=>x.id===t.materialDestinoId) : null;
  const html =
    '<div class="modal-overlay" onmousedown="if(event.target===this) closeModal()">'+
      '<div class="modal-card" style="max-width:400px">'+
        '<div class="modal-header"><h3>Estornar transferência</h3><button type="button" class="icon-btn" onclick="closeModal()">'+icon("x",16)+'</button></div>'+
        '<p style="color:'+COLORS.textMuted+';font-size:13.5px;line-height:1.5;margin:0">Desfazer a transferência de "'+(origem?escapeHtml(origem.nome):"?")+'" para "'+(destino?escapeHtml(destino.nome):"?")+'"? O estoque de ambos será revertido.</p>'+
        '<div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button type="button" class="btn btn-danger" onclick="doDeleteTransferencia(\''+id+'\')">Remover</button></div>'+
      '</div>'+
    '</div>';
  document.getElementById("modal-root").innerHTML = html;
}
async function doDeleteTransferencia(id){
  const t = STATE.transferencias.find(x=>x.id===id);
  if(t){
    const origem = STATE.materiais.find(x=>x.id===t.materialOrigemId);
    const destino = STATE.materiais.find(x=>x.id===t.materialDestinoId);
    const { error:delErr } = await sb.from("transferencias").delete().eq("id", id);
    if(delErr){ sbErrorToast("remover transferência", delErr); return; }
    const writes = [];
    if(origem) writes.push(sb.from("materiais").update({estoque:Math.round((origem.estoque + t.quantidade)*100)/100}).eq("id", origem.id));
    if(destino) writes.push(sb.from("materiais").update({estoque:Math.round((destino.estoque - t.quantidade)*100)/100}).eq("id", destino.id));
    const results = await Promise.all(writes);
    results.forEach(r=>{ if(r.error) sbErrorToast("estornar estoque da transferência", r.error); });
    if(origem) origem.estoque = Math.round((origem.estoque + t.quantidade)*100)/100;
    if(destino) destino.estoque = Math.round((destino.estoque - t.quantidade)*100)/100;
    STATE.transferencias = STATE.transferencias.filter(x=>x.id!==id);
    await Promise.all([
      origem ? logMovimento(origem.id, "entrada", t.quantidade, "transferencia", "Estorno — de "+(destino?destino.nome:"?")) : Promise.resolve(),
      destino ? logMovimento(destino.id, "saida", t.quantidade, "transferencia", "Estorno — para "+(origem?origem.nome:"?")) : Promise.resolve(),
    ]);
  }
  closeModal();
  renderScreen();
  showToast("info","Transferência estornada.");
}

function clearTransferenciaFiltro(){ STATE.transferenciaFiltro = {materialOrigemId:"",materialDestinoId:"",dIni:"",dFim:""}; renderScreen(); }

        '</select></div>'+

      if(error){ sbErrorToast("cadastrar matéria-prima", error); return false; }
      STATE.materiais.push(mapMaterialFromRow(inserted));
      if(data.tipo && !STATE.materialTipos.includes(data.tipo)){ STATE.materialTipos.push(data.tipo); await configSet("material_tipos", STATE.materialTipos); }
      showToast("success","Matéria-prima cadastrada.");
    },
    onUpdate: async(id,data)=>{
      const mAtual = STATE.materiais.find(x=>x.id===id);
      const admin = isCurrentUserAdmin();
      /* O estoque não é editável diretamente neste formulário. Ele só muda por
         Acerto de Estoque ou, aqui, como consequência de o administrador ter
         alterado o Saldo Inicial — nesse caso é recalculado pela mesma fórmula
         do modal: Saldo Inicial + Entradas − Saídas. */
      const inicialAnterior = Number((mAtual&&mAtual.estoqueInicial)||0);
      const estoqueInicialVal = (admin && data.estoqueInicial!==undefined && data.estoqueInicial!=="")
        ? Number(data.estoqueInicial)
        : inicialAnterior;
      const row = {
        tipo:data.tipo, nome:data.nome, cor:data.cor==="S"?"S":"N", unidade:data.unidade,
        estoque_inicial:estoqueInicialVal, estoque_minimo:Number(data.estoqueMinimo||0), lote_minimo:Number(data.loteMinimo||0),
        fator:Number(data.fator||1), valor_unitario:Number(data.valorUnitario||0),
      };
      const mudouInicial = admin && Math.abs(estoqueInicialVal - inicialAnterior) >= 0.005;
      let novoEstoque = null, estoqueAnterior = null;
      if(mudouInicial && mAtual){
        const t = movTotaisDoMaterial(id);
        estoqueAnterior = Number(mAtual.estoque||0);
        novoEstoque = Math.round((estoqueInicialVal + t.entradas - t.saidas)*100)/100;
        row.estoque = novoEstoque;
      }
      const { error } = await sb.from("materiais").update(row).eq("id", id);
      if(error){ sbErrorToast("atualizar matéria-prima", error); return false; }
      const m=STATE.materiais.find(x=>x.id===id);
      if(m){ m.tipo=data.tipo; m.nome=data.nome; m.cor=row.cor; m.unidade=data.unidade; m.estoqueInicial=row.estoque_inicial; m.estoqueMinimo=row.estoque_minimo; m.loteMinimo=row.lote_minimo; m.fator=row.fator; m.valorUnitario=row.valor_unitario; if(novoEstoque!==null) m.estoque=novoEstoque; }
      if(novoEstoque!==null){
        const delta = Math.round((novoEstoque - estoqueAnterior)*100)/100;
        if(delta) await logMovimento(id, delta>0?"entrada":"saida", delta, "ajuste", "Alteração do saldo inicial para "+fmtNum(estoqueInicialVal)+" "+row.unidade);
        showToast("success","Saldo inicial alterado — saldo atual recalculado para "+fmtNum(novoEstoque)+" "+row.unidade+".");
      }
      if(data.tipo && !STATE.materialTipos.includes(data.tipo)){ STATE.materialTipos.push(data.tipo); await configSet("material_tipos", STATE.materialTipos); }
    },
    onDelete: async(id)=>{
      const { error } = await sb.from("materiais").delete().eq("id", id);
      if(error){ sbErrorToast("remover matéria-prima", error); return false; }
      STATE.materiais = STATE.materiais.filter(x=>x.id!==id);
    },
  },
  motorista: {
    title:"Motoristas", subtitle:"Cadastro de motoristas para a Programação de Entrega", icon:"truck",
    newLabel:"Novo Motorista", editLabel:"Editar Motorista",
    items: ()=>STATE.motoristas,
    columns: [{key:"nome", label:"Nome"}, {key:"telefone", label:"Telefone"}],
    fields: [
      {key:"nome", label:"Nome do motorista", type:"text", required:true},
      {key:"telefone", label:"Telefone", type:"text"},

      if(error){ sbErrorToast("cadastrar motorista", error); return false; }

      if(error){ sbErrorToast("atualizar motorista", error); return false; }
      const m=STATE.motoristas.find(x=>x.id===id); if(m){ m.nome=data.nome; m.telefone=data.telefone; }
    },
    onDelete: async(id)=>{
      const { error } = await sb.from("motoristas").delete().eq("id", id);
      if(error){ sbErrorToast("remover motorista", error); return false; }
      STATE.motoristas = STATE.motoristas.filter(x=>x.id!==id);
    },

/* Mantém o Saldo Inicial cadastrado e reescreve o Saldo Atual pela conta oficial
   Saldo Inicial + Entradas − Saídas. É a correção certa quando o estoque real foi
   baixado a mais (ou a menos) por um lançamento duplicado. */
async function recalcularSaldoAtual(id){
  const m = STATE.materiais.find(x=>x.id===id);
  if(!m) return;
  if(!isCurrentUserAdmin()){ showToast("error","Apenas administradores podem recalcular o saldo."); return; }
  const t = movTotaisDoMaterial(m.id);
  const novoSaldo = Math.round((Number(m.estoqueInicial||0) + t.entradas - t.saidas)*100)/100;
  const anterior = Number(m.estoque||0);
  const delta = Math.round((novoSaldo - anterior)*100)/100;
  if(!delta){ showToast("info","O saldo atual já está correto."); closeModal(); return; }
  const { error } = await sb.from("materiais").update({estoque:novoSaldo}).eq("id", id);
  if(error){ sbErrorToast("recalcular saldo atual", error); return; }
  m.estoque = novoSaldo;
  await logMovimento(id, delta>0?"entrada":"saida", delta, "ajuste",
    "Recálculo do saldo atual (correção de divergência) para "+fmtNum(novoSaldo)+" "+m.unidade);
  closeModal();
  renderScreen();
  showToast("success","Saldo atual de "+m.nome+" corrigido de "+fmtNum(anterior)+" para "+fmtNum(novoSaldo)+" "+m.unidade+".");
}
function previewSaldoInicial(id){
  const m = STATE.materiais.find(x=>x.id===id);
  const box = document.getElementById("saldo-inicial-preview");
  if(!m || !box) return;
  const t = movTotaisDoMaterial(m.id);
  const novo = Number((document.getElementById("saldo-inicial-input")||{}).value||0);
  const novoSaldo = Math.round((novo + t.entradas - t.saidas)*100)/100;
  const delta = Math.round((novoSaldo - Number(m.estoque||0))*100)/100;
  const cor = novoSaldo < 0 ? COLORS.red : COLORS.brand;
  box.innerHTML =
    '<div style="display:flex;justify-content:space-between;gap:12px"><span style="color:'+COLORS.textMuted+'">Novo Saldo Atual</span>'+
      '<span style="font-family:\'IBM Plex Mono\',monospace;font-weight:700;color:'+cor+';white-space:nowrap">'+fmtNum(novoSaldo)+'&nbsp;'+m.unidade+'</span></div>'+
    (delta ? '<div style="display:flex;justify-content:space-between;gap:12px;margin-top:4px;font-size:12px"><span style="color:'+COLORS.textMuted+'">Variação no estoque</span>'+
      '<span style="font-family:\'IBM Plex Mono\',monospace;color:'+(delta>0?COLORS.green:COLORS.red)+';white-space:nowrap">'+(delta>0?"+":"")+fmtNum(delta)+'&nbsp;'+m.unidade+'</span></div>' : '')+
    (novoSaldo < 0 ? '<div style="margin-top:6px;font-size:11.5px;color:'+COLORS.red+';line-height:1.4">Saldo negativo é fisicamente impossível — confira se as saídas lançadas estão corretas antes de salvar.</div>' : '');
}
async function salvarSaldoInicial(id){
  const m = STATE.materiais.find(x=>x.id===id);
  if(!m) return;
  if(!isCurrentUserAdmin()){ showToast("error","Apenas administradores podem alterar o saldo inicial."); return; }
  const novo = Number((document.getElementById("saldo-inicial-input")||{}).value||0);
  const t = movTotaisDoMaterial(m.id);
  const novoSaldo = Math.round((novo + t.entradas - t.saidas)*100)/100;
  const anterior = Number(m.estoque||0);
  const { error } = await sb.from("materiais").update({estoque_inicial:novo, estoque:novoSaldo}).eq("id", id);
  if(error){ sbErrorToast("alterar saldo inicial", error); return; }
  m.estoqueInicial = novo;
  m.estoque = novoSaldo;
  const delta = Math.round((novoSaldo - anterior)*100)/100;
  if(delta) await logMovimento(id, delta>0?"entrada":"saida", delta, "ajuste", "Alteração do saldo inicial para "+fmtNum(novo)+" "+m.unidade);
  closeModal();
  renderScreen();
  showToast("success","Saldo inicial de "+m.nome+" alterado para "+fmtNum(novo)+" "+m.unidade+" — saldo atual recalculado para "+fmtNum(novoSaldo)+" "+m.unidade+".");
}
async function toggleMaterialAtencao(id){

function fieldHtml(f, item){
  const val = item ? (item[f.key] != null ? item[f.key] : "") : (f.default || "");
  const label = '<label class="field-label">'+f.label+(f.required?" *":"")+'</label>';
  /* Campo travado na edição (ex.: Estoque atual — só muda por Acerto de Estoque)
     ou restrito a administradores (ex.: Saldo Inicial). Renderiza como leitura,
     mantendo um hidden para o valor continuar sendo enviado sem alteração. */
  const travadoEdicao = f.lockOnEdit && item;
  const travadoAdmin = f.adminOnly && !isCurrentUserAdmin();
  if(travadoEdicao || travadoAdmin){
    const hint = travadoAdmin ? "Somente administradores podem alterar" : (f.lockHint || "Não editável aqui");
    return '<div style="'+(f.full?"grid-column:1 / -1":"")+'">'+label+
      '<div class="field-input" style="background:var(--panel-alt);color:'+COLORS.textMuted+';display:flex;align-items:center;justify-content:space-between;gap:8px">'+
        '<span>'+escapeHtml(String(val===""?"—":val))+'</span>'+icon("alert",12,COLORS.textMuted)+
      '</div>'+
      '<input type="hidden" id="f-'+f.key+'" name="'+f.key+'" value="'+escapeAttr(val)+'"/>'+
      '<p style="font-size:10.5px;color:'+COLORS.textMuted+';margin:4px 0 0;line-height:1.4">'+hint+'</p>'+
    '</div>';
  }
  let control;
  if(f.type==="select"){
    const opts = f.options();
    control = '<select class="field-select" id="f-'+f.key+'" name="'+f.key+'" '+(f.required?"required":"")+'><option value="">Selecione…</option>'+
      opts.map(o=>'<option value="'+escapeAttr(o.value)+'" '+(String(val)===String(o.value)?"selected":"")+'>'+escapeHtml(o.label)+'</option>').join('')+
      '</select>';
  } else if(f.type==="number"){
    control = '<input class="field-input" id="f-'+f.key+'" type="number" step="0.01" name="'+f.key+'" value="'+escapeAttr(val)+'" '+(f.placeholder?'placeholder="'+escapeAttr(f.placeholder)+'"':"")+' '+(f.required?"required":"")+'/>';
  } else {
    const listId = "dl-"+f.key;
    const listAttr = f.datalist ? ' list="'+listId+'"' : '';
    control = '<input class="field-input" id="f-'+f.key+'" type="text" name="'+f.key+'" value="'+escapeAttr(val)+'"'+listAttr+' '+(f.placeholder?'placeholder="'+escapeAttr(f.placeholder)+'"':"")+' '+(f.required?"required":"")+'/>';
    if(f.datalist){ control += '<datalist id="'+listId+'">'+f.datalist().map(o=>'<option value="'+escapeAttr(o)+'">').join('')+'</datalist>'; }
    if(f.quickAddType){ control += '<div id="qa-'+f.quickAddType+'">'+quickAddButtonHtml(f.quickAddType)+'</div>'; }
  }
  const hintHtml = f.hint ? '<p style="font-size:10.5px;color:'+COLORS.textMuted+';margin:4px 0 0;line-height:1.4">'+f.hint+'</p>' : '';
  return '<div style="'+(f.full?"grid-column:1 / -1":"")+'">'+label+control+hintHtml+'</div>';
}

async function submitEntityForm(event, type, mode, id){
  event.preventDefault();
  const cfg = ENTITY_CONFIGS[type];
  const fd = new FormData(event.target);
  const data = Object.fromEntries(fd.entries());
  const submitBtn = event.target.querySelector('button[type="submit"]');
  if(submitBtn) submitBtn.disabled = true;
  const ok = mode==="new" ? await cfg.onAdd(data) : await cfg.onUpdate(id, data);
  if(submitBtn) submitBtn.disabled = false;
  if(ok===false) return false;
  closeModal();
  renderScreen();
  return false;

/* ============================== PEDIDOS ============================== */
function computeConsumption(pedido){
  const map = {};
  if(!pedido) return map;
  const m = Number(pedido.metragem||0);
  if(pedido.corSupId) map[pedido.corSupId] = (map[pedido.corSupId]||0) + m;
  if(pedido.corInfId) map[pedido.corInfId] = (map[pedido.corInfId]||0) + m;
  if(pedido.epsId){
    const mat = STATE.materiais.find(mm=>mm.id===pedido.epsId);
    const fator = mat ? Number(mat.fator||1) : 1;
    map[pedido.epsId] = (map[pedido.epsId]||0) + m*fator;
  }
  return map;
}
function isPedidoPreProducao(pedido){
  if(!pedido) return false;
  const st = STATE.statusOptions.find(s=>s.id===pedido.situacaoId);
  return st ? isStatusPreProducao(st.nome) : false;
}
/* Consumo "efetivo": o que de fato deve ser baixado do estoque real.
   Enquanto o pedido estiver em situação de Pré-produção, o consumo é 0 —
   ele só é baixado quando a situação deixa de ser Pré-produção (ex.: Em Produção). */
function computeEffectiveConsumption(pedido){
  if(!pedido) return {};
  if(isPedidoPreProducao(pedido)) return {};
  return computeConsumption(pedido);
}
/* Totais reservados (ainda não baixados) para pedidos em Pré-produção, por material.
   Usado apenas para visualização (coluna "Pré-produção" no estoque, filtros, etc). */
function preProducaoTotals(){
  const totals = {};
  STATE.pedidos.forEach(p=>{
    if(!isPedidoPreProducao(p)) return;
    const map = computeConsumption(p);
    Object.keys(map).forEach(id=>{ totals[id] = (totals[id]||0) + map[id]; });
  });
  return totals;
}
/* Serializa e torna IDEMPOTENTES as operações que baixam estoque a partir de pedidos.
   O problema original: adjustStock() calculava o delta comparando um "pedido antigo"
   lido em memória com o novo. Se a mesma alteração fosse processada duas vezes (duplo
   clique em Salvar, troca rápida de situação, conclusão de etapa disparada duas vezes),
   as duas chamadas liam o MESMO pedido antigo e cada uma baixava o consumo inteiro —
   o estoque caía o dobro, mesmo existindo um único lançamento de saída. Foi isso que
   deixou o Preto 58,80 m abaixo do que a conta Saldo Inicial + Entradas − Saídas indica.

   A correção: guardar, por pedido, quanto consumo já foi efetivamente aplicado ao
   estoque (_consumoAplicado). O delta passa a ser "o que deveria estar baixado" menos
   "o que já está baixado" — então reprocessar a mesma alteração dá delta 0. */
const _consumoAplicado = {};
let _stockOpChain = Promise.resolve();
function runStockOp(fn){
  const run = ()=>fn();
  const next = _stockOpChain.then(run, run);
  _stockOpChain = next.then(()=>{}, ()=>{});
  return next;
}
/* Chamado depois de carregar os dados: o estoque que veio do banco já reflete o
   consumo dos pedidos como eles estão hoje. */
function initConsumoAplicado(){
  Object.keys(_consumoAplicado).forEach(k=>{ delete _consumoAplicado[k]; });
  STATE.pedidos.forEach(p=>{ _consumoAplicado[p.id] = computeEffectiveConsumption(p); });
}
async function adjustStock(oldPedido, newPedido){
  const pedidoRef = newPedido||oldPedido;
  if(!pedidoRef) return;
  const pid = pedidoRef.id;
  return runStockOp(async ()=>{
    const jaAplicado = Object.prototype.hasOwnProperty.call(_consumoAplicado, pid)
      ? _consumoAplicado[pid]
      : computeEffectiveConsumption(oldPedido);
    const desejado = newPedido ? computeEffectiveConsumption(newPedido) : {};
    const ids = new Set([...Object.keys(jaAplicado), ...Object.keys(desejado)]);
    /* Marca o novo estado ANTES dos awaits: se a mesma alteração for reprocessada
       enquanto esta ainda roda, ela já encontra o consumo como aplicado e não repete. */
    if(newPedido) _consumoAplicado[pid] = desejado; else delete _consumoAplicado[pid];
    const refTxt = "Pedido OP "+(pedidoRef.op||pedidoRef.id)+(pedidoRef.cliente?(" · "+pedidoRef.cliente):"");
    /* Sequencial (não Promise.all): dois itens do mesmo pedido podem apontar para o
       mesmo material (ex.: Cor Sup. e Cor Inf. iguais) e não podem ler o mesmo saldo. */
    for(const id of ids){
      const delta = Math.round(((desejado[id]||0) - (jaAplicado[id]||0))*100)/100;
      if(!delta) continue;
      const mat = STATE.materiais.find(m=>m.id===id);
      if(!mat) continue;
      const novoEstoque = Math.round((mat.estoque - delta)*100)/100;
      const r = await sb.from("materiais").update({estoque:novoEstoque}).eq("id", id);
      if(r.error){ sbErrorToast("ajustar estoque de "+mat.nome, r.error); continue; }
      mat.estoque = novoEstoque;
      await logMovimento(id, delta>0?"saida":"entrada", delta, "producao", refTxt);
    }
  });
}
async function savePedido(id, data){
  const parsed = Object.assign({}, data, {metragem: Number(data.metragem||0), temPintura: !!data.temPintura, temColagem: !!data.temColagem});
  if(id){
    const old = STATE.pedidos.find(p=>p.id===id);
    const updated = Object.assign({}, old, parsed, {id});
    const stagesChanged = (!!old.temPintura!==updated.temPintura) || (!!old.temColagem!==updated.temColagem);
    let repositioned = false;
    if(stagesChanged && old.etapaAtual!=="entregue"){
      const oldOrder = stageOrderFor(old);
      const newOrder = stageOrderFor(updated);
      let oldIdx = oldOrder.indexOf(old.etapaAtual);
      if(oldIdx===-1) oldIdx = 0;
      const newIdx = Math.min(oldIdx, newOrder.length-1);
      const newStage = newOrder[newIdx];
      if(newStage!==old.etapaAtual){
        updated.etapaAtual = newStage;
        updated.producaoStartedAt = null;
        updated.producaoElapsedMs = 0;
        updated.producaoStatus = "idle";
        repositioned = true;
      }
    }
    const { error } = await sb.from("pedidos").update(pedidoToRow(updated)).eq("id", id);
    if(error){ sbErrorToast("atualizar pedido", error); return false; }
    /* STATE atualizado antes do adjustStock para que a tela e os cálculos ao vivo
       (Entradas/Saídas) já reflitam o pedido novo. A proteção contra baixa dupla em
       si fica por conta da idempotência do adjustStock. */
    STATE.pedidos = STATE.pedidos.map(p=>p.id===id?updated:p);
    await adjustStock(old, updated);
    showToast("success", repositioned ? "Pedido atualizado — etapa reposicionada para "+(STAGE_DEFS[updated.etapaAtual]?STAGE_DEFS[updated.etapaAtual].label:updated.etapaAtual)+" conforme o novo fluxo." : "Pedido atualizado e estoque ajustado.");
  } else {
    const base = Object.assign({etapaAtual:"perfilar", motoristaId:"", dataEntregue:"", producaoStatus:"idle", producaoElapsedMs:0, producaoStartedAt:null}, parsed);
    const { data:row, error } = await sb.from("pedidos").insert(pedidoToRow(base)).select().single();
    if(error){ sbErrorToast("lançar pedido", error); return false; }
    const novo = mapPedidoFromRow(row);
    STATE.pedidos = [novo, ...STATE.pedidos];
    await adjustStock(null, novo);
    showToast("success","Pedido lançado e estoque atualizado.");
  }
}

  const old = STATE.pedidos.find(p=>p.id===id);

  if(error){ sbErrorToast("remover pedido", error); return false; }
  STATE.pedidos = STATE.pedidos.filter(p=>p.id!==id);
